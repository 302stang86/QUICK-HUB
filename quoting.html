/* Scope & Notes start unchecked (pick what applies to this job).
   Scope items carry an optional subs[] list shown once the item is selected.
   Including/Excluding items carry a mode: "inc", "exc", or "off". */
const state = {};
state.scope = LIBRARY.scope.map(entry => {
  const obj = typeof entry === "string" ? { text: entry, subs: [] } : entry;
  return {
    text: obj.text,
    checked: false,
    subs: (obj.subs || []).map(s => ({ text: s, checked: false }))
  };
});
state.notes = LIBRARY.notes.map(t => ({ text: t, checked: false }));
/* Qualifications and boilerplate default ON — uncheck to drop from a proposal. */
for (const key of ["quals","resp","billing","closing"]) {
  state[key] = LIBRARY[key].map(t => ({ text: t, checked: true }));
}
state.incexc = LIBRARY.incexc.map(i => ({ text: i.text, mode: i.mode }));

/* ---------------- rendering ---------------- */
function autoGrow(ta){ ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; }

function render(key){
  if (key === "incexc") return renderIncExc();
  const ul = document.getElementById("list-" + key);
  ul.innerHTML = "";
  const filter = (document.querySelector(`[data-filter="${key}"]`)?.value || "").toLowerCase();
  state[key].forEach((item, i) => {
    if (filter && !item.text.toLowerCase().includes(filter)) return;
    const li = document.createElement("li");
    li.className = "item" + (item.checked ? "" : " unchecked");
    li.dataset.index = i;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = item.checked;
    cb.addEventListener("change", () => {
      item.checked = cb.checked;
      li.classList.toggle("unchecked", !cb.checked);
      updateCount(key);
      if (key === "scope") render(key); // open/close the sub-item block
    });

    const ta = document.createElement("textarea");
    ta.rows = 1;
    ta.value = item.text;
    ta.addEventListener("input", () => { item.text = ta.value; autoGrow(ta); });
    ta.addEventListener("focus", () => autoGrow(ta));

    const del = document.createElement("button");
    del.className = "del";
    del.title = "Remove item";
    del.innerHTML = "&times;";
    del.addEventListener("click", () => { state[key].splice(i,1); render(key); updateCount(key); });

    li.append(cb, ta, del);

    // Optional subcategory: shown only when the scope item is selected
    if (key === "scope" && item.checked){
      const subUl = document.createElement("ul");
      subUl.className = "subs";
      item.subs.forEach((sub, j) => {
        const sli = document.createElement("li");
        sli.className = "sub" + (sub.checked ? "" : " unchecked");

        const scb = document.createElement("input");
        scb.type = "checkbox";
        scb.checked = sub.checked;
        scb.addEventListener("change", () => {
          sub.checked = scb.checked;
          sli.classList.toggle("unchecked", !scb.checked);
          updateCount(key);
        });

        const sta = document.createElement("textarea");
        sta.rows = 1;
        sta.value = sub.text;
        sta.addEventListener("input", () => { sub.text = sta.value; autoGrow(sta); });
        sta.addEventListener("focus", () => autoGrow(sta));

        const sdel = document.createElement("button");
        sdel.className = "del";
        sdel.title = "Remove sub-item";
        sdel.innerHTML = "&times;";
        sdel.addEventListener("click", () => { item.subs.splice(j,1); render(key); updateCount(key); });

        sli.append(scb, sta, sdel);
        subUl.appendChild(sli);
        (window.requestAnimationFrame || (fn => setTimeout(fn, 0)))(() => autoGrow(sta));
      });

      const addSub = document.createElement("button");
      addSub.className = "addsub";
      addSub.type = "button";
      addSub.textContent = "+ Sub-item";
      addSub.addEventListener("click", () => {
        item.subs.push({ text: "", checked: true });
        render(key);
        const parent = ul.querySelector(`li.item[data-index="${i}"]`);
        const nt = parent && parent.querySelector("ul.subs li.sub:last-of-type textarea");
        if (nt) nt.focus();
      });
      subUl.appendChild(document.createElement("li")).appendChild(addSub);

      li.appendChild(subUl);
    }

    ul.appendChild(li);
    autoGrow(ta);
  });
  updateCount(key);
}

function renderIncExc(){
  const ul = document.getElementById("list-incexc");
  ul.innerHTML = "";
  state.incexc.forEach((item, i) => {
    const li = document.createElement("li");
    li.className = "item" + (item.mode === "off" ? " omitted" : "");

    const seg = document.createElement("div");
    seg.className = "seg";
    const modes = [ ["inc","INCL","on-inc"], ["exc","EXCL","on-exc"], ["off","\u2014","on-off"] ];
    modes.forEach(([mode, label, cls]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.title = mode === "inc" ? "Included" : mode === "exc" ? "Excluded" : "Leave off the proposal";
      if (item.mode === mode) b.classList.add(cls);
      b.addEventListener("click", () => { item.mode = mode; renderIncExc(); });
      seg.appendChild(b);
    });

    const ta = document.createElement("textarea");
    ta.rows = 1;
    ta.value = item.text;
    ta.addEventListener("input", () => { item.text = ta.value; autoGrow(ta); });
    ta.addEventListener("focus", () => autoGrow(ta));

    const del = document.createElement("button");
    del.className = "del";
    del.title = "Remove item";
    del.innerHTML = "&times;";
    del.addEventListener("click", () => { state.incexc.splice(i,1); renderIncExc(); });

    li.append(seg, ta, del);
    ul.appendChild(li);
    autoGrow(ta);
  });
  updateCount("incexc");
}

function updateCount(key){
  const el = document.querySelector(`[data-count="${key}"]`);
  if (!el) return;
  if (key === "incexc"){
    const inc = state.incexc.filter(i => i.mode === "inc").length;
    const exc = state.incexc.filter(i => i.mode === "exc").length;
    el.textContent = inc + " included \u00b7 " + exc + " excluded";
  } else if (key === "scope"){
    const sel = state.scope.filter(i => i.checked);
    const subs = sel.reduce((n,i) => n + i.subs.filter(s => s.checked).length, 0);
    el.textContent = sel.length + " selected" + (subs ? " \u00b7 " + subs + " sub-item" + (subs === 1 ? "" : "s") : "");
  } else {
    el.textContent = state[key].filter(i => i.checked).length + " selected";
  }
}

document.querySelectorAll("[data-add]").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.add;
    if (key === "incexc"){
      state.incexc.push({ text: "", mode: "inc" });
    } else {
      state[key].push({ text: "", checked: true, subs: [] });
      const f = document.querySelector(`[data-filter="${key}"]`);
      if (f) f.value = "";
    }
    render(key);
    const ul = document.getElementById("list-" + key);
    const last = ul.querySelector("li:last-child textarea");
    if (last) last.focus();
  });
});

document.querySelectorAll("[data-filter]").forEach(inp => {
  inp.addEventListener("input", () => render(inp.dataset.filter));
});

/* ---------------- draft restore (hydrate from embedded saved state) ---------------- */
document.getElementById("metaLine").textContent = "V" + APP_META.version + " \u00b7 " + APP_META.author;
document.title = "FDEC Annual Inspection" + " V" + APP_META.version;

/* Merge any newer LIBRARY items into a restored section so additions made
   after a draft was saved are never hidden. Saved items keep their text,
   checked state, and sub-items; library items not present in the saved list
   are appended (unchecked). Scope library entries may be strings or objects
   with subs[]. Matching is by normalized text. */
function mergeLibraryInto(key, savedArr){
  const norm = t => String(t || "").replace(/\s+/g, " ").trim().toLowerCase();
  const out = Array.isArray(savedArr) ? savedArr.slice() : [];
  const seen = new Set(out.map(it => norm(it && it.text)));
  (LIBRARY[key] || []).forEach(entry => {
    if (key === "incexc"){
      const text = entry.text;
      if (!seen.has(norm(text))){ out.push({ text: text, mode: entry.mode }); seen.add(norm(text)); }
      return;
    }
    const obj = (typeof entry === "string") ? { text: entry, subs: [] } : entry;
    if (!seen.has(norm(obj.text))){
      out.push({
        text: obj.text,
        checked: false,
        subs: (obj.subs || []).map(s => ({ text: s, checked: false }))
      });
      seen.add(norm(obj.text));
    }
  });
  return out;
}

let restoredMsg = "";
(function hydrate(){
  const el = document.getElementById("savedState");
  if (!el) return;
  try {
    const saved = JSON.parse(el.textContent);
    if (saved.job){
      document.getElementById("jobCustomer").value = saved.job.customer || "";
      document.getElementById("jobQuote").value    = saved.job.quote    || "";
      // Date intentionally not restored from the template — it is always set
      // to today's date on open (see below).
      if (saved.job.intro) document.getElementById("jobIntro").value = saved.job.intro;
      if (saved.job.signature != null) document.getElementById("jobSignature").value = saved.job.signature;
    }
    if (saved.sections){
      for (const key of ["scope","notes","quals","resp","billing","closing","incexc"]){
        if (Array.isArray(saved.sections[key])) state[key] = mergeLibraryInto(key, saved.sections[key]);
      }
      // guarantee scope items have a subs array
      state.scope.forEach(i => { if (!Array.isArray(i.subs)) i.subs = []; });
    }
    const when = saved.meta && saved.meta.savedAt ? new Date(saved.meta.savedAt) : null;
    restoredMsg = "Draft restored" + (when ? " \u2014 saved " + when.toLocaleString() : "") + ".";
  } catch(e){ console.error("Could not restore saved draft:", e); }
})();

["scope","notes","quals","resp","billing","closing","incexc"].forEach(render);
// Always open with today's date (local, not UTC, to avoid an off-by-one).
(function(){
  const d = new Date();
  const local = d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
  document.getElementById("jobDate").value = local;
})();

/* ---------------- Shared job-info sync ----------------
   Repair Verbiage is the MASTER for Job Name / Quote # / Date. When these
   change here, broadcast to the suite shell, which relays the values to the
   other pages. Followers (the generated clone pages) set IS_JOBINFO_MASTER
   to false and only receive. */
var IS_JOBINFO_MASTER = false;
(function(){
  function currentJobInfo(){
    return {
      customer: document.getElementById("jobCustomer").value,
      quote:    document.getElementById("jobQuote").value,
      date:     document.getElementById("jobDate").value
    };
  }
  function broadcastJobInfo(){
    if (!IS_JOBINFO_MASTER) return;
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"jobinfo", value: currentJobInfo() }, "*");
    }
  }
  function applyJobInfo(v){
    if (!v) return;
    if (typeof v.customer === "string") document.getElementById("jobCustomer").value = v.customer;
    if (typeof v.quote === "string")    document.getElementById("jobQuote").value = v.quote;
    if (typeof v.date === "string" && v.date) document.getElementById("jobDate").value = v.date;
  }
  // Master: broadcast on any edit to the three shared fields.
  if (IS_JOBINFO_MASTER){
    ["jobCustomer","jobQuote","jobDate"].forEach(function(id){
      var el = document.getElementById(id);
      if (el){ el.addEventListener("input", broadcastJobInfo); el.addEventListener("change", broadcastJobInfo); }
    });
    // Broadcast the initial values (incl. today's date) once the shell is ready.
    setTimeout(broadcastJobInfo, 150);
  }

  /* Auto-save this page to the suite shell (crash protection), debounced.
     Silent no-op when opened standalone. */
  var _autosaveTimer = null;
  function scheduleAutosave(){
    if (!(window.parent && window.parent !== window)) return;
    clearTimeout(_autosaveTimer);
    _autosaveTimer = setTimeout(function(){
      try {
        window.parent.postMessage({ fdec:true, type:'autosave', page:SUITE_PAGE_ID, data:collectState() }, '*');
      } catch(_){}
    }, 1200);
  }
  document.addEventListener("input", scheduleAutosave);
  document.addEventListener("change", scheduleAutosave);
  document.addEventListener("click", function(e){
    // Catch add/remove/toggle actions that change state without an input event.
    if (e.target.closest("button")) setTimeout(scheduleAutosave, 50);
  });
  // Tell the shell when the user starts working, so it can dismiss the
  // "restore previous session?" banner.
  document.addEventListener("focusin", function(e){
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")){
      if (window.parent && window.parent !== window){
        try { window.parent.postMessage({ fdec:true, type:"user-active" }, "*"); } catch(_){}
      }
    }
  });
  // Everyone: accept incoming job-info from the shell. The shell only relays
  // to followers, so the master won't receive its own broadcast.
  window.addEventListener("message", function(e){
    var d = e && e.data;
    if (!d || d.fdec !== true) return;
    if (d.type === "jobinfo") applyJobInfo(d.value);
    // A follower loaded and asked for values; the shell forwards this to the
    // master as 'send-jobinfo'. Master responds by broadcasting current values.
    else if (d.type === "send-jobinfo" && IS_JOBINFO_MASTER) broadcastJobInfo();
  });
  // Followers can request the current values when they load/become visible.
  if (!IS_JOBINFO_MASTER){
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"request-jobinfo" }, "*");
    }
  }
})();

if (restoredMsg) setTimeout(() => setStatus(restoredMsg, true), 100);

/* When this app first renders inside a hidden iframe (the Quoting tab is
   shown by default), every textarea measures scrollHeight = 0 and collapses
   so its text is invisible. Re-grow all textareas once the tab is actually
   visible. The suite shell posts {type:'relayout'} on tab switch; we also
   listen for our own becoming-visible as a fallback. */
function relayoutTextareas(){
  var run = function(){ document.querySelectorAll("textarea").forEach(autoGrow); };
  // Defer so the browser has laid out the now-visible iframe before we
  // read scrollHeight; run twice to catch any late layout.
  if (typeof requestAnimationFrame === "function"){
    requestAnimationFrame(function(){ run(); requestAnimationFrame(run); });
  } else {
    run();
  }
}
window.addEventListener("message", function(e){
  var d = e && e.data;
  if (d && d.fdec === true && d.type === "relayout") relayoutTextareas();
});
/* Self-healing: when this document transitions from hidden (0 size) to
   visible, re-measure textareas automatically — independent of the shell.
   Covers the case where the app first rendered inside a hidden iframe. */
(function(){
  var seenVisible = false;
  function checkVisible(){
    var visible = document.body && document.body.clientHeight > 0 &&
                  document.documentElement.clientWidth > 0;
    if (visible && !seenVisible){ seenVisible = true; relayoutTextareas(); }
  }
  if (typeof ResizeObserver === "function"){
    try { new ResizeObserver(checkVisible).observe(document.documentElement); } catch(_){}
  }
  window.addEventListener("resize", checkVisible);
  document.addEventListener("visibilitychange", checkVisible);
  // initial + a few delayed attempts to catch first layout
  checkVisible();
  [60, 200, 500].forEach(function(ms){ setTimeout(checkVisible, ms); });
})();
/* Fallback: if this document becomes visible via layout, relayout once. */
if (typeof requestAnimationFrame === "function"){
  requestAnimationFrame(function(){ if (document.body.clientHeight) relayoutTextareas(); });
}

/* ---------------- output helpers ---------------- */
function checkedItems(key){
  return state[key].filter(i => i.checked && i.text.trim()).map(i => i.text.trim());
}
function scopeItems(){
  return state.scope
    .filter(i => i.checked && i.text.trim())
    .map(i => ({
      text: i.text.trim(),
      subs: i.subs.filter(s => s.checked && s.text.trim()).map(s => s.text.trim())
    }));
}
function incexcItems(mode){
  return state.incexc.filter(i => i.mode === mode && i.text.trim()).map(i => i.text.trim());
}
function letterFor(n){ // 0 -> A, 25 -> Z, 26 -> AA
  let s = "";
  n += 1;
  while (n > 0){ n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}
function fmtDate(iso){
  if (!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
}
function jobHeader(){
  return {
    customer: document.getElementById("jobCustomer").value.trim(),
    recipient:"",
    address:  "",
    quote:    document.getElementById("jobQuote").value.trim(),
    date:     fmtDate(document.getElementById("jobDate").value),
    intro:    document.getElementById("jobIntro").value.trim(),
    signature:document.getElementById("jobSignature").value.replace(/\s+$/,"")
  };
}
function setStatus(msg, ok){
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = ok ? "ok" : "";
  if (msg) setTimeout(() => { s.textContent = ""; s.className = ""; }, 4000);
}

/* ---------------- Word generation (WordprocessingML via JSZip) ---------------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}
// run properties: Calibri 11pt by default
function rPr(o={}){
  return `<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>` +
         (o.bold ? "<w:b/>" : "") +
         (o.underline ? `<w:u w:val="single"/>` : "") +
         (o.color ? `<w:color w:val="${o.color}"/>` : "") +
         `<w:sz w:val="${o.size || 22}"/><w:szCs w:val="${o.size || 22}"/></w:rPr>`;
}
function textRun(t, o={}){
  return `<w:r>${rPr(o)}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
}
// plain paragraph
function xPara(runsXml, { before=0, after=120 } = {}){
  return `<w:p><w:pPr><w:spacing w:before="${before}" w:after="${after}"/></w:pPr>${runsXml}</w:p>`;
}
// numbered/lettered list paragraph with hanging indent (label + tab + text)
function xListPara(label, text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="720"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="720" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun(label) +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}
// second-level sub-item paragraph (a., b., …) indented under its parent
function xSubListPara(label, text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="1440"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="1440" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun(label) +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}
function xHeading(t){
  return xPara(textRun(t, { bold:true, underline:true }), { before:200, after:140 });
}
// bulleted paragraph (• + tab + text) with hanging indent
function xBulletPara(text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="720"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="720" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun("\u2022") +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}

function buildDocumentXml(){
  const h = jobHeader();
  const body = [];

  if (h.customer) body.push(xPara(textRun(h.customer, { bold:true, size:26 }), { after:40 }));
  if (h.address)  body.push(xPara(textRun(h.address), { after:40 }));
  const qd = [h.quote ? "Quote No. " + h.quote : "", h.date].filter(Boolean).join("    |    ");
  if (qd) body.push(xPara(textRun(qd, { color:"555555" }), { after:200 }));
  if (h.intro) body.push(xPara(textRun(h.intro), { after:200 }));

  const scope = scopeItems();
  body.push(xHeading("SCOPE OF WORK:"));
  scope.forEach((it,i) => {
    body.push(xListPara((i+1) + ".", it.text));
    it.subs.forEach((s,j) => body.push(xSubListPara(letterFor(j).toLowerCase() + ".", s)));
  });

  const notes = checkedItems("notes");
  if (notes.length){
    body.push(xHeading("NOTES:"));
    notes.forEach((t,i) => body.push(xListPara(letterFor(i) + ".", t)));
  }
  const inc = incexcItems("inc");
  if (inc.length){
    body.push(xHeading("INCLUDING:"));
    inc.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }
  const exc = incexcItems("exc");
  if (exc.length){
    body.push(xHeading("EXCLUDING:"));
    exc.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }

  const quals = checkedItems("quals");
  if (quals.length){
    body.push(xHeading("QUALIFICATIONS:"));
    quals.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }
  const resp = checkedItems("resp");
  if (resp.length){
    body.push(xHeading("Customer Responsibilities"));
    body.push(xPara(textRun("The customer is responsible for the following:"), { after:120 }));
    resp.forEach(t => body.push(xBulletPara(t)));
  }
  const billing = checkedItems("billing");
  if (billing.length){
    body.push(xHeading("Billing & Payment Terms"));
    billing.forEach(t => body.push(xBulletPara(t)));
  }

  const closing = checkedItems("closing");
  if (closing.length || h.signature){
    if (h.recipient) body.push(xPara(textRun(h.recipient + ","), { before:200, after:120 }));
    closing.forEach(t => body.push(xPara(textRun(t), { after:120 })));
    if (h.signature){
      const sig = h.signature.split("\n");
      sig.forEach((line, i) => body.push(xPara(textRun(line), { before: i === 0 ? 120 : 0, after:0 })));
    }
  }

  // US Letter, 0.75" margins
  const sectPr =
    `<w:sectPr><w:pgSz w:w="12240" w:h="15840"/>` +
    `<w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/>` +
    `</w:sectPr>`;

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">` +
    `<w:body>${body.join("")}${sectPr}</w:body></w:document>`;
}

const CONTENT_TYPES =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
  `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
  `<Default Extension="xml" ContentType="application/xml"/>` +
  `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>` +
  `</Types>`;

const ROOT_RELS =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
  `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>` +
  `</Relationships>`;

const DOC_RELS =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`;

async function generateWordProposal(silent){
  const scope = scopeItems();
  if (!scope.length){ if(!silent) setStatus("Select at least one Scope of Work item."); return false; }
  if (typeof JSZip === "undefined"){
    if(!silent) setStatus("Document library failed to load — check internet connection and reload.");
    return false;
  }
  try {
    const zip = new JSZip();
    zip.file("[Content_Types].xml", CONTENT_TYPES);
    zip.folder("_rels").file(".rels", ROOT_RELS);
    const word = zip.folder("word");
    word.file("document.xml", buildDocumentXml());
    word.folder("_rels").file("document.xml.rels", DOC_RELS);

    const blob = await zip.generateAsync({
      type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    });
    const h = jobHeader();
    const name = (h.quote || h.customer || "FDEC_Proposal").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "FDEC_Proposal";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name + "_Proposal.docx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    if(!silent) setStatus("Word proposal downloaded.", true);
    return true;
  } catch (err){
    console.error(err);
    if(!silent) setStatus("Error generating document — see console.");
    return false;
  }
}
document.getElementById("btnWord").addEventListener("click", () => generateWordProposal(false));

/* ---------------- Formatted HTML (for the combined PDF export) ---------------- */
/* Builds a clean, print-ready HTML document body from the same section data
   used by the Word/plain-text exports, so the proposal reads as a finished
   document (not the editor UI) inside the combined PDF. */
function buildProposalHTML(){
  const h = jobHeader();
  const P = [];
  const head = [];
  if (h.customer) head.push(`<div class="pp-cust">${esc(h.customer)}</div>`);
  const meta = [];
  if (h.quote) meta.push("Quote " + esc(h.quote));
  if (h.date)  meta.push(esc(h.date));
  if (meta.length) head.push(`<div class="pp-meta">${meta.join(" &nbsp;·&nbsp; ")}</div>`);
  if (head.length) P.push(`<div class="pp-head">${head.join("")}</div>`);

  if (h.intro) P.push(`<p class="pp-intro">${esc(h.intro)}</p>`);

  const scope = scopeItems();
  if (scope.length){
    P.push(`<h3 class="pp-h">SCOPE OF WORK</h3>`);
    let li = "";
    scope.forEach(it => {
      let subs = "";
      if (it.subs && it.subs.length){
        subs = "<ol class='pp-sub' type='a'>" + it.subs.map(s => `<li>${esc(s)}</li>`).join("") + "</ol>";
      }
      li += `<li>${esc(it.text)}${subs}</li>`;
    });
    P.push(`<ol class="pp-ol">${li}</ol>`);
  }
  const notes = checkedItems("notes");
  if (notes.length){
    P.push(`<h3 class="pp-h">NOTES</h3><ol class="pp-ol" type="A">` +
      notes.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const inc = incexcItems("inc");
  if (inc.length){
    P.push(`<h3 class="pp-h">INCLUDING</h3><ol class="pp-ol">` +
      inc.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const exc = incexcItems("exc");
  if (exc.length){
    P.push(`<h3 class="pp-h">EXCLUDING</h3><ol class="pp-ol">` +
      exc.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const quals = checkedItems("quals");
  if (quals.length){
    P.push(`<h3 class="pp-h">QUALIFICATIONS</h3><ol class="pp-ol">` +
      quals.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const resp = checkedItems("resp");
  if (resp.length){
    P.push(`<h3 class="pp-h">Customer Responsibilities</h3>` +
      `<p class="pp-lead">The customer is responsible for the following:</p>` +
      `<ul class="pp-ul">` + resp.map(t => `<li>${esc(t)}</li>`).join("") + `</ul>`);
  }
  const billing = checkedItems("billing");
  if (billing.length){
    P.push(`<h3 class="pp-h">Billing &amp; Payment Terms</h3><ul class="pp-ul">` +
      billing.map(t => `<li>${esc(t)}</li>`).join("") + `</ul>`);
  }
  const closing = checkedItems("closing");
  if (closing.length || h.signature){
    let c = `<div class="pp-closing">`;
    closing.forEach(t => c += `<p>${esc(t)}</p>`);
    if (h.signature){
      c += `<p class="pp-sig">` + esc(h.signature).replace(/\n/g,"<br>") + `</p>`;
    }
    c += `</div>`;
    P.push(c);
  }
  return P.join("\n");
}

/* Shell requests: return formatted HTML, or trigger the Word download. */
window.addEventListener("message", function(e){
  const d = e && e.data;
  if (!d || d.fdec !== true) return;
  if (d.type === "get-proposal-html"){
    let html = "", err = null;
    try {
      if (!scopeItems().length) err = "no-scope";
      else html = buildProposalHTML();
    } catch(ex){ err = String(ex && ex.message || ex); }
    // reply to the shell
    if (window.parent && window.parent !== window){
      window.parent.postMessage({
        fdec:true, type:"proposal-html", reqId:d.reqId,
        html: html, css: PROPOSAL_PRINT_CSS, error: err
      }, "*");
    }
  } else if (d.type === "download-proposal-word"){
    generateWordProposal(true);
  }
});

/* ---------------- Save Draft (.html with embedded state) ---------------- */
function collectState(){
  return {
    meta: { app: "FDEC Proposal Builder", author: APP_META.author, version: APP_META.version, savedAt: new Date().toISOString() },
    job: {
      customer: document.getElementById("jobCustomer").value,
      quote:    document.getElementById("jobQuote").value,
      date:     document.getElementById("jobDate").value,
      intro:    document.getElementById("jobIntro").value,
      signature:document.getElementById("jobSignature").value
    },
    sections: JSON.parse(JSON.stringify({
      scope: state.scope, notes: state.notes, quals: state.quals,
      resp: state.resp, billing: state.billing, closing: state.closing, incexc: state.incexc
    }))
  };
}

/* Apply a saved draft slice (job fields + sections) to this page and
   re-render. Used by the suite-level Load Draft. */
function applySuiteDraft(saved){
  if (!saved) return;
  try {
    if (saved.job){
      document.getElementById("jobCustomer").value = saved.job.customer || "";
      document.getElementById("jobQuote").value    = saved.job.quote    || "";
      if (saved.job.date) document.getElementById("jobDate").value = saved.job.date;
      if (saved.job.intro != null) document.getElementById("jobIntro").value = saved.job.intro;
      if (saved.job.signature != null) document.getElementById("jobSignature").value = saved.job.signature;
    }
    if (saved.sections){
      for (const key of ["scope","notes","quals","resp","billing","closing","incexc"]){
        if (Array.isArray(saved.sections[key])) state[key] = mergeLibraryInto(key, saved.sections[key]);
      }
      state.scope.forEach(i => { if (!Array.isArray(i.subs)) i.subs = []; });
    }
    ["scope","notes","quals","resp","billing","closing","incexc"].forEach(render);
    relayoutTextareas();
    setStatus("Draft loaded.", true);
  } catch(e){ console.error("applySuiteDraft failed:", e); }
}

/* Suite draft messages: return this page's state, or apply an incoming one. */
window.addEventListener("message", function(e){
  var d = e && e.data;
  if (!d || d.fdec !== true) return;
  if (d.type === "get-draft"){
    var payload = null, gerr = null;
    try { payload = collectState(); } catch(ex){ gerr = String(ex && ex.message || ex); }
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"draft-data", page: SUITE_PAGE_ID, reqId:d.reqId, data:payload, error:gerr }, "*");
    }
  } else if (d.type === "load-draft" && d.page === SUITE_PAGE_ID){
    applySuiteDraft(d.data);
  }
});

/* ============================================================
   CROSS-APP LINK — auto-fill the down payment note from the
   Quoting tab. The suite shell relays the quoting app's down
   payment total here via postMessage; we drop it into the
   "A down payment of $____ is required..." note automatically.
   ============================================================ */
(function(){
  // Matches the down payment note whether it still has the blank
  // underscores or a previously auto-filled dollar amount.
  const DP_RE = /(A down payment of\s+)(\$[\d,]+(?:\.\d{2})?|\$?_+)(\s+is required)/i;

  function fillDownPayment(display){
    let touched = false;
    (state.notes || []).forEach(note => {
      if (DP_RE.test(note.text)){
        // Function replacer avoids "$" in the amount being read as a
        // regex backreference (e.g. $1) inside the replacement string.
        const next = note.text.replace(DP_RE, (m, pre, amt, post) => pre + display + post);
        if (next !== note.text){ note.text = next; touched = true; }
      }
    });
    // Re-render notes so the on-screen textarea reflects the new amount.
    if (touched) render("notes");
  }

  window.addEventListener("message", function(e){
    const d = e && e.data;
    if (!d || d.fdec !== true || d.type !== "downpayment") return;
    const display = d.display || ("$" + Number(d.value || 0).toFixed(2));
    fillDownPayment(display);
  });
})();

/* Scope & Notes start unchecked (pick what applies to this job).
   Scope items carry an optional subs[] list shown once the item is selected.
   Including/Excluding items carry a mode: "inc", "exc", or "off". */
const state = {};
state.scope = LIBRARY.scope.map(entry => {
  const obj = typeof entry === "string" ? { text: entry, subs: [] } : entry;
  return {
    text: obj.text,
    checked: false,
    subs: (obj.subs || []).map(s => ({ text: s, checked: false }))
  };
});
state.notes = LIBRARY.notes.map(t => ({ text: t, checked: false }));
/* Qualifications and boilerplate default ON — uncheck to drop from a proposal. */
for (const key of ["quals","resp","billing","closing"]) {
  state[key] = LIBRARY[key].map(t => ({ text: t, checked: true }));
}
state.incexc = LIBRARY.incexc.map(i => ({ text: i.text, mode: i.mode }));

/* ---------------- rendering ---------------- */
function autoGrow(ta){ ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; }

function render(key){
  if (key === "incexc") return renderIncExc();
  const ul = document.getElementById("list-" + key);
  ul.innerHTML = "";
  const filter = (document.querySelector(`[data-filter="${key}"]`)?.value || "").toLowerCase();
  state[key].forEach((item, i) => {
    if (filter && !item.text.toLowerCase().includes(filter)) return;
    const li = document.createElement("li");
    li.className = "item" + (item.checked ? "" : " unchecked");
    li.dataset.index = i;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = item.checked;
    cb.addEventListener("change", () => {
      item.checked = cb.checked;
      li.classList.toggle("unchecked", !cb.checked);
      updateCount(key);
      if (key === "scope") render(key); // open/close the sub-item block
    });

    const ta = document.createElement("textarea");
    ta.rows = 1;
    ta.value = item.text;
    ta.addEventListener("input", () => { item.text = ta.value; autoGrow(ta); });
    ta.addEventListener("focus", () => autoGrow(ta));

    const del = document.createElement("button");
    del.className = "del";
    del.title = "Remove item";
    del.innerHTML = "&times;";
    del.addEventListener("click", () => { state[key].splice(i,1); render(key); updateCount(key); });

    li.append(cb, ta, del);

    // Optional subcategory: shown only when the scope item is selected
    if (key === "scope" && item.checked){
      const subUl = document.createElement("ul");
      subUl.className = "subs";
      item.subs.forEach((sub, j) => {
        const sli = document.createElement("li");
        sli.className = "sub" + (sub.checked ? "" : " unchecked");

        const scb = document.createElement("input");
        scb.type = "checkbox";
        scb.checked = sub.checked;
        scb.addEventListener("change", () => {
          sub.checked = scb.checked;
          sli.classList.toggle("unchecked", !scb.checked);
          updateCount(key);
        });

        const sta = document.createElement("textarea");
        sta.rows = 1;
        sta.value = sub.text;
        sta.addEventListener("input", () => { sub.text = sta.value; autoGrow(sta); });
        sta.addEventListener("focus", () => autoGrow(sta));

        const sdel = document.createElement("button");
        sdel.className = "del";
        sdel.title = "Remove sub-item";
        sdel.innerHTML = "&times;";
        sdel.addEventListener("click", () => { item.subs.splice(j,1); render(key); updateCount(key); });

        sli.append(scb, sta, sdel);
        subUl.appendChild(sli);
        (window.requestAnimationFrame || (fn => setTimeout(fn, 0)))(() => autoGrow(sta));
      });

      const addSub = document.createElement("button");
      addSub.className = "addsub";
      addSub.type = "button";
      addSub.textContent = "+ Sub-item";
      addSub.addEventListener("click", () => {
        item.subs.push({ text: "", checked: true });
        render(key);
        const parent = ul.querySelector(`li.item[data-index="${i}"]`);
        const nt = parent && parent.querySelector("ul.subs li.sub:last-of-type textarea");
        if (nt) nt.focus();
      });
      subUl.appendChild(document.createElement("li")).appendChild(addSub);

      li.appendChild(subUl);
    }

    ul.appendChild(li);
    autoGrow(ta);
  });
  updateCount(key);
}

function renderIncExc(){
  const ul = document.getElementById("list-incexc");
  ul.innerHTML = "";
  state.incexc.forEach((item, i) => {
    const li = document.createElement("li");
    li.className = "item" + (item.mode === "off" ? " omitted" : "");

    const seg = document.createElement("div");
    seg.className = "seg";
    const modes = [ ["inc","INCL","on-inc"], ["exc","EXCL","on-exc"], ["off","\u2014","on-off"] ];
    modes.forEach(([mode, label, cls]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.title = mode === "inc" ? "Included" : mode === "exc" ? "Excluded" : "Leave off the proposal";
      if (item.mode === mode) b.classList.add(cls);
      b.addEventListener("click", () => { item.mode = mode; renderIncExc(); });
      seg.appendChild(b);
    });

    const ta = document.createElement("textarea");
    ta.rows = 1;
    ta.value = item.text;
    ta.addEventListener("input", () => { item.text = ta.value; autoGrow(ta); });
    ta.addEventListener("focus", () => autoGrow(ta));

    const del = document.createElement("button");
    del.className = "del";
    del.title = "Remove item";
    del.innerHTML = "&times;";
    del.addEventListener("click", () => { state.incexc.splice(i,1); renderIncExc(); });

    li.append(seg, ta, del);
    ul.appendChild(li);
    autoGrow(ta);
  });
  updateCount("incexc");
}

function updateCount(key){
  const el = document.querySelector(`[data-count="${key}"]`);
  if (!el) return;
  if (key === "incexc"){
    const inc = state.incexc.filter(i => i.mode === "inc").length;
    const exc = state.incexc.filter(i => i.mode === "exc").length;
    el.textContent = inc + " included \u00b7 " + exc + " excluded";
  } else if (key === "scope"){
    const sel = state.scope.filter(i => i.checked);
    const subs = sel.reduce((n,i) => n + i.subs.filter(s => s.checked).length, 0);
    el.textContent = sel.length + " selected" + (subs ? " \u00b7 " + subs + " sub-item" + (subs === 1 ? "" : "s") : "");
  } else {
    el.textContent = state[key].filter(i => i.checked).length + " selected";
  }
}

document.querySelectorAll("[data-add]").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.dataset.add;
    if (key === "incexc"){

    const ul = document.getElementById("list-" + key);
    const last = ul.querySelector("li:last-child textarea");
    if (last) last.focus();
  });
});

document.querySelectorAll("[data-filter]").forEach(inp => {

/* ---------------- draft restore (hydrate from embedded saved state) ---------------- */
document.getElementById("metaLine").textContent = "V" + APP_META.version + " \u00b7 " + APP_META.author;
document.title = "FDEC New Install" + " V" + APP_META.version;

/* Merge any newer LIBRARY items into a restored section so additions made
   after a draft was saved are never hidden. Saved items keep their text,
   checked state, and sub-items; library items not present in the saved list
   are appended (unchecked). Scope library entries may be strings or objects
   with subs[]. Matching is by normalized text. */
function mergeLibraryInto(key, savedArr){
  const norm = t => String(t || "").replace(/\s+/g, " ").trim().toLowerCase();
  const out = Array.isArray(savedArr) ? savedArr.slice() : [];
  const seen = new Set(out.map(it => norm(it && it.text)));
  (LIBRARY[key] || []).forEach(entry => {
    if (key === "incexc"){
      const text = entry.text;
      if (!seen.has(norm(text))){ out.push({ text: text, mode: entry.mode }); seen.add(norm(text)); }
      return;
    }
    const obj = (typeof entry === "string") ? { text: entry, subs: [] } : entry;
    if (!seen.has(norm(obj.text))){
      out.push({
        text: obj.text,
        checked: false,
        subs: (obj.subs || []).map(s => ({ text: s, checked: false }))
      });
      seen.add(norm(obj.text));
    }
  });
  return out;
}

let restoredMsg = "";
(function hydrate(){
  const el = document.getElementById("savedState");
  if (!el) return;
  try {
    const saved = JSON.parse(el.textContent);
    if (saved.job){
      document.getElementById("jobCustomer").value = saved.job.customer || "";
      document.getElementById("jobQuote").value    = saved.job.quote    || "";
      // Date intentionally not restored from the template — it is always set
      // to today's date on open (see below).
      if (saved.job.intro) document.getElementById("jobIntro").value = saved.job.intro;
      if (saved.job.signature != null) document.getElementById("jobSignature").value = saved.job.signature;
    }
    if (saved.sections){
      for (const key of ["scope","notes","quals","resp","billing","closing","incexc"]){
        if (Array.isArray(saved.sections[key])) state[key] = mergeLibraryInto(key, saved.sections[key]);
      }
      // guarantee scope items have a subs array
      state.scope.forEach(i => { if (!Array.isArray(i.subs)) i.subs = []; });
    }
    const when = saved.meta && saved.meta.savedAt ? new Date(saved.meta.savedAt) : null;
    restoredMsg = "Draft restored" + (when ? " \u2014 saved " + when.toLocaleString() : "") + ".";
  } catch(e){ console.error("Could not restore saved draft:", e); }
})();

["scope","notes","quals","resp","billing","closing","incexc"].forEach(render);
// Always open with today's date (local, not UTC, to avoid an off-by-one).
(function(){
  const d = new Date();
  const local = d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");

})();

/* ---------------- Shared job-info sync ----------------
   Repair Verbiage is the MASTER for Job Name / Quote # / Date. When these
   change here, broadcast to the suite shell, which relays the values to the
   other pages. Followers (the generated clone pages) set IS_JOBINFO_MASTER
   to false and only receive. */
var IS_JOBINFO_MASTER = false;
(function(){
  function currentJobInfo(){
    return {
      customer: document.getElementById("jobCustomer").value,
      quote:    document.getElementById("jobQuote").value,
      date:     document.getElementById("jobDate").value
    };
  }
  function broadcastJobInfo(){
    if (!IS_JOBINFO_MASTER) return;
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"jobinfo", value: currentJobInfo() }, "*");
    }
  }
  function applyJobInfo(v){
    if (!v) return;
    if (typeof v.customer === "string") document.getElementById("jobCustomer").value = v.customer;
    if (typeof v.quote === "string")    document.getElementById("jobQuote").value = v.quote;
    if (typeof v.date === "string" && v.date) document.getElementById("jobDate").value = v.date;
  }
  // Master: broadcast on any edit to the three shared fields.
  if (IS_JOBINFO_MASTER){
    ["jobCustomer","jobQuote","jobDate"].forEach(function(id){
      var el = document.getElementById(id);
      if (el){ el.addEventListener("input", broadcastJobInfo); el.addEventListener("change", broadcastJobInfo); }
    });
    // Broadcast the initial values (incl. today's date) once the shell is ready.
    setTimeout(broadcastJobInfo, 150);
  }

  /* Auto-save this page to the suite shell (crash protection), debounced.
     Silent no-op when opened standalone. */
  var _autosaveTimer = null;
  function scheduleAutosave(){
    if (!(window.parent && window.parent !== window)) return;
    clearTimeout(_autosaveTimer);
    _autosaveTimer = setTimeout(function(){
      try {
        window.parent.postMessage({ fdec:true, type:'autosave', page:SUITE_PAGE_ID, data:collectState() }, '*');
      } catch(_){}
    }, 1200);
  }
  document.addEventListener("input", scheduleAutosave);
  document.addEventListener("change", scheduleAutosave);
  document.addEventListener("click", function(e){
    // Catch add/remove/toggle actions that change state without an input event.
    if (e.target.closest("button")) setTimeout(scheduleAutosave, 50);
  });
  // Tell the shell when the user starts working, so it can dismiss the
  // "restore previous session?" banner.
  document.addEventListener("focusin", function(e){
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")){
      if (window.parent && window.parent !== window){
        try { window.parent.postMessage({ fdec:true, type:"user-active" }, "*"); } catch(_){}
      }
    }
  });
  // Everyone: accept incoming job-info from the shell. The shell only relays
  // to followers, so the master won't receive its own broadcast.
  window.addEventListener("message", function(e){
    var d = e && e.data;
    if (!d || d.fdec !== true) return;
    if (d.type === "jobinfo") applyJobInfo(d.value);
    // A follower loaded and asked for values; the shell forwards this to the
    // master as 'send-jobinfo'. Master responds by broadcasting current values.
    else if (d.type === "send-jobinfo" && IS_JOBINFO_MASTER) broadcastJobInfo();
  });
  // Followers can request the current values when they load/become visible.
  if (!IS_JOBINFO_MASTER){
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"request-jobinfo" }, "*");
    }
  }
})();

if (restoredMsg) setTimeout(() => setStatus(restoredMsg, true), 100);

/* When this app first renders inside a hidden iframe (the Quoting tab is
   shown by default), every textarea measures scrollHeight = 0 and collapses
   so its text is invisible. Re-grow all textareas once the tab is actually
   visible. The suite shell posts {type:'relayout'} on tab switch; we also
   listen for our own becoming-visible as a fallback. */
function relayoutTextareas(){
  var run = function(){ document.querySelectorAll("textarea").forEach(autoGrow); };
  // Defer so the browser has laid out the now-visible iframe before we
  // read scrollHeight; run twice to catch any late layout.
  if (typeof requestAnimationFrame === "function"){
    requestAnimationFrame(function(){ run(); requestAnimationFrame(run); });
  } else {
    run();
  }
}
window.addEventListener("message", function(e){
  var d = e && e.data;
  if (d && d.fdec === true && d.type === "relayout") relayoutTextareas();
});
/* Self-healing: when this document transitions from hidden (0 size) to
   visible, re-measure textareas automatically — independent of the shell.
   Covers the case where the app first rendered inside a hidden iframe. */
(function(){
  var seenVisible = false;
  function checkVisible(){
    var visible = document.body && document.body.clientHeight > 0 &&
                  document.documentElement.clientWidth > 0;
    if (visible && !seenVisible){ seenVisible = true; relayoutTextareas(); }
  }
  if (typeof ResizeObserver === "function"){
    try { new ResizeObserver(checkVisible).observe(document.documentElement); } catch(_){}
  }
  window.addEventListener("resize", checkVisible);
  document.addEventListener("visibilitychange", checkVisible);
  // initial + a few delayed attempts to catch first layout
  checkVisible();
  [60, 200, 500].forEach(function(ms){ setTimeout(checkVisible, ms); });
})();
/* Fallback: if this document becomes visible via layout, relayout once. */
if (typeof requestAnimationFrame === "function"){
  requestAnimationFrame(function(){ if (document.body.clientHeight) relayoutTextareas(); });
}

/* ---------------- output helpers ---------------- */
function checkedItems(key){
  return state[key].filter(i => i.checked && i.text.trim()).map(i => i.text.trim());
}
function scopeItems(){
  return state.scope
    .filter(i => i.checked && i.text.trim())
    .map(i => ({
      text: i.text.trim(),
      subs: i.subs.filter(s => s.checked && s.text.trim()).map(s => s.text.trim())
    }));
}
function incexcItems(mode){
  return state.incexc.filter(i => i.mode === mode && i.text.trim()).map(i => i.text.trim());
}
function letterFor(n){ // 0 -> A, 25 -> Z, 26 -> AA
  let s = "";
  n += 1;
  while (n > 0){ n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}
function fmtDate(iso){
  if (!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
}
function jobHeader(){
  return {
    customer: document.getElementById("jobCustomer").value.trim(),
    recipient:"",
    address:  "",
    quote:    document.getElementById("jobQuote").value.trim(),
    date:     fmtDate(document.getElementById("jobDate").value),
    intro:    document.getElementById("jobIntro").value.trim(),
    signature:document.getElementById("jobSignature").value.replace(/\s+$/,"")
  };
}
function setStatus(msg, ok){
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = ok ? "ok" : "";
  if (msg) setTimeout(() => { s.textContent = ""; s.className = ""; }, 4000);
}

/* ---------------- Word generation (WordprocessingML via JSZip) ---------------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}
// run properties: Calibri 11pt by default
function rPr(o={}){
  return `<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>` +
         (o.bold ? "<w:b/>" : "") +
         (o.underline ? `<w:u w:val="single"/>` : "") +
         (o.color ? `<w:color w:val="${o.color}"/>` : "") +
         `<w:sz w:val="${o.size || 22}"/><w:szCs w:val="${o.size || 22}"/></w:rPr>`;
}
function textRun(t, o={}){
  return `<w:r>${rPr(o)}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
}
// plain paragraph
function xPara(runsXml, { before=0, after=120 } = {}){
  return `<w:p><w:pPr><w:spacing w:before="${before}" w:after="${after}"/></w:pPr>${runsXml}</w:p>`;
}
// numbered/lettered list paragraph with hanging indent (label + tab + text)
function xListPara(label, text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="720"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="720" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun(label) +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}
// second-level sub-item paragraph (a., b., …) indented under its parent
function xSubListPara(label, text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="1440"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="1440" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun(label) +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}
function xHeading(t){
  return xPara(textRun(t, { bold:true, underline:true }), { before:200, after:140 });
}
// bulleted paragraph (• + tab + text) with hanging indent
function xBulletPara(text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="720"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="720" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun("\u2022") +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}

function buildDocumentXml(){
  const h = jobHeader();
  const body = [];

  if (h.customer) body.push(xPara(textRun(h.customer, { bold:true, size:26 }), { after:40 }));
  if (h.address)  body.push(xPara(textRun(h.address), { after:40 }));
  const qd = [h.quote ? "Quote No. " + h.quote : "", h.date].filter(Boolean).join("    |    ");
  if (qd) body.push(xPara(textRun(qd, { color:"555555" }), { after:200 }));
  if (h.intro) body.push(xPara(textRun(h.intro), { after:200 }));

  const scope = scopeItems();
  body.push(xHeading("SCOPE OF WORK:"));
  scope.forEach((it,i) => {
    body.push(xListPara((i+1) + ".", it.text));
    it.subs.forEach((s,j) => body.push(xSubListPara(letterFor(j).toLowerCase() + ".", s)));
  });

  const notes = checkedItems("notes");
  if (notes.length){
    body.push(xHeading("NOTES:"));
    notes.forEach((t,i) => body.push(xListPara(letterFor(i) + ".", t)));
  }
  const inc = incexcItems("inc");
  if (inc.length){
    body.push(xHeading("INCLUDING:"));
    inc.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }
  const exc = incexcItems("exc");
  if (exc.length){
    body.push(xHeading("EXCLUDING:"));
    exc.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }

  const quals = checkedItems("quals");
  if (quals.length){
    body.push(xHeading("QUALIFICATIONS:"));
    quals.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }
  const resp = checkedItems("resp");
  if (resp.length){
    body.push(xHeading("Customer Responsibilities"));
    body.push(xPara(textRun("The customer is responsible for the following:"), { after:120 }));
    resp.forEach(t => body.push(xBulletPara(t)));
  }
  const billing = checkedItems("billing");
  if (billing.length){
    body.push(xHeading("Billing & Payment Terms"));
    billing.forEach(t => body.push(xBulletPara(t)));
  }

  const closing = checkedItems("closing");
  if (closing.length || h.signature){
    if (h.recipient) body.push(xPara(textRun(h.recipient + ","), { before:200, after:120 }));
    closing.forEach(t => body.push(xPara(textRun(t), { after:120 })));
    if (h.signature){
      const sig = h.signature.split("\n");
      sig.forEach((line, i) => body.push(xPara(textRun(line), { before: i === 0 ? 120 : 0, after:0 })));
    }
  }

  // US Letter, 0.75" margins
  const sectPr =
    `<w:sectPr><w:pgSz w:w="12240" w:h="15840"/>` +
    `<w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/>` +
    `</w:sectPr>`;

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">` +
    `<w:body>${body.join("")}${sectPr}</w:body></w:document>`;
}

const CONTENT_TYPES =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
  `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
  `<Default Extension="xml" ContentType="application/xml"/>` +
  `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>` +
  `</Types>`;

const ROOT_RELS =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
  `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>` +
  `</Relationships>`;

const DOC_RELS =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`;

async function generateWordProposal(silent){
  const scope = scopeItems();
  if (!scope.length){ if(!silent) setStatus("Select at least one Scope of Work item."); return false; }
  if (typeof JSZip === "undefined"){
    if(!silent) setStatus("Document library failed to load — check internet connection and reload.");
    return false;
  }
  try {
    const zip = new JSZip();
    zip.file("[Content_Types].xml", CONTENT_TYPES);
    zip.folder("_rels").file(".rels", ROOT_RELS);
    const word = zip.folder("word");
    word.file("document.xml", buildDocumentXml());
    word.folder("_rels").file("document.xml.rels", DOC_RELS);

    const blob = await zip.generateAsync({
      type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    });
    const h = jobHeader();
    const name = (h.quote || h.customer || "FDEC_Proposal").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "FDEC_Proposal";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name + "_Proposal.docx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    if(!silent) setStatus("Word proposal downloaded.", true);
    return true;
  } catch (err){
    console.error(err);
    if(!silent) setStatus("Error generating document — see console.");
    return false;
  }
}
document.getElementById("btnWord").addEventListener("click", () => generateWordProposal(false));

/* ---------------- Plain-text copy (for pasting into ServiceTrade) ---------------- */
document.getElementById("btnCopy").addEventListener("click", async () => {
  const scope = scopeItems();
  if (!scope.length){ setStatus("Select at least one Scope of Work item."); return; }
  const h = jobHeader();
  const L = [];
  if (h.intro) L.push(h.intro, "");
  L.push("SCOPE OF WORK:", "");
  scope.forEach((it,i) => {
    L.push(`${i+1}. ${it.text}`);
    it.subs.forEach((s,j) => L.push(`     ${letterFor(j).toLowerCase()}. ${s}`));
  });
  const notes = checkedItems("notes");
  if (notes.length){
    L.push("", "NOTES:", "");
    notes.forEach((t,i) => L.push(`${letterFor(i)}. ${t}`));
  }
  const inc = incexcItems("inc");
  if (inc.length){
    L.push("", "INCLUDING:", "");
    inc.forEach((t,i) => L.push(`${i+1}. ${t}`));
  }
  const exc = incexcItems("exc");
  if (exc.length){
    L.push("", "EXCLUDING:", "");
    exc.forEach((t,i) => L.push(`${i+1}. ${t}`));
  }
  const quals = checkedItems("quals");
  if (quals.length){
    L.push("", "QUALIFICATIONS:", "");
    quals.forEach((t,i) => L.push(`${i+1}. ${t}`));
  }
  const resp = checkedItems("resp");
  if (resp.length){
    L.push("", "Customer Responsibilities", "", "The customer is responsible for the following:");
    resp.forEach(t => L.push(`- ${t}`));
  }

  if (billing.length){

/* ---------------- Formatted HTML (for the combined PDF export) ---------------- */
/* Builds a clean, print-ready HTML document body from the same section data
   used by the Word/plain-text exports, so the proposal reads as a finished
   document (not the editor UI) inside the combined PDF. */
function buildProposalHTML(){
  const h = jobHeader();
  const P = [];
  const head = [];
  if (h.customer) head.push(`<div class="pp-cust">${esc(h.customer)}</div>`);
  const meta = [];
  if (h.quote) meta.push("Quote " + esc(h.quote));
  if (h.date)  meta.push(esc(h.date));
  if (meta.length) head.push(`<div class="pp-meta">${meta.join(" &nbsp;·&nbsp; ")}</div>`);
  if (head.length) P.push(`<div class="pp-head">${head.join("")}</div>`);

  if (h.intro) P.push(`<p class="pp-intro">${esc(h.intro)}</p>`);

  const scope = scopeItems();
  if (scope.length){
    P.push(`<h3 class="pp-h">SCOPE OF WORK</h3>`);
    let li = "";
    scope.forEach(it => {
      let subs = "";
      if (it.subs && it.subs.length){
        subs = "<ol class='pp-sub' type='a'>" + it.subs.map(s => `<li>${esc(s)}</li>`).join("") + "</ol>";
      }
      li += `<li>${esc(it.text)}${subs}</li>`;
    });
    P.push(`<ol class="pp-ol">${li}</ol>`);
  }
  const notes = checkedItems("notes");
  if (notes.length){
    P.push(`<h3 class="pp-h">NOTES</h3><ol class="pp-ol" type="A">` +
      notes.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const inc = incexcItems("inc");
  if (inc.length){
    P.push(`<h3 class="pp-h">INCLUDING</h3><ol class="pp-ol">` +
      inc.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const exc = incexcItems("exc");
  if (exc.length){
    P.push(`<h3 class="pp-h">EXCLUDING</h3><ol class="pp-ol">` +
      exc.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const quals = checkedItems("quals");
  if (quals.length){
    P.push(`<h3 class="pp-h">QUALIFICATIONS</h3><ol class="pp-ol">` +
      quals.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const resp = checkedItems("resp");
  if (resp.length){
    P.push(`<h3 class="pp-h">Customer Responsibilities</h3>` +
      `<p class="pp-lead">The customer is responsible for the following:</p>` +
      `<ul class="pp-ul">` + resp.map(t => `<li>${esc(t)}</li>`).join("") + `</ul>`);
  }
  const billing = checkedItems("billing");
  if (billing.length){
    P.push(`<h3 class="pp-h">Billing &amp; Payment Terms</h3><ul class="pp-ul">` +
      billing.map(t => `<li>${esc(t)}</li>`).join("") + `</ul>`);
  }
  const closing = checkedItems("closing");
  if (closing.length || h.signature){
    let c = `<div class="pp-closing">`;
    closing.forEach(t => c += `<p>${esc(t)}</p>`);
    if (h.signature){
      c += `<p class="pp-sig">` + esc(h.signature).replace(/\n/g,"<br>") + `</p>`;
    }
    c += `</div>`;
    P.push(c);
  }
  return P.join("\n");
}

/* Shell requests: return formatted HTML, or trigger the Word download. */
window.addEventListener("message", function(e){
  const d = e && e.data;
  if (!d || d.fdec !== true) return;
  if (d.type === "get-proposal-html"){
    let html = "", err = null;
    try {
      if (!scopeItems().length) err = "no-scope";
      else html = buildProposalHTML();
    } catch(ex){ err = String(ex && ex.message || ex); }
    // reply to the shell
    if (window.parent && window.parent !== window){
      window.parent.postMessage({
        fdec:true, type:"proposal-html", reqId:d.reqId,
        html: html, css: PROPOSAL_PRINT_CSS, error: err
      }, "*");
    }
  } else if (d.type === "download-proposal-word"){
    generateWordProposal(true);
  }
});

/* ---------------- Save Draft (.html with embedded state) ---------------- */
function collectState(){
  return {
    meta: { app: "FDEC Proposal Builder", author: APP_META.author, version: APP_META.version, savedAt: new Date().toISOString() },
    job: {
      customer: document.getElementById("jobCustomer").value,
      quote:    document.getElementById("jobQuote").value,
      date:     document.getElementById("jobDate").value,
      intro:    document.getElementById("jobIntro").value,
      signature:document.getElementById("jobSignature").value
    },
    sections: JSON.parse(JSON.stringify({
      scope: state.scope, notes: state.notes, quals: state.quals,
      resp: state.resp, billing: state.billing, closing: state.closing, incexc: state.incexc
    }))
  };
}

/* Apply a saved draft slice (job fields + sections) to this page and
   re-render. Used by the suite-level Load Draft. */
function applySuiteDraft(saved){
  if (!saved) return;
  try {
    if (saved.job){
      document.getElementById("jobCustomer").value = saved.job.customer || "";
      document.getElementById("jobQuote").value    = saved.job.quote    || "";
      if (saved.job.date) document.getElementById("jobDate").value = saved.job.date;
      if (saved.job.intro != null) document.getElementById("jobIntro").value = saved.job.intro;
      if (saved.job.signature != null) document.getElementById("jobSignature").value = saved.job.signature;
    }
    if (saved.sections){
      for (const key of ["scope","notes","quals","resp","billing","closing","incexc"]){
        if (Array.isArray(saved.sections[key])) state[key] = mergeLibraryInto(key, saved.sections[key]);
      }
      state.scope.forEach(i => { if (!Array.isArray(i.subs)) i.subs = []; });
    }
    ["scope","notes","quals","resp","billing","closing","incexc"].forEach(render);
    relayoutTextareas();
    setStatus("Draft loaded.", true);
  } catch(e){ console.error("applySuiteDraft failed:", e); }
}

/* Suite draft messages: return this page's state, or apply an incoming one. */
window.addEventListener("message", function(e){
  var d = e && e.data;
  if (!d || d.fdec !== true) return;
  if (d.type === "get-draft"){
    var payload = null, gerr = null;
    try { payload = collectState(); } catch(ex){ gerr = String(ex && ex.message || ex); }
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"draft-data", page: SUITE_PAGE_ID, reqId:d.reqId, data:payload, error:gerr }, "*");
    }
  } else if (d.type === "load-draft" && d.page === SUITE_PAGE_ID){
    applySuiteDraft(d.data);
  }
});

var _btnSave = document.getElementById("btnSave");
if (_btnSave) _btnSave.addEventListener("click", () => {
  try {
    // JSON payload; escape "</" so it can't terminate the script tag
    const json = JSON.stringify(collectState()).replace(/<\//g, "<\\/");

    // Serialize a clone of the page so the live view is untouched
    const clone = document.documentElement.cloneNode(true);
    const oldState = clone.querySelector("#savedState");
    if (oldState) oldState.remove();
    // strip rendered list contents — they're rebuilt on load from the saved state
    clone.querySelectorAll("ul.items").forEach(ul => ul.innerHTML = "");
    const body = clone.querySelector("body");
    const stateScript = document.createElement("script");
    stateScript.type = "application/json";
    stateScript.id = "savedState";
    stateScript.textContent = json;
    body.insertBefore(stateScript, body.firstChild);

    const html = "<!DOCTYPE html>\n" + clone.outerHTML;
    const blob = new Blob([html], { type: "text/html" });

    const q = document.getElementById("jobQuote").value.trim();
    const c = document.getElementById("jobCustomer").value.trim();
    const base = (q || c || "FDEC_Proposal").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "FDEC_Proposal";
    const stamp = new Date().toISOString().slice(0,10);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = base + "_Draft_" + stamp + ".html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    setStatus("Draft saved — reopen the file to continue where you left off.", true);
  } catch (err){
    console.error(err);
    setStatus("Error saving draft — see console.");
  }
});

/* ============================================================
   CROSS-APP LINK — auto-fill the down payment note from the
   Quoting tab. The suite shell relays the quoting app's down
   payment total here via postMessage; we drop it into the
   "A down payment of $____ is required..." note automatically.
   ============================================================ */
(function(){
  // Matches the down payment note whether it still has the blank
  // underscores or a previously auto-filled dollar amount.
  const DP_RE = /(A down payment of\s+)(\$[\d,]+(?:\.\d{2})?|\$?_+)(\s+is required)/i;

  function fillDownPayment(display){
    let touched = false;
    (state.notes || []).forEach(note => {
      if (DP_RE.test(note.text)){
        // Function replacer avoids "$" in the amount being read as a
        // regex backreference (e.g. $1) inside the replacement string.
        const next = note.text.replace(DP_RE, (m, pre, amt, post) => pre + display + post);
        if (next !== note.text){ note.text = next; touched = true; }
      }
    });
    // Re-render notes so the on-screen textarea reflects the new amount.
    if (touched) render("notes");
  }

  window.addEventListener("message", function(e){
    const d = e && e.data;
    if (!d || d.fdec !== true || d.type !== "downpayment") return;
    const display = d.display || ("$" + Number(d.value || 0).toFixed(2));
    fillDownPayment(display);
  });
})();
