<script>
/* ============================================================
   Load the four app iframes on open. (Login removed — full access.)
   ============================================================ */
function loadApps(){
  function unshield(s){ return s.split("<\\/script").join("</script"); }
  function load(iframeId, srcId){
    var raw = document.getElementById(srcId).textContent;
    var blob = new Blob([unshield(raw)], { type: "text/html" });
    document.getElementById(iframeId).src = URL.createObjectURL(blob);
  }
  load("view-quote", "src-quote");
  load("view-proposal", "src-proposal");
  load("view-annual", "src-annual");
  load("view-install", "src-install");
}
loadApps();

/* ============================================================
   AUTO-SAVE (crash protection)
   Pages post their current draft to the shell; the shell persists it here
   in localStorage (a stable origin, unlike the blob-URL iframes). On the
   next open, if a recent auto-save exists, offer to restore it. This is a
   safety net — it does not replace the explicit Save Draft file.
   ============================================================ */
var AUTOSAVE_KEY = 'fdec_suite_autosave_v1';
var _autosaveState = null, _autosaveWriteTimer = null;

/* Unsaved-changes tracking for the close warning. Autosaves that arrive in
   the first few seconds after load are the pages initializing, not real
   edits, so they don't count as "unsaved changes". */
var _suiteDirty = false;
var _closeWarnEnabled = true;
var _loadGraceUntil = Date.now() + 4000;
/* Restore-banner auto-dismiss state. */
var _restoreBannerOpen = false, _restoreTimeout = null, _restoreHide = null;

function markDirty(){
  if (Date.now() < _loadGraceUntil) return;   // ignore initial-load autosaves
  _suiteDirty = true;
}
function markClean(){ _suiteDirty = false; }

function autosaveStore(page, data){
  try {
    if (!_autosaveState) _autosaveState = { pages:{}, savedAt:null };
    _autosaveState.pages[page] = data;
    _autosaveState.savedAt = new Date().toISOString();
    clearTimeout(_autosaveWriteTimer);
    _autosaveWriteTimer = setTimeout(function(){
      try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(_autosaveState)); }
      catch(_){/* storage full or blocked — ignore */}
    }, 400);
    updateAutosaveIndicator();
    markDirty();
  } catch(_){}
}

/* Warn before leaving if there are unsaved changes and the option is on.
   The browser shows its own generic confirmation ("Leave site? Changes you
   made may not be saved"); the exact wording can't be customized. */
window.addEventListener('beforeunload', function(e){
  if (_closeWarnEnabled && _suiteDirty){
    e.preventDefault();
    e.returnValue = '';   // required for the prompt to appear in most browsers
    return '';
  }
});

function updateAutosaveIndicator(){
  var el = document.getElementById('autosaveNote');
  if (!el || !_autosaveState || !_autosaveState.savedAt) return;
  var t = new Date(_autosaveState.savedAt);
  el.textContent = 'Auto-saved ' + t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  el.style.opacity = '1';
  clearTimeout(el._fade);
  el._fade = setTimeout(function(){ el.style.opacity = '0.55'; }, 2500);
}

function checkAutosaveRestore(){
  var raw = null;
  try { raw = localStorage.getItem(AUTOSAVE_KEY); } catch(_){ return; }
  if (!raw) return;
  var saved = null;
  try { saved = JSON.parse(raw); } catch(_){ return; }
  if (!saved || !saved.pages || !saved.savedAt) return;

  var when = new Date(saved.savedAt);
  var mins = Math.round((Date.now() - when.getTime()) / 60000);
  var ago = mins < 1 ? 'less than a minute ago'
          : mins < 60 ? (mins + (mins === 1 ? ' minute' : ' minutes') + ' ago')
          : when.toLocaleString();
  showRestoreBanner(saved, ago);
}

function showRestoreBanner(saved, ago){
  var bar = document.getElementById('restoreBanner');
  if (!bar) return;
  bar.querySelector('.rb-text').textContent = 'A previous session was auto-saved (' + ago + '). Restore it?';
  bar.style.display = 'flex';

  // The banner auto-dismisses after 60 seconds, or as soon as the user starts
  // working (focuses/edits any field). We keep the auto-save data intact so a
  // later manual restore is still possible if wanted.
  function hideBanner(){
    if (!_restoreBannerOpen) return;
    _restoreBannerOpen = false;
    clearTimeout(_restoreTimeout);
    document.removeEventListener('focusin', hideBanner, true);
    document.removeEventListener('mousedown', maybeHideOnField, true);
    bar.style.display = 'none';
  }
  // Only dismiss on interaction with an actual input/textarea/select (a field),
  // not on clicking the Restore button itself.
  function maybeHideOnField(e){
    var t = e.target;
    if (t && t.closest && t.closest('#restoreBanner')) return;   // ignore banner clicks
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) hideBanner();
  }
  _restoreBannerOpen = true;
  _restoreHide = hideBanner;
  _restoreTimeout = setTimeout(hideBanner, 60000);            // 60-second timeout
  document.addEventListener('focusin', maybeHideOnField, true);
  document.addEventListener('mousedown', maybeHideOnField, true);

  bar.querySelector('.rb-restore').onclick = function(){
    DRAFT_PAGES.forEach(function(p){
      var slice = saved.pages[p.id];
      if (!slice) return;
      var frame = document.getElementById(p.frame);
      if (frame && frame.contentWindow){
        frame.contentWindow.postMessage({ fdec:true, type:'load-draft', page:p.id, data:slice }, '*');
      }
    });
    _autosaveState = saved;
    _loadGraceUntil = Date.now() + 2000;  // don't let the restore's echo mark dirty
    markClean();
    hideBanner();
  };
  bar.querySelector('.rb-dismiss').onclick = hideBanner;
}

window.addEventListener('load', function(){ setTimeout(checkAutosaveRestore, 1200); });

/* All views, in order. Each maps a key to its iframe id and tab id. */
var VIEWS = [
  { key:'quote',    frame:'view-quote',    tab:'tab-quote'    },
  { key:'proposal', frame:'view-proposal', tab:'tab-proposal' },
  { key:'annual',   frame:'view-annual',   tab:'tab-annual'   },
  { key:'install',  frame:'view-install',  tab:'tab-install'  }
];

function showView(which){
  VIEWS.forEach(function(v){
    var active = v.key === which;
    var frame = document.getElementById(v.frame);
    var tab = document.getElementById(v.tab);
    if (frame) frame.hidden = !active;
    if (tab) tab.classList.toggle('active', active);
    // When a verbiage page becomes visible, tell it to re-measure its
    // auto-sizing textareas (they collapse to 0px while hidden).
    if (active && v.key !== 'quote' && frame && frame.contentWindow){
      frame.contentWindow.postMessage({ fdec:true, type:'relayout' }, '*');
    }
  });
  // When leaving the quote, ask it to re-broadcast the down payment AND the
  // shared Job Name / Quote # / Date so the verbiage pages stay in sync.
  if (which !== 'quote'){
    var q = document.getElementById('view-quote');
    if (q && q.contentWindow){
      q.contentWindow.postMessage({ fdec:true, type:'request-sync' }, '*');
      q.contentWindow.postMessage({ fdec:true, type:'send-jobinfo' }, '*');
    }
  }
}

/* Relay FDEC cross-app messages (e.g. down payment total) from the
   Quoting iframe into the verbiage pages so they can auto-fill their
   down payment note live as the quote is edited. Export replies are
   resolved by their globally-unique reqId. */
window.addEventListener('message', function(e){
  var d = e && e.data;
  if (!d || d.fdec !== true) return;
  // Resolve any pending export request reply (keyed by reqId alone, so any
  // page — quote or a verbiage page — can answer its own request).
  if ((d.type === 'quote-html' || d.type === 'proposal-html' || d.type === 'draft-data') && d.reqId != null && pending[d.reqId]){
    pending[d.reqId](d); delete pending[d.reqId]; return;
  }
  // Shared Job Name / Quote # / Date: the Repair Verbiage (proposal) page is
  // Shared Job Name / Quote # / Date: the Quoting Template is the master.
  // Relay its jobinfo to every verbiage page but never back to the quote.
  if (d.type === 'jobinfo'){
    ['view-proposal','view-annual','view-install'].forEach(function(id){
      var f = document.getElementById(id);
      if (f && f.contentWindow) f.contentWindow.postMessage(d, '*');
    });
    return;
  }
  // A follower asking for current values -> tell the master (quote) to re-broadcast.
  if (d.type === 'request-jobinfo'){
    var m = document.getElementById('view-quote');
    if (m && m.contentWindow) m.contentWindow.postMessage({ fdec:true, type:'send-jobinfo' }, '*');
    return;
  }
  // A page reports the user started working (focused a field). Dismiss the
  // restore banner so it doesn't linger while they type.
  if (d.type === 'user-active'){
    if (_restoreBannerOpen && _restoreHide) _restoreHide();
    return;
  }
  // Auto-save: a page sent its current draft. Persist to the shell's own
  // (stable) localStorage so we can offer to restore after a crash/close.
  if (d.type === 'autosave' && d.page){
    // Editing counts as activity — clear the restore prompt if it's still up.
    if (_restoreBannerOpen && _restoreHide) _restoreHide();
    autosaveStore(d.page, d.data);
    return;
  }
  // Otherwise relay quoting -> all verbiage pages (down payment sync, etc.)
  ['view-proposal','view-annual','view-install'].forEach(function(id){
    var f = document.getElementById(id);
    if (f && f.contentWindow) f.contentWindow.postMessage(d, '*');
  });
});

/* ============================================================
   EXPORT FULL PACKAGE
   Opens a dialog to pick which pages to include, then:
   1. Asks each selected iframe for its print-ready HTML + CSS.
   2. Combines them into ONE document (page breaks between pages).
   3. Prints it (browser "Save as PDF" -> one combined PDF).
   4. Triggers each selected verbiage page's Word (.docx) download.
   ============================================================ */
var pending = {};
var reqSeq = 0;

/* Registry of exportable pages. 'kind' selects which request the page
   answers: quote pages answer get-quote-html, verbiage pages answer
   get-proposal-html and can also produce a Word download. */
var EXPORT_PAGES = [
  { id:'quote',    frame:'view-quote',    check:'xm-quote',    kind:'quote',    label:'Quoting Template' },
  { id:'proposal', frame:'view-proposal', check:'xm-proposal', kind:'verbiage', label:'Repair Verbiage' },
  { id:'annual',   frame:'view-annual',   check:'xm-annual',   kind:'verbiage', label:'Annual Inspection' },
  { id:'install',  frame:'view-install',  check:'xm-install',  kind:'verbiage', label:'New Install' }
];

function exportFullPackage(){ openExportModal(); }
function openExportModal(){ document.getElementById('exportModal').hidden = false; }
function closeExportModal(){ document.getElementById('exportModal').hidden = true; }

function askFrame(iframeId, type){
  return new Promise(function(resolve){
    var id = ++reqSeq;
    var frame = document.getElementById(iframeId);
    if (!frame || !frame.contentWindow){ resolve({ error:'frame-unavailable' }); return; }
    pending[id] = resolve;
    frame.contentWindow.postMessage({ fdec:true, type:type, reqId:id }, '*');
    setTimeout(function(){
      if (pending[id]){ delete pending[id]; resolve({ error:'timeout' }); }
    }, 5000);
  });
}

function runExport(){
  // Which pages are selected?
  var selected = EXPORT_PAGES.filter(function(p){
    var cb = document.getElementById(p.check);
    return cb && cb.checked;
  });
  if (!selected.length){ alert('Select at least one page to export.'); return; }

  var goBtn = document.getElementById('xm-go');
  goBtn.disabled = true;
  var goText = goBtn.textContent;
  goBtn.textContent = 'Preparing…';

  // Request print HTML from each selected page.
  var reqs = selected.map(function(p){
    var type = p.kind === 'quote' ? 'get-quote-html' : 'get-proposal-html';
    return askFrame(p.frame, type).then(function(res){ return { page:p, res:res||{} }; });
  });

  Promise.all(reqs).then(function(results){
    // Guard: verbiage pages need a scope selection.
    var missing = results.filter(function(r){ return r.res.error === 'no-scope'; });
    if (missing.length){
      alert('Select at least one Scope of Work item on: ' +
            missing.map(function(r){ return r.page.label; }).join(', ') +
            ' — or uncheck those pages before exporting.');
      return;
    }

    // Trigger Word downloads for each selected verbiage page (independent).
    selected.forEach(function(p){
      if (p.kind === 'verbiage'){
        var f = document.getElementById(p.frame);
        if (f && f.contentWindow) f.contentWindow.postMessage({ fdec:true, type:'download-proposal-word' }, '*');
      }
    });

    // Build combined print document — one section per selected page.
    var sections = [];
    var extraCss = [];
    results.forEach(function(r, i){
      var res = r.res, page = r.page;
      var breakCls = i === 0 ? 'pkg-first' : 'pkg-break';
      if (page.kind === 'quote'){
        var body = res.html
          ? '<style>'+ (res.css||'') +'</style>'+ res.html
          : '<p style="color:#900">Quote content unavailable.</p>';
        sections.push('<section class="pkg-page '+breakCls+'">'+ body +'</section>');
      } else {
        if (res.css) extraCss.push(res.css);
        var body2 = res.html
          ? '<div class="pp-wrap">'+ res.html +'</div>'
          : '<p style="color:#900">'+ page.label +' content unavailable.</p>';
        sections.push('<section class="pkg-page '+breakCls+'">'+ body2 +'</section>');
      }
    });

    var docHtml =
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>FDEC Full Package</title>'+
      '<style>'+
      '  @page{ margin:0.5in; }'+
      '  html,body{ margin:0; padding:0; background:#fff; }'+
      '  .pkg-break{ page-break-before:always; }'+
      '  @media print{ .pkg-break{ page-break-before:always; } }'+
         extraCss.join('\n') +
      '</style></head><body>'+
        sections.join('') +
      '</body></html>';

    var printFrame = document.createElement('iframe');
    printFrame.style.position='fixed'; printFrame.style.right='0'; printFrame.style.bottom='0';
    printFrame.style.width='0'; printFrame.style.height='0'; printFrame.style.border='0';
    document.body.appendChild(printFrame);
    var pdoc = printFrame.contentWindow.document;
    pdoc.open(); pdoc.write(docHtml); pdoc.close();

    var done = function(){
      try { printFrame.contentWindow.focus(); printFrame.contentWindow.print(); }
      catch(err){ console.error(err); alert('Could not open the print dialog: '+err); }
      setTimeout(function(){ if (printFrame && printFrame.parentNode) printFrame.parentNode.removeChild(printFrame); }, 1500);
    };
    if (printFrame.contentWindow.document.readyState === 'complete') setTimeout(done, 400);
    else printFrame.onload = function(){ setTimeout(done, 400); };

    closeExportModal();
  }).catch(function(err){
    console.error(err); alert('Export failed: ' + err);
  }).then(function(){
    goBtn.disabled = false; goBtn.textContent = goText;
  });
}

/* ============================================================
   SUITE DRAFT — save & load ALL pages in one file.
   Save: ask every page for its draft state, bundle into one JSON
         file, and download it.
   Load: read the file and push each page's slice back into its
         iframe so all four pages are restored together.
   ============================================================ */
var DRAFT_PAGES = [
  { id:'quote',    frame:'view-quote'    },
  { id:'proposal', frame:'view-proposal' },
  { id:'annual',   frame:'view-annual'   },
  { id:'install',  frame:'view-install'  }
];

function askDraft(iframeId){
  return new Promise(function(resolve){
    var id = ++reqSeq;
    var frame = document.getElementById(iframeId);
    if (!frame || !frame.contentWindow){ resolve({ error:'frame-unavailable' }); return; }
    pending[id] = resolve;
    frame.contentWindow.postMessage({ fdec:true, type:'get-draft', reqId:id }, '*');
    setTimeout(function(){ if (pending[id]){ delete pending[id]; resolve({ error:'timeout' }); } }, 5000);
  });
}

function saveSuiteDraft(){
  var btn = document.getElementById('btn-savedraft');
  btn.disabled = true; var t = btn.textContent; btn.textContent = 'Saving…';

  Promise.all(DRAFT_PAGES.map(function(p){
    return askDraft(p.frame).then(function(res){ return { id:p.id, res:res||{} }; });
  })).then(function(results){
    var bundle = {
      meta: { app:'FDEC Quoting & Proposal Suite', kind:'suite-draft', version:1, savedAt:new Date().toISOString() },
      pages: {}
    };
    results.forEach(function(r){
      if (r.res && r.res.data) bundle.pages[r.id] = r.res.data;
    });

    // Name the file from the quote's job info when available.
    var q = bundle.pages.quote && bundle.pages.quote.fields ? bundle.pages.quote.fields : {};
    var namePart = (q.quoteNo || q.jobName || '').toString().replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_');
    var stamp = new Date().toISOString().slice(0,10);
    var fname = 'FDEC_Suite_Draft' + (namePart ? '_' + namePart : '') + '_' + stamp + '.json';

    var blob = new Blob([JSON.stringify(bundle)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    markClean();   // draft saved — no unsaved changes to warn about
  }).catch(function(err){
    console.error(err); alert('Could not save the suite draft: ' + err);
  }).then(function(){
    btn.disabled = false; btn.textContent = t;
  });
}

function loadSuiteDraftFile(input){
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var bundle = null;
    try { bundle = JSON.parse(e.target.result); } catch(_){}
    input.value = '';
    if (!bundle || !bundle.pages){
      alert('That file is not a valid FDEC suite draft.');
      return;
    }
    // Push each page's slice back to its iframe.
    DRAFT_PAGES.forEach(function(p){
      var slice = bundle.pages[p.id];
      if (!slice) return;
      var frame = document.getElementById(p.frame);
      if (frame && frame.contentWindow){
        frame.contentWindow.postMessage({ fdec:true, type:'load-draft', page:p.id, data:slice }, '*');
      }
    });
    var when = bundle.meta && bundle.meta.savedAt ? new Date(bundle.meta.savedAt).toLocaleString() : '';
    _loadGraceUntil = Date.now() + 2000;  // loaded state isn't an unsaved edit
    markClean();
    alert('Suite draft loaded' + (when ? ' (saved ' + when + ')' : '') + '. All pages have been restored.');
  };
  reader.readAsText(file);
}
</script>
