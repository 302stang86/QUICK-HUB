/* ================= CALC ================= */
function markups(){
  const P = {};
  document.querySelectorAll('input.mk').forEach(el => {
    const v = parseFloat(el.value);
    P[el.dataset.key] = isFinite(v) && v >= 0 ? v/100 : 0;
  });
  document.querySelectorAll('.mklbl').forEach(el => {
    el.textContent = (P[el.dataset.mk]*100).toLocaleString('en-US',{maximumFractionDigits:2});
  });
  return P;
}
const fmtPct = f => (f*100).toLocaleString('en-US',{maximumFractionDigits:2}) + '%';
function sumGroup(group, fixedRates){
  let cost = 0;
  document.querySelectorAll(`input[data-g="${group}"][data-f="qty"]`).forEach(inp => {
    const tr = inp.closest('tr');
    const rateInp = tr.querySelector('input[data-f="rate"]');
    const rate = rateInp ? num(rateInp) : fixedRates[inp.dataset.i][1];
    const line = num(inp) * rate;
    tr.querySelector('.rowtot').textContent = money(line);
    cost += line;
  });
  return cost;
}
function sumMoneyRows(containerId){
  let t = 0;
  $(containerId).querySelectorAll('.moneyval').forEach(i => t += num(i));
  return t;
}

function recalc(ev){
  const P = markups();
  /* edits in the manpower section flow straight into transportation */
  if (ev && ev.target && ev.target.closest && ev.target.closest('#sec-manpower')){
    syncTrucksFromMp();
  }
  /* labor */
  /* Labor: the customer is billed at the selected level's rate, but our COST
     basis is the Level 3 rate (the lowest tier). Billing above Level 3 yields
     labor profit, which flows into Potential Profit via grandCust - grandCost.
     Returns { cust, cost } per line. */
  const laborLine = (id, key, dept) => {
    const inp = $(id);
    const tr = inp.closest('tr');
    const lvl = $(id + 'Lvl').value;
    const rate = rateFor(lvl, key, dept || 'sp');
    const costRate = rateFor('3', key, dept || 'sp');   // Level 3 = cost basis
    tr.querySelector('.ratecell').textContent = money(rate);
    const hrs = num(inp);
    const cust = hrs * rate;
    const cost = hrs * costRate;
    tr.querySelector('.rowtot').textContent = money(cust);
    return { cust: cust, cost: cost };
  };
  const addLabor = (...rows) => rows.reduce((a, r) => ({ cust: a.cust + r.cust, cost: a.cost + r.cost }), { cust:0, cost:0 });
  const spST = addLabor(laborLine('spST','ST','sp'), laborLine('shopST','ST','sp'), laborLine('spAD','AD','sp'));
  const spOT = addLabor(laborLine('spOT','OT','sp'), laborLine('shopOT','OT','sp'));
  const spDT = addLabor(laborLine('spDT','DT','sp'), laborLine('shopDT','DT','sp'));
  const faST = laborLine('faST','ST','fa'), faOT = laborLine('faOT','OT','fa'), faDT = laborLine('faDT','DT','fa');

  /* qty groups */
  const truckCosts = [];
  document.querySelectorAll('input[data-g="trucks"][data-f="qty"]').forEach(inp => {
    const tr = inp.closest('tr');
    const line = num(inp) * num(tr.querySelector('input[data-f="rate"]'));
    tr.querySelector('.rowtot').textContent = money(line);
    truckCosts[inp.dataset.i] = line;
  });
  const perdiemCost = sumGroup('perdiem', PERDIEM);
  const fdecRentalCost = sumGroup('fdecRental', FDEC_RENTAL);
  const eqFeesCost = sumGroup('eqFees', EQ_FEES);
  const itmCost = sumGroup('itmSP', null) + sumGroup('itmAL', null);
  const backflowCost = sumGroup('backflow', BACKFLOW);
  const firePumpCost = sumGroup('firePump', FIREPUMP);
  const sampleCost = sumGroup('sampleTest', SAMPLES);

  /* materials */
  const matItemCost = sumMaterialCatalog();
  const vendorCost = sumMoneyRows('vendorQuotes');
  const materialCost = matItemCost + vendorCost; /* total material cost (for section subtotal/tax base) */
  /* Combined material line: itemized (misc) + vendor-quoted, each keeping its
     own markup. Show a blended markup % that reflects the actual dollars. */
  const matCustTotal = matItemCost*(1+P.miscmat) + vendorCost*(1+P.material);
  const matBlendedPct = materialCost > 0 ? fmtPct((matCustTotal / materialCost) - 1) : null;
  const rentalQuoteCost = sumMoneyRows('rentalQuotes');
  const subQuoteCost = sumMoneyRows('subQuotes');
  const hotelCost = num($('hotelCost'));
  const otherCost = num($('otherCost')), permitCost = num($('permitCost'));
  $('hotelOut').textContent = money(hotelCost*(1+P.hotel));
  $('otherOut').textContent = money(otherCost*(1+P.other));
  $('permitOut').textContent = money(permitCost*(1+P.permit));

  /* summary lines: [label, cost, markup, customer] */
  const lines = [
    ['(SP) ST labor', spST.cost, null, spST.cust],
    ['(SP) OT labor', spOT.cost, null, spOT.cust],
    ['(SP) DT labor', spDT.cost, null, spDT.cust],
    ['(FA) ST labor', faST.cost, null, faST.cust],
    ['(FA) OT labor', faOT.cost, null, faOT.cust],
    ['(FA) DT labor', faDT.cost, null, faDT.cust],
    ['Subcontractor testing (samples)', sampleCost, fmtPct(P.samples), sampleCost*(1+P.samples)],
    ['Subcontractor quotes', subQuoteCost, fmtPct(P.subq), subQuoteCost*(1+P.subq)],
    ['Equipment rental (outside)', rentalQuoteCost, fmtPct(P.rentalq), rentalQuoteCost*(1+P.rentalq)],
    ['Backflow testing', backflowCost, fmtPct(P.backflow), backflowCost*(1+P.backflow)],
    ['Fire pump testing', firePumpCost, fmtPct(P.firepump), firePumpCost*(1+P.firepump)],
    ['(SP) transportation', truckCosts[0]||0, null, truckCosts[0]||0],
    ['(FA) transportation', truckCosts[1]||0, null, truckCosts[1]||0],
    ['Box truck', truckCosts[2]||0, null, truckCosts[2]||0],
    ['Materials', matItemCost + vendorCost, matBlendedPct, matItemCost*(1+P.miscmat) + vendorCost*(1+P.material)],
    ['FDEC lift & equipment rental', fdecRentalCost, null, fdecRentalCost],
    ['FDEC equipment fees', eqFeesCost, fmtPct(P.eqfees), eqFeesCost*(1+P.eqfees)],
    ['Hotel', hotelCost, fmtPct(P.hotel), hotelCost*(1+P.hotel)],
    ['Per diem', perdiemCost, null, perdiemCost],
    ['ITM material (incl. IROL)', itmCost, null, itmCost],
    ['Other expense', otherCost, fmtPct(P.other), otherCost*(1+P.other)],
    ['Permit fees', permitCost, fmtPct(P.permit), permitCost*(1+P.permit)],
  ];

  const grandCost = lines.reduce((a,l)=>a+l[1],0);
  const grandCust = lines.reduce((a,l)=>a+l[3],0);
  const custMaterial = matItemCost*(1+P.miscmat) + vendorCost*(1+P.material);
  const tax = custMaterial*P.tax + itmCost*P.tax;
  // Round the down payment UP to the nearest $100, regardless of the
  // down payment percentage, so the quoted figure is always a clean amount.
  const down = Math.ceil((grandCust*P.down) / 100) * 100;
  const profit = grandCust - grandCost;

  const tb = $('summaryBody');
  tb.innerHTML = '';
  let shown = 0;
  lines.forEach(l => {
    if (!l[1] && !l[3]) return;
    shown++;
    const tr = document.createElement('tr');
    tr.className = 'lineitem';
    tr.innerHTML = `<td>${l[0]}</td><td class="num">${money(l[1])}</td>
      <td class="num">${money(l[3])}</td>`;
    tb.appendChild(tr);
  });
  if (!shown){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="3" class="empty">Nothing quoted yet — enter hours or quantities above.</td>';
    tb.appendChild(tr);
  }
  [['Grand totals', grandCost, '', grandCust, 'grand'],
   ['Potential profit' + (grandCust ? ' (' + fmtPct(profit/grandCust) + ' margin)' : ''), '', '', profit, 'grand profit'],
   ['Tax (material + ITM at ' + fmtPct(P.tax) + ')', '', '', tax, 'grand'],
   ['Downpayment (' + fmtPct(P.down) + ')', '', '', down, 'grand']].forEach(l => {
    const tr = document.createElement('tr');
    tr.className = l[4];
    tr.innerHTML = `<td>${l[0]}</td><td class="num">${l[1]===''?'':money(l[1])}</td>
      <td class="num">${money(l[3])}</td>`;
    tb.appendChild(tr);
  });

  $('barCost').textContent = money(grandCost);
  $('barCust').textContent = money(grandCust);
  $('barProfit').textContent = money(profit);
  $('barTax').textContent = money(tax);
  $('barDown').textContent = money(down);

  /* Broadcast the down payment total to the suite shell so the proposal
     tab can auto-fill its down payment note. Silent no-op when opened
     as a standalone file (no parent frame). */
  try {
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec: true, type: 'downpayment', value: down, display: money(down) }, '*');
    }
  } catch(_){}

  /* section subtotals (customer) */
  const sect = {
    labor: spST.cust+spOT.cust+spDT.cust+faST.cust+faOT.cust+faDT.cust,
    transport: (truckCosts[0]||0)+(truckCosts[1]||0)+(truckCosts[2]||0)+perdiemCost+hotelCost*(1+P.hotel),
    rental: fdecRentalCost + rentalQuoteCost*(1+P.rentalq),
    material: matItemCost*(1+P.miscmat) + vendorCost*(1+P.material),
    eqfees: eqFeesCost*(1+P.eqfees),
    itm: itmCost,
    testing: sampleCost*(1+P.samples) + subQuoteCost*(1+P.subq) + backflowCost*(1+P.backflow) + firePumpCost*(1+P.firepump),
    other: otherCost*(1+P.other) + permitCost*(1+P.permit)
  };
  document.querySelectorAll('.sect-total').forEach(el => {
    const v = sect[el.dataset.sect];
    el.textContent = v ? money(v) : '';
  });

  /* manpower */
  const mp = {ST:0, OT:0, DT:0, AD:0};
  const trips = mpTrips();
  document.querySelectorAll('#mpRows tr').forEach(tr => {
    const techs = num(tr.querySelector('.mp-tech'));
    const hrsEach = num(tr.querySelector('.mp-hrs'));
    const total = techs * hrsEach;
    tr.querySelector('.mp-total').textContent = total || 0;
    tr.querySelector('.mp-trips').textContent = rowTrips(tr);
    const cls = tr.querySelector('.mp-class').value;
    /* Same over-8 split as applyManpower so the breakdown matches the labor. */
    if ((cls === 'ST' || cls === 'OT') && hrsEach > 8 && techs){
      mp.ST += techs * 8;
      mp.OT += techs * (hrsEach - 8);
    } else {
      mp[cls] += total;
    }
  });
  $('mpST').textContent = mp.ST; $('mpOT').textContent = mp.OT;
  $('mpDT').textContent = mp.DT; $('mpAD').textContent = mp.AD;
  $('mpTot').textContent = mp.ST+mp.OT+mp.DT+mp.AD;
  $('mpSPtrips').textContent = trips.SP; $('mpALtrips').textContent = trips.FA;

  renderMpSummary();
  buildSelected();

  /* Non-blocking sanity checks to catch common omissions before a quote
     goes out. These never block anything — just gentle nudges. */
  renderSanityFlags({
    grandCost, grandCust, profit,
    matCost: matItemCost + vendorCost,
    laborCost: spST.cust + spOT.cust + spDT.cust + faST.cust + faOT.cust + faDT.cust,
    mpHours: mp.ST + mp.OT + mp.DT + mp.AD,
    trips: (trips.SP || 0) + (trips.FA || 0),
    hotel: hotelCost, perdiem: perdiemCost,
    hasAnyMaterialQty: !!document.querySelector('#materialCatalog .mat-item.filled')
  });

  /* Auto-save this quote to the suite (crash protection). Debounced so we
     don't hammer storage on every keystroke. */
  scheduleAutosave();
}

/* ---- Auto-save (crash protection) ------------------------------------
   Posts the current quote draft to the suite shell, which persists it to
   its own (stable) localStorage. Debounced so rapid edits don't thrash.
   Silent no-op when opened as a standalone file with no parent frame. */
var _autosaveTimer = null;
function scheduleAutosave(){
  if (!(window.parent && window.parent !== window)) return;
  clearTimeout(_autosaveTimer);
  _autosaveTimer = setTimeout(function(){
    try {
      var draft = collectDraft();
      window.parent.postMessage({ fdec:true, type:'autosave', page:'quote', data:draft }, '*');
    } catch(_){}
  }, 1200);
}

/* Tell the shell the moment the user starts working, so it can dismiss the
   "restore previous session?" banner. Fires on focusing any field. */
document.addEventListener('focusin', function(e){
  var t = e.target;
  if (!t) return;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'){
    if (window.parent && window.parent !== window){
      try { window.parent.postMessage({ fdec:true, type:'user-active' }, '*'); } catch(_){}
    }
  }
});

/* ---- Sanity flags ---------------------------------------------------- */
function renderSanityFlags(s){
  const host = $('sanityFlags');
  if (!host) return;
  const flags = [];
  const warn = msg => flags.push(['warn', msg]);
  const info = msg => flags.push(['info', msg]);

  // Only bother once something has been quoted.
  const quoted = s.grandCust > 0 || s.grandCost > 0;
  const hasLabor = s.laborCost > 0 || s.mpHours > 0;
  if (quoted){
    if (s.matCost > 0 && !hasLabor)
      warn('Materials are entered but no labor — did you forget to add manpower or labor hours?');
    if (hasLabor && s.matCost === 0 && !s.hasAnyMaterialQty)
      info('Labor is entered but no materials — confirm this job needs no parts.');
    if (hasLabor && s.trips === 0)
      info('Labor is entered but no trips/trucks — confirm transportation isn\u2019t needed.');
    if (s.hotel > 0 && s.perdiem === 0)
      info('A hotel cost is entered but no per diem — overnight jobs usually include per diem.');
    if (s.grandCust > 0){
      const margin = s.profit / s.grandCust;
      if (s.profit < 0)
        warn('This quote is priced below cost (negative margin) — check markups and rates.');
      else if (margin < 0.10)
        warn('Margin is under 10% (' + fmtPct(margin) + ') — this quote may be underpriced.');
      else if (margin > 0.75)
        info('Margin is over 75% (' + fmtPct(margin) + ') — double-check quantities and markups.');
    }
  }

  host.innerHTML = '';
  if (!flags.length){ host.style.display = 'none'; return; }
  flags.forEach(([kind, msg]) => {
    const div = document.createElement('div');
    div.className = 'sanity-flag ' + kind;
    div.innerHTML = '<span class="ico">' + (kind === 'warn' ? '\u26A0' : '\u2139') + '</span><span>' + msg + '</span>';
    host.appendChild(div);
  });
  host.style.display = '';
}

/* Build the Manpower / Tasks table in the Quote Summary from the manpower
   rows. Shows only rows that have real data (a task name or hours). */
const MP_DEPT_NAMES = { SP:'Sprinkler', FA:'Fire Alarm' };
const MP_CLASS_NAMES = { ST:'Straight Time', OT:'Overtime', DT:'Double Time', AD:'Admin' };
function renderMpSummary(){
  const body = $('mpSummaryBody');
  const wrap = $('mpSummaryWrap');
  if (!body || !wrap) return;
  body.innerHTML = '';
  let totHours = 0, totTrips = 0, shown = 0;
  document.querySelectorAll('#mpRows tr').forEach(tr => {
    const task = (tr.querySelector('.mp-task').value || '').trim();
    const tech = num(tr.querySelector('.mp-tech'));
    const hrsEach = num(tr.querySelector('.mp-hrs'));
    const hours = tech * hrsEach;
    // Skip empty rows (no task text and no hours).
    if (!task && !hours) return;
    const dept = tr.querySelector('.mp-dept').value;
    const cls = tr.querySelector('.mp-class').value;
    const rTrips = rowTrips(tr);
    totHours += hours; totTrips += rTrips; shown++;
    const row = document.createElement('tr');
    row.innerHTML =
      `<td>${(task || '—').replace(/</g,'&lt;')}</td>` +
      `<td>${MP_DEPT_NAMES[dept] || dept}</td>` +
      `<td class="num">${tech || 0}</td>` +
      `<td class="num">${hrsEach || 0}</td>` +
      `<td>${MP_CLASS_NAMES[cls] || cls}</td>` +
      `<td class="num">${hours || 0}</td>` +
      `<td class="num">${rTrips || 0}</td>`;
    body.appendChild(row);
  });
  $('mpSummaryHours').textContent = totHours;
  $('mpSummaryTrips').textContent = totTrips;
  // Show the section (and its Copy button) when there are manpower tasks OR
  // any labor/transportation/per-diem/hotel data worth copying.
  const table = $('mpSummaryTable');
  if (table) table.style.display = shown ? '' : 'none';
  wrap.style.display = (shown || hasCopyableExtras()) ? '' : 'none';
}

/* True if there is Labor, Trucks, Per Diem, or Hotel data entered (used to
   decide whether the Copy button should appear even with no manpower tasks). */
function hasCopyableExtras(){
  const laborIds = ['spST','spOT','spDT','spAD','shopST','shopOT','shopDT','faST','faOT','faDT'];
  if (laborIds.some(id => $(id) && num($(id)) > 0)) return true;
  if (document.querySelector('input[data-g="trucks"][data-f="qty"]') &&
      [...document.querySelectorAll('input[data-g="trucks"][data-f="qty"]')].some(el => num(el) > 0)) return true;
  if ([...document.querySelectorAll('input[data-g="perdiem"][data-f="qty"]')].some(el => num(el) > 0)) return true;
  if ($('hotelCost') && num($('hotelCost')) > 0) return true;
  const sel = collectSelected();
  if (sel.mats.length || sel.equip.length) return true;
  if ([...document.querySelectorAll('#vendorQuotes .listrow .moneyval')].some(el => num(el) > 0)) return true;
  return false;
}

/* Build a clean, readable plain-text version of the manpower tasks and copy
   it to the clipboard — reads well when pasted into ServiceTrade, email, or
   any app regardless of font. Also includes any labor, transportation, per
   diem, and hotel entered in the Labor & Transportation sections. */
function buildManpowerText(){
  const out = [];
  let any = false;

  /* ---- Manpower / Tasks ---- */
  const taskLines = [];
  let totHours = 0;
  document.querySelectorAll('#mpRows tr').forEach(tr => {
    const task = (tr.querySelector('.mp-task').value || '').trim();
    const tech = num(tr.querySelector('.mp-tech'));
    const hrsEach = num(tr.querySelector('.mp-hrs'));
    const hours = tech * hrsEach;
    if (!task && !hours) return;
    const dept = MP_DEPT_NAMES[tr.querySelector('.mp-dept').value] || tr.querySelector('.mp-dept').value;
    totHours += hours;
    const techWord = tech === 1 ? 'tech' : 'techs';
    taskLines.push(`\u2022 ${task || '(untitled task)'} \u2014 ${dept}, ${tech} ${techWord} \u00d7 ${hrsEach} hrs each`);
  });
  if (taskLines.length){
    any = true;
    out.push('MANPOWER / TASKS', '');
    out.push(...taskLines);
    out.push('', `Total: ${totHours} hours`);
  }

  /* ---- Hourly Rates (billed rate per class, only where hours are entered) ---- */
  const rateLines = [];
  const rateGroups = [
    ['Sprinkler', 'sp', [['spST','ST','Straight Time'],['spOT','OT','Overtime'],['spDT','DT','Double Time'],['spAD','AD','Admin']]],
    ['Fire Alarm', 'fa', [['faST','ST','Straight Time'],['faOT','OT','Overtime'],['faDT','DT','Double Time']]]
  ];
  rateGroups.forEach(([label, dept, classes]) => {
    classes.forEach(([id, key, clsName]) => {
      const el = $(id);
      if (!el || !(num(el) > 0)) return;
      const lvl = $(id + 'Lvl') ? $(id + 'Lvl').value : '2';
      const rate = rateFor(lvl, key, dept);
      rateLines.push(`\u2022 ${label} ${clsName}: ${money(rate)}/hr`);
    });
  });
  if (rateLines.length){
    if (any) out.push('');
    any = true;
    out.push('HOURLY RATES', '');
    out.push(...rateLines);
  }

  /* ---- Admin (hours and cost) ---- */
  const adEl = $('spAD');
  const adHrs = adEl ? num(adEl) : 0;
  if (adHrs > 0){
    const adLvl = $('spADLvl') ? $('spADLvl').value : '2';
    const adRate = rateFor(adLvl, 'AD', 'sp');
    const adCost = adHrs * adRate;
    const hrWord = adHrs === 1 ? 'hour' : 'hours';
    if (any) out.push('');
    any = true;
    out.push('ADMIN', '');
    out.push(`\u2022 ${adHrs} ${hrWord} \u00d7 ${money(adRate)}/hr = ${money(adCost)}`);
  }

  /* ---- Trucks ---- */
  const truckLines = [];
  TRUCKS.forEach((t, i) => {
    const qtyEl = document.querySelector(`input[data-g="trucks"][data-i="${i}"][data-f="qty"]`);
    const q = qtyEl ? num(qtyEl) : 0;
    if (!q) return;
    truckLines.push(`\u2022 ${t[0]}: ${q}`);
  });
  if (truckLines.length){
    if (any) out.push('');
    any = true;
    out.push('TRUCKS', '');
    out.push(...truckLines);
  }

  /* ---- Per Diem ---- */
  const pdLines = [];
  PERDIEM.forEach((p, i) => {
    const qtyEl = document.querySelector(`input[data-g="perdiem"][data-i="${i}"][data-f="qty"]`);
    const q = qtyEl ? num(qtyEl) : 0;
    if (!q) return;
    const dayWord = q === 1 ? 'day' : 'days';
    pdLines.push(`\u2022 ${p[0]}: ${q} ${dayWord}`);
  });
  if (pdLines.length){
    if (any) out.push('');
    any = true;
    out.push('PER DIEM', '');
    out.push(...pdLines);
  }

  /* ---- Hotel ---- */
  const hotel = num($('hotelCost'));
  if (hotel){
    if (any) out.push('');
    any = true;
    out.push('HOTEL', '');
    out.push(`\u2022 Hotel: ${money(hotel)}`);
  }

  /* ---- Selected Materials & Equipment ---- */
  const sel = collectSelected();
  if (sel.mats.length){
    if (any) out.push('');
    any = true;
    out.push('MATERIALS', '');
    sel.mats.forEach(m => out.push(`\u2022 (${m[1]}) ${m[0]}`));
  }
  if (sel.equip.length){
    if (any) out.push('');
    any = true;
    out.push('EQUIPMENT', '');
    sel.equip.forEach(m => out.push(`\u2022 (${m[1]}) ${m[0]}`));
  }

  /* ---- Vendor Orders (any vendor quote with a price entered) ---- */
  const vendorLines = [];
  document.querySelectorAll('#vendorQuotes .listrow').forEach(row => {
    const val = num(row.querySelector('.moneyval'));
    if (!val) return;
    const name = (row.querySelector('.moneyname').value || '').trim();
    vendorLines.push(`\u2022 ${name || 'Vendor'} Order PO`);
  });
  if (vendorLines.length){
    if (any) out.push('');
    any = true;
    out.push('VENDOR ORDERS', '');
    out.push(...vendorLines);
  }

  /* ---- Cost Totals (customer-billed material and equipment) ---- */
  const costLines = [];
  const P = markups();
  const matItemCost = sumMaterialCatalog();
  const vendorCost = sumMoneyRows('vendorQuotes');
  const custMaterial = matItemCost*(1+P.miscmat) + vendorCost*(1+P.material);
  const eqFeesCost = sumGroup('eqFees', EQ_FEES);
  const custEquip = eqFeesCost*(1+P.eqfees);
  if (custMaterial > 0) costLines.push(`\u2022 Material total: ${money(custMaterial)}`);
  if (custEquip > 0) costLines.push(`\u2022 Equipment total: ${money(custEquip)}`);
  if (costLines.length){
    if (any) out.push('');
    any = true;
    out.push('COST TOTALS', '');
    out.push(...costLines);
  }

  return any ? out.join('\n') : '';
}

function copyManpower(){
  const text = buildManpowerText();
  if (!text){ setStatus('Nothing to copy yet — add tasks, labor, trucks, per diem, or hotel.'); return; }
  const done = () => setStatus('Copied — paste into ServiceTrade.');
  const fail = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); ta.remove(); done();
    } catch(_){ setStatus('Copy blocked by browser — select the table text manually.'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else { fail(); }
}

/* ================= SELECTED MATERIALS & EQUIPMENT ================= */
function collectSelected(){
  const mats = [], equip = [];
  document.querySelectorAll('#materialCatalog .mat-item').forEach(tr => {
    const q = num(tr.querySelector('.mi-qty')), n = (tr.querySelector('.mi-name').value || '').trim();
    if (q && n) mats.push([n, q]);
  });
  document.querySelectorAll('#eqFees input[data-g="eqFees"][data-f="qty"]').forEach(inp => {
    const q = num(inp); if (!q) return;
    const tr = inp.closest('tr');
    const nameInp = tr.querySelector('.eq-name');
    const name = nameInp ? (nameInp.value || '').trim() : '';
    if (name) equip.push([name, q]);
  });
  document.querySelectorAll('input[data-g="fdecRental"][data-f="qty"]').forEach(inp => {
    const q = num(inp); if (q) equip.push(['FDEC ' + FDEC_RENTAL[inp.dataset.i][0].toLowerCase(), q]);
  });
  return {mats, equip};
}

function buildSelected(){
  const {mats, equip} = collectSelected();
  const out = $('selectedOut');
  if (!mats.length && !equip.length){
    out.innerHTML = '<p class="empty">No materials or equipment selected yet.</p>';
    return;
  }
  let html = '';
  if (mats.length){
    html += '<h3 class="sub">Materials</h3><ul class="selected-list">' +
      mats.map(m => `<li>(${m[1]}) ${m[0]}</li>`).join('') + '</ul>';
  }
  if (equip.length){
    html += '<h3 class="sub">Equipment</h3><ul class="selected-list">' +
      equip.map(m => `<li>(${m[1]}) ${m[0]}</li>`).join('') + '</ul>';
  }
  out.innerHTML = html;
}

/* ================= ACTIONS ================= */
function rowTrips(tr){
  if (tr.querySelector('.mp-class').value === 'AD') return 0;
  const hrs = num(tr.querySelector('.mp-hrs'));
  const techs = num(tr.querySelector('.mp-tech'));
  if (!hrs || !techs) return 0;
  return techs * Math.ceil(hrs / 8);
}
function mpTrips(){
  const trips = { SP:0, FA:0 };
  document.querySelectorAll('#mpRows tr').forEach(tr => {
    trips[tr.querySelector('.mp-dept').value] += rowTrips(tr);
  });
  return trips;
}
function syncTrucksFromMp(){
  const t = mpTrips();
  document.querySelector('input[data-g="trucks"][data-i="0"][data-f="qty"]').value = t.SP || '';
  document.querySelector('input[data-g="trucks"][data-i="1"][data-f="qty"]').value = t.FA || '';
}
function mpChanged(){ syncTrucksFromMp(); recalc(); }

function applyManpower(){
  const mp = { SP:{ST:0,OT:0,DT:0,AD:0}, FA:{ST:0,OT:0,DT:0,AD:0} };
  document.querySelectorAll('#mpRows tr').forEach(tr => {
    const techs = num(tr.querySelector('.mp-tech'));
    const hrsEach = num(tr.querySelector('.mp-hrs'));
    const dept = tr.querySelector('.mp-dept').value;
    const cls = tr.querySelector('.mp-class').value;
    if (!techs || !hrsEach) return;
    /* Admin and Double Time are not auto-split. For Straight Time and
       Overtime rows, anything over 8 hrs each becomes overtime: the first
       8 hrs per tech are straight time, the remainder is overtime. */
    if ((cls === 'ST' || cls === 'OT') && hrsEach > 8){
      const stEach = 8;
      const otEach = hrsEach - 8;
      mp[dept].ST += techs * stEach;
      mp[dept].OT += techs * otEach;
    } else {
      mp[dept][cls] += techs * hrsEach;
    }
  });
  $('spST').value = mp.SP.ST || ''; $('spOT').value = mp.SP.OT || '';
  $('spDT').value = mp.SP.DT || '';
  $('spAD').value = (mp.SP.AD + mp.FA.AD) || '';  /* admin hours book to the sprinkler admin line */
  $('faST').value = mp.FA.ST || ''; $('faOT').value = mp.FA.OT || '';
  $('faDT').value = mp.FA.DT || '';
  syncTrucksFromMp();
  recalc();
}

function savePDF(){
  const old = document.title;
  const name = ['FDEC_Quote', $('quoteNo').value.trim(), $('jobName').value.trim()]
    .filter(Boolean).join('_').replace(/[^\w-]+/g,'_');
  document.title = name;
  window.print();
  setTimeout(() => { document.title = old; }, 500);
}

/* ================= DRAFT SAVE / LOAD ================= */
/* Captures the full quote state so it can be reopened and edited later.
   A saved draft is a self-contained copy of this tool with the state
   embedded in the #draftState block, which auto-loads when opened. */

function collectDraft(){
  const d = { meta:{ app:'FDEC Quoting Template', author:'Mitch Peebles', version:'V4.0', savedAt:new Date().toISOString() },
              fields:{}, dynamic:{ materialCatalog:[], vendorQuotes:[], rentalQuotes:[], subQuotes:[], eqFees:[], po:[], mp:[] } };

  /* All simple inputs & selects that carry a value, keyed where possible. */
  document.querySelectorAll('input, select, textarea').forEach(el => {
    if (el.type === 'file' || el.type === 'button') return;
    /* Skip dynamic-row controls — captured separately below. */
    if (el.closest('#materialItems') || el.closest('#vendorQuotes') || el.closest('#rentalQuotes') ||
        el.closest('#subQuotes') || el.closest('#poRows') || el.closest('#mpRows') || el.closest('#eqFees')) return;
    const key = el.id ||
      (el.dataset && el.dataset.g != null ? `g:${el.dataset.g}:${el.dataset.i}:${el.dataset.f}` : '') ||
      (el.dataset && el.dataset.key ? `mk:${el.dataset.key}` : '') ||
      (el.dataset && el.dataset.lvl ? `rate:${el.dataset.tbl || 'sp'}:${el.dataset.cls}:${el.dataset.lvl}` : '');
    if (!key) return;
    d.fields[key] = el.value;
  });

  /* Material catalog (collapsible categories/subcategories/items) */
  d.dynamic.materialCatalog = collectMaterialCatalog();
  /* Money-row groups */
  const grabMoney = id => [...document.querySelectorAll(`#${id} .listrow`)].map(r => ({
    name: r.querySelector('.moneyname').value, val: r.querySelector('.moneyval').value
  }));
  d.dynamic.vendorQuotes = grabMoney('vendorQuotes');
  d.dynamic.rentalQuotes = grabMoney('rentalQuotes');
  d.dynamic.subQuotes   = grabMoney('subQuotes');
  /* FDEC equipment fees (editable rows) */
  d.dynamic.eqFees = [...document.querySelectorAll('#eqFees tr')].map(tr => ({
    name: (tr.querySelector('.eq-name')||{}).value || '',
    rate: (tr.querySelector('input[data-f="rate"]')||{}).value || '',
    qty:  (tr.querySelector('input[data-f="qty"]')||{}).value || ''
  })).filter(r => r.name || r.rate || r.qty);
  /* Manpower rows */
  document.querySelectorAll('#mpRows tr').forEach(tr => {
    d.dynamic.mp.push({
      task: tr.querySelector('.mp-task').value,
      dept: tr.querySelector('.mp-dept').value,
      tech: tr.querySelector('.mp-tech').value,
      hrs:  tr.querySelector('.mp-hrs').value,
      cls:  tr.querySelector('.mp-class').value
    });
  });
  return d;
}

function applyDraft(d){
  if (!d || !d.fields) return;
  /* Rebuild dynamic rows to match the saved counts. */
  const clear = sel => { const c = document.querySelector(sel); if (c) c.innerHTML = ''; };

  /* Material catalog: rebuild from saved structure, or defaults if absent. */
  applyMaterialCatalog(d.dynamic.materialCatalog);

  clear('#vendorQuotes');
  (d.dynamic.vendorQuotes || []).forEach(v => addMoneyRow('vendorQuotes','Vendor', v.name, v.val));
  clear('#rentalQuotes');
  (d.dynamic.rentalQuotes || []).forEach(v => addMoneyRow('rentalQuotes','Rental vendor', v.name, v.val));
  clear('#subQuotes');
  (d.dynamic.subQuotes || []).forEach(v => addMoneyRow('subQuotes','Subcontractor', v.name, v.val));

  /* FDEC equipment fees: rebuild from saved rows, or defaults if absent. */
  if (d.dynamic.eqFees && d.dynamic.eqFees.length){
    const tb = $('eqFees'); tb.innerHTML = ''; _eqSeq = 0;
    d.dynamic.eqFees.forEach(r => eqFeeRow(r.name, r.rate, r.qty));
  } else {
    buildEqFees();
    /* Backward compatibility: older drafts (saved before equipment became
       editable) stored quantities/fees by position as g:eqFees:N:qty and
       g:eqFees:N:rate in d.fields. Map those onto the default rows by index.
       This assumes the old list order matches the current default order. */
    const rows = [...document.querySelectorAll('#eqFees tr')];
    let recovered = 0;
    rows.forEach((tr, idx) => {
      const qKey = `g:eqFees:${idx}:qty`, rKey = `g:eqFees:${idx}:rate`;
      if (qKey in d.fields && d.fields[qKey] !== ''){
        const qEl = tr.querySelector('input[data-f="qty"]');
        if (qEl){ qEl.value = d.fields[qKey]; recovered++; }
      }
      if (rKey in d.fields && d.fields[rKey] !== ''){
        const rEl = tr.querySelector('input[data-f="rate"]');
        if (rEl) rEl.value = d.fields[rKey];
      }
    });
    if (recovered) setTimeout(() => setStatus(
      'Draft loaded. Recovered ' + recovered + ' equipment quantit' + (recovered===1?'y':'ies') +
      ' from an older draft — please verify the FDEC Equipment Fees section.'), 60);
  }

  clear('#mpRows');
  (d.dynamic.mp || []).forEach(m => addMpRow(m));
  if (!d.dynamic.mp || !d.dynamic.mp.length) for (let i=0;i<3;i++) addMpRow();

  /* Restore simple field values by the same keys used in collectDraft. */
  document.querySelectorAll('input, select, textarea').forEach(el => {
    if (el.type === 'file' || el.type === 'button') return;
    if (el.closest('#materialItems') || el.closest('#vendorQuotes') || el.closest('#rentalQuotes') ||
        el.closest('#subQuotes') || el.closest('#poRows') || el.closest('#mpRows') || el.closest('#eqFees')) return;
    const key = el.id ||
      (el.dataset && el.dataset.g != null ? `g:${el.dataset.g}:${el.dataset.i}:${el.dataset.f}` : '') ||
      (el.dataset && el.dataset.key ? `mk:${el.dataset.key}` : '') ||
      (el.dataset && el.dataset.lvl ? `rate:${el.dataset.tbl || 'sp'}:${el.dataset.cls}:${el.dataset.lvl}` : '');
    if (key && key in d.fields) el.value = d.fields[key];
  });

  recalc();
  setStatus(`Draft loaded${d.meta && d.meta.savedAt ? ' (saved ' + new Date(d.meta.savedAt).toLocaleString() + ')' : ''}.`);
}

function setStatus(msg){
  let bar = document.getElementById('draftStatus');
  if (!bar){
    bar = document.createElement('div');
    bar.id = 'draftStatus';
    bar.className = 'noprint';
    bar.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#1b1f24;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:9999;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;transition:opacity .2s';
    document.body.appendChild(bar);
  }
  bar.textContent = msg;
  bar.style.opacity = '1';
  clearTimeout(bar._t);
  bar._t = setTimeout(() => { bar.style.opacity = '0'; }, 3200);
}

function saveDraft(){
  const draft = collectDraft();
  const json = JSON.stringify(draft);
  /* Embed the state into a fresh copy of this document so it reopens ready to edit. */
  const clone = document.documentElement.cloneNode(true);
  const holder = clone.querySelector('#draftState');
  if (holder) holder.textContent = json;
  /* Strip any transient status bar from the clone. */
  const s = clone.querySelector('#draftStatus'); if (s) s.remove();
  const html = '<!DOCTYPE html>\n' + clone.outerHTML;

  const name = ['FDEC_Quote_DRAFT', $('quoteNo').value.trim(), $('jobName').value.trim()]
    .filter(Boolean).join('_').replace(/[^\w-]+/g,'_') || 'FDEC_Quote_DRAFT';
  const blob = new Blob([html], { type:'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  setStatus('Draft saved — reopen this file to keep editing.');
}

function loadDraftFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    let data = null;
    /* Accept either a saved draft HTML (with #draftState) or a raw JSON export. */
    const text = e.target.result;
    try {
      const doc = new DOMParser().parseFromString(text, 'text/html');
      const blk = doc.querySelector('#draftState');
      if (blk && blk.textContent.trim()) data = JSON.parse(blk.textContent);
    } catch(_){}
    if (!data){ try { data = JSON.parse(text); } catch(_){} }
    if (!data){ setStatus('Could not read a draft from that file.'); input.value=''; return; }
    applyDraft(data);
    input.value = '';
  };
  reader.readAsText(file);
}

/* Auto-load an embedded draft if this file was opened as a saved draft. */
(function(){
  const blk = document.getElementById('draftState');
  if (blk && blk.textContent.trim()){
    try { applyDraft(JSON.parse(blk.textContent)); } catch(_){}
  }
})();

/* ---------------- Shared job-info master ----------------
   The Quoting Template owns Job Name / Quote # / Date. When these change,
   broadcast them (mapped to a shared shape) to the suite shell, which relays
   the values to the verbiage pages. */
function broadcastJobInfo(){
  try {
    if (window.parent && window.parent !== window){
      var jn = document.getElementById('jobName');
      var qn = document.getElementById('quoteNo');
      var qd = document.getElementById('quoteDate');
      window.parent.postMessage({ fdec:true, type:'jobinfo', value:{
        customer: jn ? jn.value : '',
        quote:    qn ? qn.value : '',
        date:     qd ? qd.value : ''
      }}, '*');
    }
  } catch(_){}
}
['jobName','quoteNo','quoteDate'].forEach(function(id){
  var el = document.getElementById(id);
  if (el){ el.addEventListener('input', broadcastJobInfo); el.addEventListener('change', broadcastJobInfo); }
});
// Broadcast initial values once the shell is ready.
setTimeout(broadcastJobInfo, 150);

/* Re-broadcast the down payment when the suite shell asks (e.g. when the
   Proposal tab is opened), so the note stays in sync even if the proposal
   frame loaded after the last edit. */
window.addEventListener('message', function(e){
  const d = e && e.data;
  if (!d || d.fdec !== true) return;
  if (d.type === 'request-sync'){ recalc(); return; }
  if (d.type === 'send-jobinfo'){
    // The Quoting Template is the master for Job Name / Quote # / Date.
    // Broadcast current values so the verbiage pages can follow.
    broadcastJobInfo();
    return;
  }
  if (d.type === 'get-draft'){
    // Return this page's draft state so the shell can bundle a suite draft.
    var payload = null, gerr = null;
    try { payload = collectDraft(); } catch(ex){ gerr = String(ex && ex.message || ex); }
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:'draft-data', page:'quote', reqId:d.reqId, data:payload, error:gerr }, '*');
    }
    return;
  }
  if (d.type === 'load-draft'){
    // Apply an incoming draft slice for this page.
    try { if (d.data) applyDraft(d.data); } catch(ex){ console.error(ex); }
    return;
  }
  if (d.type === 'get-quote-html'){
    let html = "", css = "", err = null;
    try {
      recalc(); // make sure the summary reflects current inputs
      // Collect this document's own styles.
      css = Array.from(document.querySelectorAll('style')).map(s => s.textContent).join('\n');
      // Clone the printable content and inline current form values so they
      // survive serialization (typed values aren't in the HTML otherwise).
      const wrap = document.createElement('div');
      ['header.top', 'div.wrap'].forEach(sel => {
        const src = document.querySelector(sel);
        if (src) wrap.appendChild(src.cloneNode(true));
      });
      // Inline values for inputs/selects/textareas by matching against live DOM.
      const liveInputs = document.querySelectorAll('input,select,textarea');
      const cloneInputs = wrap.querySelectorAll('input,select,textarea');
      cloneInputs.forEach((c, i) => {
        const live = liveInputs[i];
        if (!live) return;
        if (c.tagName === 'SELECT'){
          const idx = live.selectedIndex;
          if (c.options[idx]) c.options[idx].setAttribute('selected','selected');
        } else if (c.tagName === 'TEXTAREA'){
          c.textContent = live.value;
        } else {
          c.setAttribute('value', live.value);
        }
      });
      // Remove interactive-only elements from the clone.
      wrap.querySelectorAll('.noprint, button, .totbar').forEach(el => el.remove());
      // For the exported PDF, keep the Labor, Transportation & Travel, and
      // Quote Summary sections (the summary contains Manpower/Tasks, Selected
      // Materials & Equipment, and Totals). Remove all other collapsible
      // sections so their titles don't clutter the printout, and force the
      // kept ones open.
      var KEEP = { 'sec-labor':1, 'sec-transport':1, 'sec-summary':1 };
      wrap.querySelectorAll('details').forEach(function(el){
        if (KEEP[el.id]){ el.setAttribute('open','open'); }
        else { el.remove(); }
      });
      html = wrap.innerHTML;
    } catch(ex){ err = String(ex && ex.message || ex); }
    if (window.parent && window.parent !== window){
      window.parent.postMessage({
        fdec:true, type:'quote-html', reqId:d.reqId, html:html, css:css, error:err
      }, '*');
    }
  }
});

    ta.addEventListener("input", () => { item.text = ta.value; autoGrow(ta); });
    ta.addEventListener("focus", () => autoGrow(ta));

    const del = document.createElement("button");
    del.className = "del";
    del.title = "Remove item";
    del.innerHTML = "&times;";
    del.addEventListener("click", () => { state[key].splice(i,1); render(key); updateCount(key); });

    li.append(cb, ta, del);

    // Optional subcategory: shown only when the scope item is selected
    if (key === "scope" && item.checked){
      const subUl = document.createElement("ul");
      subUl.className = "subs";
      item.subs.forEach((sub, j) => {
        const sli = document.createElement("li");
        sli.className = "sub" + (sub.checked ? "" : " unchecked");

        const scb = document.createElement("input");
        scb.type = "checkbox";
        scb.checked = sub.checked;
        scb.addEventListener("change", () => {
          sub.checked = scb.checked;
          sli.classList.toggle("unchecked", !scb.checked);
          updateCount(key);
        });

        const sta = document.createElement("textarea");
        sta.rows = 1;
        sta.value = sub.text;
        sta.addEventListener("input", () => { sub.text = sta.value; autoGrow(sta); });
        sta.addEventListener("focus", () => autoGrow(sta));

        const sdel = document.createElement("button");
        sdel.className = "del";
        sdel.title = "Remove sub-item";
        sdel.innerHTML = "&times;";
        sdel.addEventListener("click", () => { item.subs.splice(j,1); render(key); updateCount(key); });

        sli.append(scb, sta, sdel);
        subUl.appendChild(sli);
        (window.requestAnimationFrame || (fn => setTimeout(fn, 0)))(() => autoGrow(sta));
      });

      const addSub = document.createElement("button");
      addSub.className = "addsub";
      addSub.type = "button";
      addSub.textContent = "+ Sub-item";
      addSub.addEventListener("click", () => {
        item.subs.push({ text: "", checked: true });
        render(key);
        const parent = ul.querySelector(`li.item[data-index="${i}"]`);
        const nt = parent && parent.querySelector("ul.subs li.sub:last-of-type textarea");
        if (nt) nt.focus();
      });
      subUl.appendChild(document.createElement("li")).appendChild(addSub);

      li.appendChild(subUl);
    }

    ul.appendChild(li);
    autoGrow(ta);
  });
  updateCount(key);
}

function updateCount(key){
  const el = document.querySelector(`[data-count="${key}"]`);
  if (!el) return;
  if (key === "incexc"){
    const inc = state.incexc.filter(i => i.mode === "inc").length;
    const exc = state.incexc.filter(i => i.mode === "exc").length;
    el.textContent = inc + " included \u00b7 " + exc + " excluded";
  } else if (key === "scope"){
    const sel = state.scope.filter(i => i.checked);
    const subs = sel.reduce((n,i) => n + i.subs.filter(s => s.checked).length, 0);
    el.textContent = sel.length + " selected" + (subs ? " \u00b7 " + subs + " sub-item" + (subs === 1 ? "" : "s") : "");
  } else {
    el.textContent = state[key].filter(i => i.checked).length + " selected";
  }
}

/* Merge any newer LIBRARY items into a restored section so additions made
   after a draft was saved are never hidden. Saved items keep their text,
   checked state, and sub-items; library items not present in the saved list
   are appended (unchecked). Scope library entries may be strings or objects
   with subs[]. Matching is by normalized text. */
function mergeLibraryInto(key, savedArr){
  const norm = t => String(t || "").replace(/\s+/g, " ").trim().toLowerCase();
  const out = Array.isArray(savedArr) ? savedArr.slice() : [];
  const seen = new Set(out.map(it => norm(it && it.text)));
  (LIBRARY[key] || []).forEach(entry => {
    if (key === "incexc"){
      const text = entry.text;
      if (!seen.has(norm(text))){ out.push({ text: text, mode: entry.mode }); seen.add(norm(text)); }
      return;
    }
    const obj = (typeof entry === "string") ? { text: entry, subs: [] } : entry;
    if (!seen.has(norm(obj.text))){
      out.push({
        text: obj.text,
        checked: false,
        subs: (obj.subs || []).map(s => ({ text: s, checked: false }))
      });
      seen.add(norm(obj.text));
    }
  });
  return out;
}

let restoredMsg = "";
(function hydrate(){
  const el = document.getElementById("savedState");
  if (!el) return;
  try {
    const saved = JSON.parse(el.textContent);
    if (saved.job){
      document.getElementById("jobCustomer").value = saved.job.customer || "";
      document.getElementById("jobQuote").value    = saved.job.quote    || "";
      // Date intentionally not restored from the template — it is always set
      // to today's date on open (see below).
      if (saved.job.intro) document.getElementById("jobIntro").value = saved.job.intro;
      if (saved.job.signature != null) document.getElementById("jobSignature").value = saved.job.signature;
    }
    if (saved.sections){
      for (const key of ["scope","notes","quals","resp","billing","closing","incexc"]){
        if (Array.isArray(saved.sections[key])) state[key] = mergeLibraryInto(key, saved.sections[key]);
      }
      // guarantee scope items have a subs array
      state.scope.forEach(i => { if (!Array.isArray(i.subs)) i.subs = []; });
    }
    const when = saved.meta && saved.meta.savedAt ? new Date(saved.meta.savedAt) : null;
    restoredMsg = "Draft restored" + (when ? " \u2014 saved " + when.toLocaleString() : "") + ".";
  } catch(e){ console.error("Could not restore saved draft:", e); }
})();

/* ---------------- Shared job-info sync ----------------
   Repair Verbiage is the MASTER for Job Name / Quote # / Date. When these
   change here, broadcast to the suite shell, which relays the values to the
   other pages. Followers (the generated clone pages) set IS_JOBINFO_MASTER
   to false and only receive. */
var IS_JOBINFO_MASTER = false;
(function(){
  function currentJobInfo(){
    return {
      customer: document.getElementById("jobCustomer").value,
      quote:    document.getElementById("jobQuote").value,
      date:     document.getElementById("jobDate").value
    };
  }
  function broadcastJobInfo(){
    if (!IS_JOBINFO_MASTER) return;
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"jobinfo", value: currentJobInfo() }, "*");
    }
  }
  function applyJobInfo(v){
    if (!v) return;
    if (typeof v.customer === "string") document.getElementById("jobCustomer").value = v.customer;
    if (typeof v.quote === "string")    document.getElementById("jobQuote").value = v.quote;
    if (typeof v.date === "string" && v.date) document.getElementById("jobDate").value = v.date;
  }
  // Master: broadcast on any edit to the three shared fields.
  if (IS_JOBINFO_MASTER){
    ["jobCustomer","jobQuote","jobDate"].forEach(function(id){
      var el = document.getElementById(id);
      if (el){ el.addEventListener("input", broadcastJobInfo); el.addEventListener("change", broadcastJobInfo); }
    });
    // Broadcast the initial values (incl. today's date) once the shell is ready.
    setTimeout(broadcastJobInfo, 150);
  }

  /* Auto-save this page to the suite shell (crash protection), debounced.
     Silent no-op when opened standalone. */
  var _autosaveTimer = null;
  function scheduleAutosave(){
    if (!(window.parent && window.parent !== window)) return;
    clearTimeout(_autosaveTimer);
    _autosaveTimer = setTimeout(function(){
      try {
        window.parent.postMessage({ fdec:true, type:'autosave', page:SUITE_PAGE_ID, data:collectState() }, '*');
      } catch(_){}
    }, 1200);
  }
  document.addEventListener("input", scheduleAutosave);
  document.addEventListener("change", scheduleAutosave);
  document.addEventListener("click", function(e){
    // Catch add/remove/toggle actions that change state without an input event.
    if (e.target.closest("button")) setTimeout(scheduleAutosave, 50);
  });
  // Tell the shell when the user starts working, so it can dismiss the
  // "restore previous session?" banner.
  document.addEventListener("focusin", function(e){
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")){
      if (window.parent && window.parent !== window){
        try { window.parent.postMessage({ fdec:true, type:"user-active" }, "*"); } catch(_){}
      }
    }
  });
  // Everyone: accept incoming job-info from the shell. The shell only relays
  // to followers, so the master won't receive its own broadcast.
  window.addEventListener("message", function(e){
    var d = e && e.data;
    if (!d || d.fdec !== true) return;
    if (d.type === "jobinfo") applyJobInfo(d.value);
    // A follower loaded and asked for values; the shell forwards this to the
    // master as 'send-jobinfo'. Master responds by broadcasting current values.
    else if (d.type === "send-jobinfo" && IS_JOBINFO_MASTER) broadcastJobInfo();
  });
  // Followers can request the current values when they load/become visible.
  if (!IS_JOBINFO_MASTER){
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"request-jobinfo" }, "*");
    }
  }
})();

/* When this app first renders inside a hidden iframe (the Quoting tab is
   shown by default), every textarea measures scrollHeight = 0 and collapses
   so its text is invisible. Re-grow all textareas once the tab is actually
   visible. The suite shell posts {type:'relayout'} on tab switch; we also
   listen for our own becoming-visible as a fallback. */
function relayoutTextareas(){
  var run = function(){ document.querySelectorAll("textarea").forEach(autoGrow); };
  // Defer so the browser has laid out the now-visible iframe before we
  // read scrollHeight; run twice to catch any late layout.
  if (typeof requestAnimationFrame === "function"){
    requestAnimationFrame(function(){ run(); requestAnimationFrame(run); });
  } else {
    run();
  }
}
window.addEventListener("message", function(e){
  var d = e && e.data;
  if (d && d.fdec === true && d.type === "relayout") relayoutTextareas();
});
/* Self-healing: when this document transitions from hidden (0 size) to
   visible, re-measure textareas automatically — independent of the shell.
   Covers the case where the app first rendered inside a hidden iframe. */
(function(){
  var seenVisible = false;
  function checkVisible(){
    var visible = document.body && document.body.clientHeight > 0 &&
                  document.documentElement.clientWidth > 0;
    if (visible && !seenVisible){ seenVisible = true; relayoutTextareas(); }
  }
  if (typeof ResizeObserver === "function"){
    try { new ResizeObserver(checkVisible).observe(document.documentElement); } catch(_){}
  }
  window.addEventListener("resize", checkVisible);
  document.addEventListener("visibilitychange", checkVisible);
  // initial + a few delayed attempts to catch first layout
  checkVisible();
  [60, 200, 500].forEach(function(ms){ setTimeout(checkVisible, ms); });
})();
/* Fallback: if this document becomes visible via layout, relayout once. */
if (typeof requestAnimationFrame === "function"){
  requestAnimationFrame(function(){ if (document.body.clientHeight) relayoutTextareas(); });
}

/* ---------------- output helpers ---------------- */
function checkedItems(key){
  return state[key].filter(i => i.checked && i.text.trim()).map(i => i.text.trim());
}
function scopeItems(){
  return state.scope
    .filter(i => i.checked && i.text.trim())
    .map(i => ({
      text: i.text.trim(),
      subs: i.subs.filter(s => s.checked && s.text.trim()).map(s => s.text.trim())
    }));
}
function incexcItems(mode){
  return state.incexc.filter(i => i.mode === mode && i.text.trim()).map(i => i.text.trim());
}
function letterFor(n){ // 0 -> A, 25 -> Z, 26 -> AA
  let s = "";
  n += 1;
  while (n > 0){ n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}
function fmtDate(iso){
  if (!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
}
function jobHeader(){
  return {
    customer: document.getElementById("jobCustomer").value.trim(),
    recipient:"",
    address:  "",
    quote:    document.getElementById("jobQuote").value.trim(),
    date:     fmtDate(document.getElementById("jobDate").value),
    intro:    document.getElementById("jobIntro").value.trim(),
    signature:document.getElementById("jobSignature").value.replace(/\s+$/,"")
  };
}
function setStatus(msg, ok){

  s.className = ok ? "ok" : "";
  if (msg) setTimeout(() => { s.textContent = ""; s.className = ""; }, 4000);

/* ---------------- Word generation (WordprocessingML via JSZip) ---------------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}
// run properties: Calibri 11pt by default
function rPr(o={}){
  return `<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>` +
         (o.bold ? "<w:b/>" : "") +
         (o.underline ? `<w:u w:val="single"/>` : "") +
         (o.color ? `<w:color w:val="${o.color}"/>` : "") +
         `<w:sz w:val="${o.size || 22}"/><w:szCs w:val="${o.size || 22}"/></w:rPr>`;
}
function textRun(t, o={}){
  return `<w:r>${rPr(o)}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
}
// plain paragraph
function xPara(runsXml, { before=0, after=120 } = {}){
  return `<w:p><w:pPr><w:spacing w:before="${before}" w:after="${after}"/></w:pPr>${runsXml}</w:p>`;
}
// numbered/lettered list paragraph with hanging indent (label + tab + text)
function xListPara(label, text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="720"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="720" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun(label) +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}
// second-level sub-item paragraph (a., b., …) indented under its parent
function xSubListPara(label, text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="1440"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="1440" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun(label) +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}
function xHeading(t){
  return xPara(textRun(t, { bold:true, underline:true }), { before:200, after:140 });
}
// bulleted paragraph (• + tab + text) with hanging indent
function xBulletPara(text){
  return `<w:p><w:pPr>` +
         `<w:tabs><w:tab w:val="left" w:pos="720"/></w:tabs>` +
         `<w:spacing w:after="120"/>` +
         `<w:ind w:left="720" w:hanging="720"/>` +
         `</w:pPr>` +
         textRun("\u2022") +
         `<w:r>${rPr()}<w:tab/></w:r>` +
         textRun(text) +
         `</w:p>`;
}

function buildDocumentXml(){
  const h = jobHeader();
  const body = [];

  if (h.customer) body.push(xPara(textRun(h.customer, { bold:true, size:26 }), { after:40 }));
  if (h.address)  body.push(xPara(textRun(h.address), { after:40 }));
  const qd = [h.quote ? "Quote No. " + h.quote : "", h.date].filter(Boolean).join("    |    ");
  if (qd) body.push(xPara(textRun(qd, { color:"555555" }), { after:200 }));
  if (h.intro) body.push(xPara(textRun(h.intro), { after:200 }));

  const scope = scopeItems();
  body.push(xHeading("SCOPE OF WORK:"));
  scope.forEach((it,i) => {
    body.push(xListPara((i+1) + ".", it.text));
    it.subs.forEach((s,j) => body.push(xSubListPara(letterFor(j).toLowerCase() + ".", s)));
  });

  const notes = checkedItems("notes");
  if (notes.length){
    body.push(xHeading("NOTES:"));
    notes.forEach((t,i) => body.push(xListPara(letterFor(i) + ".", t)));
  }
  const inc = incexcItems("inc");
  if (inc.length){
    body.push(xHeading("INCLUDING:"));
    inc.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }
  const exc = incexcItems("exc");
  if (exc.length){
    body.push(xHeading("EXCLUDING:"));
    exc.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }

  const quals = checkedItems("quals");
  if (quals.length){
    body.push(xHeading("QUALIFICATIONS:"));
    quals.forEach((t,i) => body.push(xListPara((i+1) + ".", t)));
  }
  const resp = checkedItems("resp");
  if (resp.length){
    body.push(xHeading("Customer Responsibilities"));
    body.push(xPara(textRun("The customer is responsible for the following:"), { after:120 }));
    resp.forEach(t => body.push(xBulletPara(t)));
  }
  const billing = checkedItems("billing");
  if (billing.length){
    body.push(xHeading("Billing & Payment Terms"));
    billing.forEach(t => body.push(xBulletPara(t)));
  }

  const closing = checkedItems("closing");
  if (closing.length || h.signature){
    if (h.recipient) body.push(xPara(textRun(h.recipient + ","), { before:200, after:120 }));
    closing.forEach(t => body.push(xPara(textRun(t), { after:120 })));
    if (h.signature){
      const sig = h.signature.split("\n");
      sig.forEach((line, i) => body.push(xPara(textRun(line), { before: i === 0 ? 120 : 0, after:0 })));
    }
  }

  // US Letter, 0.75" margins
  const sectPr =
    `<w:sectPr><w:pgSz w:w="12240" w:h="15840"/>` +
    `<w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/>` +
    `</w:sectPr>`;

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">` +
    `<w:body>${body.join("")}${sectPr}</w:body></w:document>`;
}

const CONTENT_TYPES =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
  `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
  `<Default Extension="xml" ContentType="application/xml"/>` +
  `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>` +
  `</Types>`;

const ROOT_RELS =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
  `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>` +
  `</Relationships>`;

const DOC_RELS =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
  `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>`;

async function generateWordProposal(silent){
  const scope = scopeItems();
  if (!scope.length){ if(!silent) setStatus("Select at least one Scope of Work item."); return false; }
  if (typeof JSZip === "undefined"){
    if(!silent) setStatus("Document library failed to load — check internet connection and reload.");
    return false;
  }
  try {
    const zip = new JSZip();
    zip.file("[Content_Types].xml", CONTENT_TYPES);
    zip.folder("_rels").file(".rels", ROOT_RELS);
    const word = zip.folder("word");
    word.file("document.xml", buildDocumentXml());
    word.folder("_rels").file("document.xml.rels", DOC_RELS);

    const blob = await zip.generateAsync({
      type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    });
    const h = jobHeader();
    const name = (h.quote || h.customer || "FDEC_Proposal").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "FDEC_Proposal";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name + "_Proposal.docx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    if(!silent) setStatus("Word proposal downloaded.", true);
    return true;
  } catch (err){
    console.error(err);
    if(!silent) setStatus("Error generating document — see console.");
    return false;
  }
}
document.getElementById("btnWord").addEventListener("click", () => generateWordProposal(false));

/* ---------------- Plain-text copy (for pasting into ServiceTrade) ---------------- */
document.getElementById("btnCopy").addEventListener("click", async () => {
  const scope = scopeItems();

  const h = jobHeader();
  const L = [];

  L.push("SCOPE OF WORK:", "");

    L.push(`${i+1}. ${it.text}`);
    it.subs.forEach((s,j) => L.push(`     ${letterFor(j).toLowerCase()}. ${s}`));
  });
  const notes = checkedItems("notes");
  if (notes.length){
    L.push("", "NOTES:", "");
    notes.forEach((t,i) => L.push(`${letterFor(i)}. ${t}`));
  }
  const inc = incexcItems("inc");
  if (inc.length){
    L.push("", "INCLUDING:", "");
    inc.forEach((t,i) => L.push(`${i+1}. ${t}`));
  }
  const exc = incexcItems("exc");
  if (exc.length){
    L.push("", "EXCLUDING:", "");
    exc.forEach((t,i) => L.push(`${i+1}. ${t}`));
  }
  const quals = checkedItems("quals");
  if (quals.length){
    L.push("", "QUALIFICATIONS:", "");
    quals.forEach((t,i) => L.push(`${i+1}. ${t}`));
  }
  const resp = checkedItems("resp");
  if (resp.length){
    L.push("", "Customer Responsibilities", "", "The customer is responsible for the following:");
    resp.forEach(t => L.push(`- ${t}`));
  }
  const billing = checkedItems("billing");
  if (billing.length){
    L.push("", "Billing & Payment Terms", "");
    billing.forEach(t => L.push(`- ${t}`));
  }
  const closing = checkedItems("closing");
  if (closing.length || h.signature){
    L.push("");
    if (h.recipient) L.push(h.recipient + ",", "");
    closing.forEach(t => L.push(t, ""));
    if (h.signature) L.push(h.signature.replace(/\s+$/,""));
  }
  try {
    await navigator.clipboard.writeText(L.join("\n"));
    setStatus("Copied to clipboard — paste into ServiceTrade.", true);
  } catch {
    setStatus("Clipboard blocked by browser — use the Word download instead.");
  }
});

/* ---------------- Formatted HTML (for the combined PDF export) ---------------- */
/* Builds a clean, print-ready HTML document body from the same section data
   used by the Word/plain-text exports, so the proposal reads as a finished
   document (not the editor UI) inside the combined PDF. */
function buildProposalHTML(){
  const h = jobHeader();
  const P = [];
  const head = [];
  if (h.customer) head.push(`<div class="pp-cust">${esc(h.customer)}</div>`);
  const meta = [];
  if (h.quote) meta.push("Quote " + esc(h.quote));
  if (h.date)  meta.push(esc(h.date));
  if (meta.length) head.push(`<div class="pp-meta">${meta.join(" &nbsp;·&nbsp; ")}</div>`);
  if (head.length) P.push(`<div class="pp-head">${head.join("")}</div>`);

  if (h.intro) P.push(`<p class="pp-intro">${esc(h.intro)}</p>`);

  const scope = scopeItems();
  if (scope.length){
    P.push(`<h3 class="pp-h">SCOPE OF WORK</h3>`);
    let li = "";
    scope.forEach(it => {
      let subs = "";
      if (it.subs && it.subs.length){
        subs = "<ol class='pp-sub' type='a'>" + it.subs.map(s => `<li>${esc(s)}</li>`).join("") + "</ol>";
      }
      li += `<li>${esc(it.text)}${subs}</li>`;
    });
    P.push(`<ol class="pp-ol">${li}</ol>`);
  }
  const notes = checkedItems("notes");
  if (notes.length){
    P.push(`<h3 class="pp-h">NOTES</h3><ol class="pp-ol" type="A">` +
      notes.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const inc = incexcItems("inc");
  if (inc.length){
    P.push(`<h3 class="pp-h">INCLUDING</h3><ol class="pp-ol">` +
      inc.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const exc = incexcItems("exc");
  if (exc.length){
    P.push(`<h3 class="pp-h">EXCLUDING</h3><ol class="pp-ol">` +
      exc.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const quals = checkedItems("quals");
  if (quals.length){
    P.push(`<h3 class="pp-h">QUALIFICATIONS</h3><ol class="pp-ol">` +
      quals.map(t => `<li>${esc(t)}</li>`).join("") + `</ol>`);
  }
  const resp = checkedItems("resp");
  if (resp.length){
    P.push(`<h3 class="pp-h">Customer Responsibilities</h3>` +
      `<p class="pp-lead">The customer is responsible for the following:</p>` +
      `<ul class="pp-ul">` + resp.map(t => `<li>${esc(t)}</li>`).join("") + `</ul>`);
  }
  const billing = checkedItems("billing");
  if (billing.length){
    P.push(`<h3 class="pp-h">Billing &amp; Payment Terms</h3><ul class="pp-ul">` +
      billing.map(t => `<li>${esc(t)}</li>`).join("") + `</ul>`);
  }
  const closing = checkedItems("closing");
  if (closing.length || h.signature){
    let c = `<div class="pp-closing">`;
    closing.forEach(t => c += `<p>${esc(t)}</p>`);
    if (h.signature){
      c += `<p class="pp-sig">` + esc(h.signature).replace(/\n/g,"<br>") + `</p>`;
    }
    c += `</div>`;
    P.push(c);
  }
  return P.join("\n");
}

/* Shell requests: return formatted HTML, or trigger the Word download. */
window.addEventListener("message", function(e){
  const d = e && e.data;
  if (!d || d.fdec !== true) return;
  if (d.type === "get-proposal-html"){
    let html = "", err = null;
    try {
      if (!scopeItems().length) err = "no-scope";
      else html = buildProposalHTML();
    } catch(ex){ err = String(ex && ex.message || ex); }
    // reply to the shell
    if (window.parent && window.parent !== window){
      window.parent.postMessage({
        fdec:true, type:"proposal-html", reqId:d.reqId,
        html: html, css: PROPOSAL_PRINT_CSS, error: err
      }, "*");
    }
  } else if (d.type === "download-proposal-word"){
    generateWordProposal(true);
  }
});

/* ---------------- Save Draft (.html with embedded state) ---------------- */
function collectState(){
  return {
    meta: { app: "FDEC Proposal Builder", author: APP_META.author, version: APP_META.version, savedAt: new Date().toISOString() },
    job: {
      customer: document.getElementById("jobCustomer").value,
      quote:    document.getElementById("jobQuote").value,
      date:     document.getElementById("jobDate").value,
      intro:    document.getElementById("jobIntro").value,
      signature:document.getElementById("jobSignature").value
    },
    sections: JSON.parse(JSON.stringify({
      scope: state.scope, notes: state.notes, quals: state.quals,
      resp: state.resp, billing: state.billing, closing: state.closing, incexc: state.incexc
    }))
  };
}

/* Apply a saved draft slice (job fields + sections) to this page and
   re-render. Used by the suite-level Load Draft. */
function applySuiteDraft(saved){
  if (!saved) return;
  try {
    if (saved.job){
      document.getElementById("jobCustomer").value = saved.job.customer || "";
      document.getElementById("jobQuote").value    = saved.job.quote    || "";
      if (saved.job.date) document.getElementById("jobDate").value = saved.job.date;
      if (saved.job.intro != null) document.getElementById("jobIntro").value = saved.job.intro;
      if (saved.job.signature != null) document.getElementById("jobSignature").value = saved.job.signature;
    }
    if (saved.sections){
      for (const key of ["scope","notes","quals","resp","billing","closing","incexc"]){
        if (Array.isArray(saved.sections[key])) state[key] = mergeLibraryInto(key, saved.sections[key]);
      }
      state.scope.forEach(i => { if (!Array.isArray(i.subs)) i.subs = []; });
    }
    ["scope","notes","quals","resp","billing","closing","incexc"].forEach(render);
    relayoutTextareas();
    setStatus("Draft loaded.", true);
  } catch(e){ console.error("applySuiteDraft failed:", e); }
}

/* Suite draft messages: return this page's state, or apply an incoming one. */
window.addEventListener("message", function(e){
  var d = e && e.data;
  if (!d || d.fdec !== true) return;
  if (d.type === "get-draft"){
    var payload = null, gerr = null;
    try { payload = collectState(); } catch(ex){ gerr = String(ex && ex.message || ex); }
    if (window.parent && window.parent !== window){
      window.parent.postMessage({ fdec:true, type:"draft-data", page: SUITE_PAGE_ID, reqId:d.reqId, data:payload, error:gerr }, "*");
    }
  } else if (d.type === "load-draft" && d.page === SUITE_PAGE_ID){
    applySuiteDraft(d.data);
  }
});

var _btnSave = document.getElementById("btnSave");
if (_btnSave) _btnSave.addEventListener("click", () => {
  try {
    // JSON payload; escape "</" so it can't terminate the script tag
    const json = JSON.stringify(collectState()).replace(/<\//g, "<\\/");

    // Serialize a clone of the page so the live view is untouched
    const clone = document.documentElement.cloneNode(true);
    const oldState = clone.querySelector("#savedState");
    if (oldState) oldState.remove();
    // strip rendered list contents — they're rebuilt on load from the saved state
    clone.querySelectorAll("ul.items").forEach(ul => ul.innerHTML = "");
    const body = clone.querySelector("body");
    const stateScript = document.createElement("script");
    stateScript.type = "application/json";
    stateScript.id = "savedState";
    stateScript.textContent = json;
    body.insertBefore(stateScript, body.firstChild);

    const html = "<!DOCTYPE html>\n" + clone.outerHTML;
    const blob = new Blob([html], { type: "text/html" });

    const q = document.getElementById("jobQuote").value.trim();
    const c = document.getElementById("jobCustomer").value.trim();
    const base = (q || c || "FDEC_Proposal").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "FDEC_Proposal";
    const stamp = new Date().toISOString().slice(0,10);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = base + "_Draft_" + stamp + ".html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    setStatus("Draft saved — reopen the file to continue where you left off.", true);
  } catch (err){
    console.error(err);
    setStatus("Error saving draft — see console.");
  }
});

/* ============================================================
   CROSS-APP LINK — auto-fill the down payment note from the
   Quoting tab. The suite shell relays the quoting app's down
   payment total here via postMessage; we drop it into the
   "A down payment of $____ is required..." note automatically.
   ============================================================ */
(function(){
  // Matches the down payment note whether it still has the blank
  // underscores or a previously auto-filled dollar amount.
  const DP_RE = /(A down payment of\s+)(\$[\d,]+(?:\.\d{2})?|\$?_+)(\s+is required)/i;

  // Replace the amount inside any down payment line in the given state
  // array; returns true if at least one line changed.
  function applyTo(arr, display){
    let touched = false;
    (arr || []).forEach(item => {
      if (DP_RE.test(item.text)){
        // Function replacer avoids "$" in the amount being read as a
        // regex backreference (e.g. $1) inside the replacement string.
        const next = item.text.replace(DP_RE, (m, pre, amt, post) => pre + display + post);
        if (next !== item.text){ item.text = next; touched = true; }
      }
    });
    return touched;
  }

  function fillDownPayment(display){
    // Carry the amount into BOTH the Notes line and the
    // Billing & Payment Terms line so it only has to be entered once.
    if (applyTo(state.notes, display)) render("notes");
    if (applyTo(state.billing, display)) render("billing");
  }

  window.addEventListener("message", function(e){
    const d = e && e.data;
    if (!d || d.fdec !== true || d.type !== "downpayment") return;
    const display = d.display || ("$" + Number(d.value || 0).toFixed(2));
    fillDownPayment(display);
  });
})();

<script>
/* ============================================================

const APP_META = {

/* ============================================================

const LIBRARY = {

    { text: "Annual pre-action system inspection, testing, and maintenance", mode: "exc" },
    { text: "Annual antifreeze system inspection, testing, and maintenance", mode: "exc" },
    { text: "Inspection, exercise, and lubrication of pit valves", mode: "exc" },
    { text: "Annual private fire hydrant inspection and testing", mode: "exc" },
    { text: "Annual fire extinguisher maintenance", mode: "exc" },
    { text: "Annual emergency light testing", mode: "exc" },
    { text: "Fire extinguisher recharging, 6-year maintenance, and hydrotesting", mode: "exc" },
    { text: "NFPA 25 required weekly, monthly, quarterly, and semi-annual inspections and maintenance", mode: "exc" },
