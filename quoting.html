<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FDEC Suite">

<title>FDEC Quoting &amp; Proposal Suite 2026</title>
<style>
  :root{
    --navy:#010039; --red:#3281b9; --line:#cdd9e8; --page:#eaf1f8;
    --muted:#8fa8c9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--page);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
    height:100vh;
    height:100dvh;              /* dynamic viewport height — avoids iOS toolbar gap */
    -webkit-text-size-adjust:100%;
  }
  .suitebar{
    background:var(--navy); color:#fff; flex:none;
    border-bottom:4px solid var(--red);
    display:flex; align-items:stretch; gap:0;
    padding:0 14px;
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-top:env(safe-area-inset-top);
  }
  .suitebar .brand{
    display:flex; flex-direction:column; justify-content:center;
    padding:10px 18px 10px 8px; margin-right:auto;
  }
  .suitebar .brand b{font-size:15px; letter-spacing:.04em}
  .suitebar .brand span{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:2px}
  .suitebar nav{display:flex; align-items:stretch}
  .suitebar button{
    font:inherit; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    background:transparent; color:var(--muted); border:none; cursor:pointer;
    padding:0 22px; border-bottom:4px solid transparent; margin-bottom:-4px;
    transition:color .12s, border-color .12s;
  }
  .suitebar button:hover{color:#fff}
  .suitebar button.active{color:#fff; border-bottom-color:var(--red)}
  .suitebar button.export{
    align-self:center; margin:0 4px 0 18px; padding:8px 16px;
    border:1px solid #8fd2d9; border-bottom:1px solid #8fd2d9;
    border-radius:6px; background:#d6f0f3; color:#0d5b64;
    text-transform:none; letter-spacing:.02em; font-size:12.5px;
  }
  .suitebar button.export:hover{background:#c2e9ee; color:#0d5b64; border-color:#6fc4cd}
  .suitebar button.export:disabled{opacity:.6; cursor:default}
  .suitebar button.draft{
    align-self:center; margin:0 3px; padding:8px 14px;
    border:1px solid #26407a; border-radius:6px; background:#eef5fb; color:#12245c;
    text-transform:none; letter-spacing:.02em; font-size:12.5px;
  }
  .suitebar button.draft:hover{background:#d1e8fc; color:#010039; border-color:#3281b9}
  .autosave-note{
    align-self:center; margin-left:10px; font-size:11.5px; color:#9fb8d6;
    white-space:nowrap; transition:opacity .4s; font-style:italic;
  }
  .closewarn-toggle{
    align-self:center; margin-left:10px; display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:#c7d7ec; white-space:nowrap; cursor:pointer; user-select:none;
  }
  .closewarn-toggle input{width:15px; height:15px; accent-color:#3281b9; cursor:pointer; margin:0}
  @media(max-width:900px){ .closewarn-toggle span{display:none} }
  .restore-banner{
    flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:#fff7ed; border-bottom:1px solid #f0c088; color:#8a5a12;
    padding:9px 16px; font-size:13.5px;
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
  }
  .restore-banner .rb-actions{display:flex; gap:8px; flex:none}
  .restore-banner button{
    font:inherit; font-size:13px; font-weight:700; border-radius:6px; cursor:pointer;
    padding:7px 14px; min-height:38px; border:1px solid transparent;
  }
  .restore-banner .rb-restore{background:#c67b12; color:#fff}
  .restore-banner .rb-restore:hover{background:#a8650c}
  .restore-banner .rb-dismiss{background:#fff; border-color:#e2c79a; color:#8a5a12}
  .restore-banner .rb-dismiss:hover{background:#f6ecdd}
  @media(max-width:640px){
    .restore-banner{flex-wrap:wrap; gap:8px}
    .autosave-note{display:none}
  }
  .suitebar button.signout{
    align-self:center; margin:0 0 0 4px; padding:8px 14px;
    border:1px solid #26407a; border-radius:6px; background:#0a1a4a; color:#d1e8fc;
    text-transform:none; letter-spacing:.02em; font-size:12.5px;
  }
  .suitebar button.signout:hover{background:#12245c; color:#fff}

  /* ---------------- Export selection modal ---------------- */
  #exportModal{position:fixed; inset:0; z-index:1100; display:flex; align-items:center; justify-content:center; padding:20px}
  #exportModal[hidden]{display:none}
  .xm-backdrop{position:absolute; inset:0; background:rgba(15,22,30,.55)}
  .xm-card{position:relative; width:100%; max-width:430px; max-height:calc(100dvh - 40px); overflow-y:auto; -webkit-overflow-scrolling:touch; background:#fff; border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .xm-head{background:var(--navy); color:#fff; padding:18px 22px 14px; border-bottom:4px solid var(--red)}
  .xm-head b{display:block; font-size:15px; letter-spacing:.03em}
  .xm-head span{display:block; font-size:11.5px; color:#8fa8c9; margin-top:4px}
  .xm-body{padding:16px 22px 8px}
  .xm-row{display:flex; align-items:flex-start; gap:12px; padding:12px 0; font-size:15px; color:#20262d; cursor:pointer; border-bottom:1px solid #eef0f3}
  .xm-row:last-of-type{border-bottom:none}
  .xm-row input{width:22px; height:22px; margin-top:1px; accent-color:var(--red); flex:none; cursor:pointer}
  .xm-row em{color:#7c8896; font-style:normal; font-size:12px}
  .xm-note{font-size:11.5px; color:#7c8896; margin:10px 0 4px; line-height:1.4}
  .xm-foot{display:flex; justify-content:flex-end; gap:10px; padding:14px 22px 18px}
  .xm-foot button{font:inherit; font-size:15px; font-weight:700; border-radius:6px; padding:12px 18px; min-height:46px; cursor:pointer; border:1px solid var(--line)}
  .xm-cancel{background:#f4f6f8; color:#5b6572}
  .xm-cancel:hover{background:#e9edf1}
  .xm-go{background:var(--red); color:#fff; border-color:var(--red)}
  .xm-go:hover{background:#256a9c}
  .xm-go:disabled{opacity:.5; cursor:default}
  .views{flex:1; position:relative; min-height:0}
  .views iframe{
    position:absolute; inset:0; width:100%; height:100%;
    border:none; background:var(--page);
  }
  .views iframe[hidden]{display:none}

  /* Tablet & phone: let the bar wrap so nothing gets cut off. */
  @media(max-width:900px){
    .suitebar{flex-wrap:wrap; padding-top:calc(env(safe-area-inset-top) + 4px)}
    .suitebar .brand{width:100%; margin-right:0; padding:8px 4px 4px}
    .suitebar nav{
      width:100%; order:2;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      flex-wrap:nowrap; gap:2px;
      padding-bottom:6px;
      scrollbar-width:none;
    }
    .suitebar nav::-webkit-scrollbar{display:none}
    .suitebar button{
      flex:0 0 auto; white-space:nowrap;
      min-height:40px; padding:0 16px;
      margin-bottom:0; border-bottom-width:3px;
    }
    .suitebar button.export, .suitebar button.signout{
      align-self:auto; margin:0 2px; min-height:40px;
    }
  }
  @media(max-width:560px){
    .suitebar .brand b{font-size:13.5px}
    .suitebar .brand span{font-size:9.5px}
    .suitebar button{font-size:12px; padding:0 13px}
  }
  /* Bigger, easier-to-tap controls on touch devices. */
  @media (hover:none) and (pointer:coarse){
    .suitebar button{min-height:44px}
  }

</style>
</head>
<body>

<div class="suitebar">
  <div class="brand">
    <b>Fire Defense Equipment Company, Inc.</b>
    <span>Sprinkler Department &middot; Quoting &amp; Proposal Suite &middot; 2026</span>
  </div>
  <nav>
    <button id="tab-quote" class="active" type="button" onclick="showView('quote')">Quoting Template</button>
    <button id="tab-proposal" type="button" onclick="showView('proposal')">Repair Verbiage</button>
    <button id="tab-annual" type="button" onclick="showView('annual')">Annual Inspection</button>
    <button id="tab-install" type="button" onclick="showView('install')">New Install</button>
    <button id="btn-export" class="export" type="button" onclick="exportFullPackage()" title="Combined PDF of selected pages, plus the Word proposal">Export Full Package</button>
    <button id="btn-savedraft" class="draft" type="button" onclick="saveSuiteDraft()" title="Save all pages as one draft file">Save Draft</button>
    <button id="btn-loaddraft" class="draft" type="button" onclick="document.getElementById('suiteDraftFile').click()" title="Load a saved suite draft">Load Draft</button>
    <input type="file" id="suiteDraftFile" accept=".json,.fdecsuite,application/json" style="display:none" onchange="loadSuiteDraftFile(this)">
    <label id="closeWarnToggle" class="closewarn-toggle" title="Warn me before closing if there are unsaved changes">
      <input type="checkbox" id="closeWarnChk" checked onchange="_closeWarnEnabled = this.checked">
      <span>Warn before closing</span>
    </label>
    <span id="autosaveNote" class="autosave-note" style="opacity:0"></span>
  </nav>
</div>

<div id="restoreBanner" class="restore-banner" style="display:none">
  <span class="rb-text"></span>
  <span class="rb-actions">
    <button type="button" class="rb-restore">Restore</button>
    <button type="button" class="rb-dismiss">Dismiss</button>
  </span>
</div>

<div class="views">
  <iframe id="view-quote" title="FDEC Quoting Template"></iframe>
  <iframe id="view-proposal" title="FDEC Repair Verbiage" hidden></iframe>
  <iframe id="view-annual" title="FDEC Annual Inspection" hidden></iframe>
  <iframe id="view-install" title="FDEC New Install" hidden></iframe>
</div>

<div id="exportModal" hidden>
  <div class="xm-backdrop" onclick="closeExportModal()"></div>
  <div class="xm-card">
    <div class="xm-head">
      <b>Export Full Package</b>
      <span>Select the pages to include in the combined PDF.</span>
    </div>
    <div class="xm-body">
      <label class="xm-row"><input type="checkbox" id="xm-quote" checked> <span>Quoting Template <em>(Selected Materials &amp; Quote Summary)</em></span></label>
      <label class="xm-row"><input type="checkbox" id="xm-proposal" checked> <span>Repair Verbiage</span></label>
      <label class="xm-row"><input type="checkbox" id="xm-annual"> <span>Annual Inspection</span></label>
      <label class="xm-row"><input type="checkbox" id="xm-install"> <span>New Install</span></label>
      <div class="xm-note">Each selected verbiage page also downloads its own Word (.docx) file.</div>
    </div>
    <div class="xm-foot">
      <button type="button" class="xm-cancel" onclick="closeExportModal()">Cancel</button>
      <button type="button" class="xm-go" id="xm-go" onclick="runExport()">Export Selected</button>
    </div>
  </div>
</div>

<script type="text/html" id="src-quote"><!DOCTYPE html>
<!-- saved from url=(0061)file:///C:/Users/mitch/Downloads/FDEC_Quoting_Template_2.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>FDEC 2026 Quoting Template</title>
<style>
  :root{
    --ink:#20262d; --steel:#5b6572; --line:#cdd9e8; --card:#ffffff;
    --page:#eaf1f8; --red:#3281b9; --navy:#010039; --soft:#eef5fb;
    --good:#0190a0;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-variant-numeric:tabular-nums; padding-bottom:calc(84px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  header.top{
    background:var(--navy); color:#fff; padding:18px 22px;
    border-bottom:4px solid var(--red);
  }
  header.top h1{margin:0; font-size:19px; letter-spacing:.04em}
  header.top .sub{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#8fa8c9; margin-top:3px}
  header.top .topflex{display:flex; align-items:flex-end; gap:16px; max-width:1080px; margin:0 auto}
  header.top .credit{margin-left:auto; text-align:right; font-size:11px; letter-spacing:.08em; color:#8fa8c9; line-height:1.5; white-space:nowrap}
  .wrap{max-width:1080px; margin:0 auto; padding:18px 14px}
  .jobbar{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin-bottom:16px}
  .jobbar label{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--steel); margin-bottom:4px}
  .jobbar input{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:15px; background:var(--card)}
  details.card{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    margin-bottom:14px; overflow:hidden;
  }
  details.card>summary{
    list-style:none; cursor:pointer; padding:12px 16px; user-select:none;
    display:flex; align-items:baseline; gap:10px; border-left:4px solid var(--red);
    font-weight:700; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
  }
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary .sect-total{margin-left:auto; font-weight:700; color:var(--steel); font-size:14px; text-transform:none; letter-spacing:0}
  details.card[open]>summary{border-bottom:1px solid var(--line)}
  .body{padding:14px 16px}
  h3.sub{margin:14px 0 6px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--steel)}
  h3.sub:first-child{margin-top:0}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--steel); text-align:left; padding:6px 8px; border-bottom:1px solid var(--line)}
  td{padding:5px 8px; border-bottom:1px solid #edeff2}
  tr:last-child td{border-bottom:none}
  td.num, th.num{text-align:right; white-space:nowrap}
  input.qty, input.rate{
    width:82px; padding:9px 8px; border:1px solid var(--line); border-radius:5px;
    text-align:right; font-size:16px; font-variant-numeric:tabular-nums;
  }
  input.qty:focus, input.rate:focus, .jobbar input:focus, textarea:focus, select:focus, input.wide:focus{outline:2px solid var(--red); outline-offset:1px; border-color:var(--red)}
  input.wide{width:100%; padding:9px 8px; border:1px solid var(--line); border-radius:5px; font-size:16px}
  input.money{width:120px}
  .hint{font-size:12px; color:var(--steel); margin:6px 0 0}
  .copyright-notice{
    font-size:11px; color:var(--steel); text-align:center; font-style:italic;
    margin:26px auto 8px; padding-top:12px; border-top:1px solid var(--line); max-width:1100px;
  }
  .cols2{display:grid; grid-template-columns:1fr 1fr; gap:0 28px}
  @media(max-width:760px){
    .cols2{grid-template-columns:1fr}
    .jobbar{grid-template-columns:1fr}
    .wrap{padding:14px 10px}
    header.top{padding:16px 16px; padding-top:calc(16px + env(safe-area-inset-top))}
    /* Wide tables scroll horizontally inside their card instead of breaking
       the page. The table keeps a sensible min-width so columns stay legible. */
    .body{overflow-x:auto; -webkit-overflow-scrolling:touch}
    .body table{min-width:520px}
    details.card>summary{padding:14px 14px; min-height:48px; align-items:center}
    .body{padding:12px 12px}
  }
  @media(max-width:760px) and (hover:none){
    /* Bigger tap targets on touch devices */
    button{min-height:42px; padding:9px 14px}
    button.small{min-height:38px; padding:7px 12px}
    select.lvl{min-height:40px}
    .jobbar input{padding:11px 10px}
  }
  button{
    font:inherit; border:1px solid var(--line); background:var(--soft); color:var(--ink);
    border-radius:6px; padding:7px 14px; cursor:pointer;
  }
  button:hover{border-color:var(--steel)}
  button.primary{background:var(--red); border-color:var(--red); color:#fff; font-weight:600}
  button.small{padding:4px 10px; font-size:13px}
  button.apply-mp{
    font-weight:700;
    background:#d6f0f3;
    border-color:#8fd2d9;
    color:#0d5b64;
  }
  button.apply-mp:hover{ background:#c2e9ee; border-color:#6fc4cd; }
  textarea{
    width:100%; min-height:72px; padding:8px 10px; border:1px solid var(--line);
    border-radius:6px; font:inherit; resize:vertical;
  }
  select{padding:6px 8px; border:1px solid var(--line); border-radius:5px; font:inherit; background:#fff}
  .listrow{display:flex; gap:8px; margin-bottom:6px; align-items:center}
  .listrow input{flex:1}
  .listrow button{flex:none}
  /* summary table */
  #summaryTable td, #summaryTable th{padding:6px 8px}
  #summaryTable tr.grand td{border-top:2px solid var(--ink); font-weight:700; font-size:18px}
  #summaryTable tr.profit td{color:var(--good); border-top-width:1px}
  /* Alternating stripes on itemized line rows: white / light gray / light blue */
  #summaryTable tr.lineitem:nth-child(3n+1) td{background:#ffffff}
  #summaryTable tr.lineitem:nth-child(3n+2) td{background:#f3f4f6}
  #summaryTable tr.lineitem:nth-child(3n)   td{background:#d1e8fc}
  /* Customer Total column (3rd) bold across the whole table */
  #summaryTable td:nth-child(3),
  #summaryTable th:nth-child(3){font-weight:700}
  /* Sanity-check flags */
  .sanity-flags{display:flex; flex-direction:column; gap:6px; margin:6px 0 4px}
  .sanity-flag{
    display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.35;
    padding:8px 11px; border-radius:6px; border:1px solid;
  }
  .sanity-flag .ico{flex:none; font-weight:700; font-size:13px; line-height:1.35}
  .sanity-flag.warn{background:#fff7ed; border-color:#f0c088; color:#8a5a12}
  .sanity-flag.warn .ico{color:#c67b12}
  .sanity-flag.info{background:#eef5fb; border-color:#bcd6ef; color:#2a5578}
  .sanity-flag.info .ico{color:#3281b9}
  /* Manpower / Tasks summary table */
  #mpSummaryTable{margin-bottom:16px}
  #mpSummaryTable td, #mpSummaryTable th{padding:6px 8px}
  #mpSummaryTable tbody tr:nth-child(even) td{background:#f6f8fb}
  #mpSummaryTable tfoot tr.mp-sum-tot td{border-top:2px solid var(--ink); font-weight:700}
  .totbar{
    position:fixed; left:0; right:0; bottom:0; background:var(--navy); color:#fff;
    display:flex; gap:26px; align-items:center; padding:12px 22px; font-size:14px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    padding-left:max(22px, env(safe-area-inset-left));
    padding-right:max(22px, env(safe-area-inset-right));
    border-top:3px solid var(--red); z-index:50; flex-wrap:wrap;
  }
  .totbar .lab{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#8fa8c9; display:block}
  .totbar .val{font-size:18px; font-weight:700}
  .totbar .val.big{font-size:22px}
  .totbar .val.profit{color:#5fd48b}
  .totbar .grow{margin-left:auto; display:flex; gap:8px}
  .selected-list{columns:2; column-gap:28px; font-size:14px; padding-left:20px; margin:6px 0}
  .selected-list li{break-inside:avoid; margin-bottom:2px}
  @media(max-width:760px){.selected-list{columns:1}}
  .empty{color:var(--steel); font-style:italic; font-size:14px}
  .mkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px 12px}
  .mk-item{
    display:flex; align-items:center; gap:8px; font-size:14px;
    border:1px solid var(--line); border-radius:6px;
    padding:8px 10px; background:#fcfcfd;
  }
  .mk-item label{
    flex:1; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--steel); line-height:1.25; font-weight:600;
    border-right:1px solid var(--line); padding-right:8px; margin-right:2px;
  }
  .mk-item input{width:64px; text-align:right; flex:none; font-size:16px; padding:8px 6px}
  .ratetable{width:100%; max-width:100%; margin-bottom:4px}
  .ratetable input{width:100%; max-width:110px}
  .ratecols{gap:0 24px}
  h4.ratehd{margin:2px 0 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--red); font-weight:700}

  /* ---------------- Material catalog (collapsible) ---------------- */
  .mat-cat{border:1px solid var(--line); border-radius:7px; margin-bottom:10px; overflow:hidden; background:#fff}
  .mat-cat>.mat-cat-head{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    background:var(--navy); color:#fff; padding:10px 12px; font-weight:700; font-size:14px;
  }
  .mat-cat>.mat-cat-head .tw{transition:transform .15s; font-size:11px; width:12px; flex:none}
  .mat-cat.collapsed>.mat-cat-head .tw{transform:rotate(-90deg)}
  .mat-cat.collapsed>.mat-cat-body{display:none}
  .mat-cat-head input.cat-name{
    flex:1; font:inherit; font-weight:700; font-size:14px; color:#fff;
    background:transparent; border:1px solid transparent; border-radius:4px; padding:3px 6px;
  }
  .mat-cat-head input.cat-name:focus{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.4); outline:none}
  .mat-cat-head .cat-count{font-size:11px; font-weight:600; color:var(--muted, #9fb0c2); white-space:nowrap}
  .mat-cat-head .mat-del{background:none; border:none; color:#b9c4d4; cursor:pointer; font-size:18px; line-height:1; padding:2px 6px; flex:none}
  .mat-cat-head .mat-del:hover{color:#fff}
  .mat-cat-body{padding:8px 10px 10px}

  .mat-sub{border:1px solid #e7ebf0; border-radius:6px; margin:8px 0; overflow:hidden}
  .mat-sub>.mat-sub-head{
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    background:var(--soft); padding:8px 10px; font-weight:600; font-size:13px; color:var(--ink);
    border-left:3px solid var(--red);
  }
  .mat-sub>.mat-sub-head .tw{transition:transform .15s; font-size:10px; width:11px; flex:none; color:var(--steel)}
  .mat-sub.collapsed>.mat-sub-head .tw{transform:rotate(-90deg)}
  .mat-sub.collapsed>.mat-sub-body{display:none}
  .mat-sub-head input.sub-name{
    flex:1; font:inherit; font-weight:600; font-size:13px; color:var(--ink);
    background:transparent; border:1px solid transparent; border-radius:4px; padding:3px 6px;
  }
  .mat-sub-head input.sub-name:focus{background:#fff; border-color:var(--line); outline:none}
  .mat-sub-head .sub-count{font-size:11px; color:var(--steel); white-space:nowrap}
  .mat-sub-head .mat-del{background:none; border:none; color:#b9bec5; cursor:pointer; font-size:16px; line-height:1; padding:2px 6px; flex:none}
  .mat-sub-head .mat-del:hover{color:var(--red)}
  .mat-sub-body{padding:4px 8px 8px}
  .mat-sub-body table{width:100%}
  .mat-sub-body th{font-size:10px; padding:4px 6px}
  .mat-sub-body td{padding:3px 6px; border-bottom:1px solid #f0f2f5}
  .mat-item input.mi-name{width:100%; border:1px solid transparent; background:transparent; border-radius:4px; padding:6px; font-size:15px}
  .mat-item input.mi-name:hover{border-color:var(--line); background:#fff}
  .mat-item input.mi-name:focus{border-color:var(--red); background:#fff; outline:none}
  .mat-item.filled td{background:#eef7ef}
  .mat-item .mat-del{background:none; border:none; color:#c7ccd3; cursor:pointer; font-size:15px; line-height:1; padding:2px 6px}
  .mat-item .mat-del:hover{color:var(--red)}
  .mat-addbtn{
    font:inherit; font-size:12px; font-weight:600; margin:4px 4px 2px 0;
    padding:5px 11px; border-radius:5px; cursor:pointer;
    border:1px dashed var(--line); background:none; color:var(--steel);
  }
  .mat-addbtn:hover{border-color:var(--red); color:var(--red)}

  /* Structure lock: when the catalog is locked, hide the add/delete controls
     and stop the category/subcategory NAME fields from being edited. Item
     cost/qty inputs stay fully editable so quoting is unaffected. */
  #materialCatalog.structure-locked .mat-del,
  #materialCatalog.structure-locked .mat-addbtn{display:none !important}
  #materialCatalog.structure-locked input.cat-name,
  #materialCatalog.structure-locked input.sub-name{
    pointer-events:none; cursor:default;
  }
  /* Visual cue that structural editing is unlocked. */
  #materialCatalog:not(.structure-locked) input.cat-name{background:rgba(255,255,255,.10)}
  #materialCatalog:not(.structure-locked) input.sub-name{background:#fff; border-color:var(--line)}
  button#matEditToggle.editing{background:var(--red); color:#fff; border-color:var(--red)}

  /* ---- Two-pane catalog: category rail (left) + items (right) ---- */
  .mat-twopane{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff; min-height:280px}
  .mat-nav{
    width:210px; flex:none; background:var(--soft); border-right:1px solid var(--line);
    overflow-y:auto; max-height:560px;
  }
  .mat-nav .mn-item{
    display:flex; align-items:center; gap:8px; padding:11px 13px; cursor:pointer;
    font-size:13.5px; border-bottom:1px solid var(--line); color:var(--ink); user-select:none;
  }
  .mat-nav .mn-item:hover{background:var(--lightblue)}
  .mat-nav .mn-item.active{background:var(--navy); color:#fff; font-weight:600}
  .mat-nav .mn-name{flex:1; line-height:1.25}
  .mat-nav .mn-count{
    font-size:10.5px; font-weight:700; color:#fff; background:var(--good);
    border-radius:999px; padding:1px 7px; min-width:18px; text-align:center;
  }
  .mat-nav .mn-item:not(.active) .mn-count{background:#9fb3c6}
  .mat-nav .mn-item.active .mn-count{background:#0190a0}
  .mat-nav .mn-count.zero{display:none}
  .mat-pane{flex:1; min-width:0; overflow-x:auto; padding:10px 12px; max-height:560px; overflow-y:auto}

  /* In two-pane mode the category header/collapse is replaced by the rail:
     hide the per-category head bar, always show the body, and show only the
     active category. */
  .mat-twopane .mat-cat{border:none; border-radius:0; margin:0}
  .mat-twopane .mat-cat > .mat-cat-head{display:none}
  .mat-twopane .mat-cat > .mat-cat-body{display:block !important}
  .mat-twopane .mat-cat:not(.pane-active){display:none}
  /* Subcategories stay as labelled groups, always open, no collapse chrome. */
  .mat-twopane .mat-sub{border:none; margin:4px 0 12px}
  .mat-twopane .mat-sub > .mat-sub-head{background:transparent; border-left:3px solid var(--red); cursor:default; padding-left:9px}
  .mat-twopane .mat-sub > .mat-sub-head .tw{display:none}
  .mat-twopane .mat-sub > .mat-sub-body{display:block !important}
  /* When editing structure, reveal the category head inside the pane so names
     can be changed and categories deleted. */
  #materialCatalog:not(.structure-locked) .mat-cat.pane-active > .mat-cat-head{display:flex; background:var(--navy)}

  @media(max-width:640px){
    .mat-nav{width:150px}
  }

  /* ---- Quick Add search ---- */
  .quickadd{position:relative; margin-bottom:10px; max-width:560px}
  .qa-box{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:2px 10px}
  .qa-box:focus-within{border-color:var(--red); box-shadow:0 0 0 2px rgba(210,60,60,.12)}
  .qa-ico{font-size:14px; opacity:.55; flex:none}
  .qa-box input{flex:1; border:none; outline:none; font-size:16px; padding:10px 2px; background:transparent}
  .qa-clear{border:none; background:none; color:#9aa4af; font-size:20px; line-height:1; cursor:pointer; padding:2px 4px; flex:none}
  .qa-clear:hover{color:var(--red)}
  .qa-results{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:40;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    box-shadow:0 12px 30px rgba(0,0,0,.14); max-height:340px; overflow-y:auto; padding:4px;
  }
  .qa-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer;
  }
  .qa-item:hover, .qa-item.active{background:var(--soft)}
  .qa-item .qa-name{flex:1; font-size:14px; color:var(--ink)}
  .qa-item .qa-path{font-size:11px; color:var(--steel); display:block; margin-top:1px}
  .qa-item .qa-price{font-size:13px; color:var(--steel); font-variant-numeric:tabular-nums; white-space:nowrap}
  .qa-item .qa-inq{font-size:11px; color:#1a7a3c; font-weight:700; white-space:nowrap}
  .qa-empty{padding:12px 12px; font-size:13px; color:var(--steel)}
  .qa-empty b{color:var(--ink)}
  .qa-addnew{
    margin-top:4px; display:flex; align-items:center; gap:8px; padding:10px; border-top:1px solid var(--line);
    cursor:pointer; border-radius:6px; font-size:13px; color:var(--red); font-weight:600;
  }
  .qa-addnew:hover{background:#fdf0f0}
  /* brief highlight pulse when a row is quick-added */
  @keyframes qaPulse{0%{background:#fff6cc}100%{background:transparent}}
  .mat-item.qa-pulse td{animation:qaPulse 1.6s ease-out}
  @media(max-width:760px){
    .mat-sub-body table{min-width:0}
    .mat-cat-body, .mat-sub-body{overflow-x:auto}
  }
  select.lvl{padding:8px 6px; font-size:16px}
  .mp-note{font-size:13px; color:var(--steel)}
  /* print */
  @media print{
    body{background:#fff; padding-bottom:0; font-size:12px}
    header.top{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    .totbar, .noprint, button{display:none !important}
    details.card{break-inside:avoid; border:none; border-top:2px solid var(--ink); border-radius:0}
    details.card>summary{border-left:none; padding-left:0}
    .body{padding-left:0; padding-right:0}
    input, textarea, select{border:none !important; padding:0 !important}
    tr.print-hide{display:none}
  }
</style>

<script type="application/json" id="draftState"><\/script>
<header class="top">

<div class="wrap">

  <!-- MARKUPS -->
  <details class="card" id="sec-markups">

    <div class="body">

        <div>

          <table class="ratetable"><thead>
            <tr><th>Class</th><th class="num">Level 1</th><th class="num">Level 2</th><th class="num">Level 3</th></tr>
          </thead><tbody id="rateTable"></tbody></table>

          <h4 class="ratehd">Fire Alarm Technician</h4>
          <table class="ratetable"><thead>
            <tr><th>Class</th><th class="num">Level 1</th><th class="num">Level 2</th><th class="num">Level 3</th></tr>
          </thead><tbody id="rateTableFA"></tbody></table>
        </div>
      </div>
      <p class="hint" style="margin-bottom:14px">Labor lines default to Level 2 (book rates). The Level 3 rate is treated as our cost basis, so billing above Level 3 shows up as labor profit in Potential Profit. Sprinkler and Fire Alarm rates are independent — every rate is editable.</p>

        <div class="mk-item"><label>Downpayment</label><input class="qty mk" data-key="down" type="number" min="0" step="1" value="30">%</div>

  <!-- MANPOWER -->
  <details class="card" open="" id="sec-manpower">

        <tr><th style="width:30%">Task / Phase</th><th>Dept</th><th class="num">Technicians</th><th class="num">Hours Each</th><th>Rate Class</th><th class="num">Total Hours</th><th class="num">Trips</th><th class="noprint"></th></tr>

        <span class="mp-note">ST: <b id="mpST">0</b> hrs &nbsp;·&nbsp; OT: <b id="mpOT">0</b> hrs &nbsp;·&nbsp; DT: <b id="mpDT">0</b> hrs &nbsp;·&nbsp; Admin: <b id="mpAD">0</b> hrs &nbsp;·&nbsp; Total: <b id="mpTot">0</b> hrs</span>

            <tbody id="laborFA"></tbody></table>
          <p class="hint">Labor bills at cost — no markup applied. Shop hours roll into the sprinkler labor lines on the summary.</p>

            <tbody id="itmSP"></tbody></table>

        <div>

  <details class="card" id="sec-testing">
    <summary>Testing &amp; Subcontractor <span class="sect-total" data-sect="testing"></span></summary>
    <div class="body">
      <div class="cols2">
        <div>

          <table><thead><tr><th>Item</th><th class="num">Rate</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>

          <h3 class="sub">Subcontractor Quotes (+<span class="mklbl" data-mk="subq">15</span>%)</h3>

          <button class="small noprint" type="button" onclick="addMoneyRow(&#39;subQuotes&#39;,&#39;Subcontractor&#39;)">+ Add subcontractor</button>

      </div>

  const tb = $('eqFees'); tb.innerHTML = ''; _eqSeq = 0;

/* Render the whole catalog into #materialCatalog. Each item row has a
   name, unit-cost, qty, and line total. Only rows with qty>0 add to cost.
   Categories and subcategories are collapsible; all are editable and new
   ones can be added. */
function matEsc(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }

function buildMaterialCatalog(data){
  const host = $('materialCatalog');
  if (!host) return;
  host.innerHTML = '';
  (data || MATERIAL_CATALOG).forEach(cat => host.appendChild(renderMatCategory(cat)));
  // Re-apply the current lock state to the freshly-rendered name inputs.
  syncMatLock(!host.classList.contains('structure-locked'));
  buildMatNav();
}

/* Build the left-hand category rail for the two-pane layout, and show the
   first category. Called after any structural change (build, add, delete). */
let _matActiveCat = 0;
function buildMatNav(){
  const nav = $('matNav'); const host = $('materialCatalog');
  if (!nav || !host) return;
  const cats = [...host.querySelectorAll('.mat-cat')];
  nav.innerHTML = '';
  if (_matActiveCat >= cats.length) _matActiveCat = Math.max(0, cats.length - 1);
  cats.forEach((catEl, i) => {
    const name = (catEl.querySelector('.cat-name') || {}).value || 'Untitled';
    const filled = catEl.querySelectorAll('.mat-item.filled').length;
    const el = document.createElement('div');
    el.className = 'mn-item' + (i === _matActiveCat ? ' active' : '');
    el.innerHTML = `<span class="mn-name">${matEsc(name)}</span>` +
      `<span class="mn-count${filled ? '' : ' zero'}">${filled}</span>`;
    el.addEventListener('click', () => setActiveCat(i));
    nav.appendChild(el);
  });
  applyActiveCat();
}

function setActiveCat(i){
  _matActiveCat = i;
  const nav = $('matNav');
  [...nav.children].forEach((el, idx) => el.classList.toggle('active', idx === i));
  applyActiveCat();
}

function applyActiveCat(){
  const cats = [...$('materialCatalog').querySelectorAll('.mat-cat')];
  cats.forEach((c, idx) => c.classList.toggle('pane-active', idx === _matActiveCat));
  const pane = $('materialCatalog'); if (pane) pane.scrollTop = 0;
}

/* Refresh only the rail's selected-counts (called from recalc, cheap). */
function updateMatNavCounts(){
  const nav = $('matNav'); const host = $('materialCatalog');
  if (!nav || !host) return;
  const cats = [...host.querySelectorAll('.mat-cat')];
  [...nav.children].forEach((el, i) => {
    if (!cats[i]) return;
    const filled = cats[i].querySelectorAll('.mat-item.filled').length;
    const badge = el.querySelector('.mn-count');
    if (badge){ badge.textContent = filled; badge.classList.toggle('zero', !filled); }
  });
}

function renderMatCategory(cat){
  const wrap = document.createElement('div');
  // Categories start collapsed by default; only expanded when saved state
  // explicitly marks them open (cat._collapsed === false).
  const collapsed = (cat._collapsed !== false);
  wrap.className = 'mat-cat' + (collapsed ? ' collapsed' : '');
  const head = document.createElement('div');
  head.className = 'mat-cat-head';
  head.innerHTML =
    `<span class="tw">&#9660;</span>` +
    `<input class="cat-name" value="${matEsc(cat.name)}" placeholder="Category name">` +
    `<span class="cat-count"></span>` +
    `<button class="mat-del noprint" title="Remove category">&times;</button>`;
  // toggle collapse when clicking the head (but not the name input or delete)
  head.addEventListener('click', e => {
    if (e.target.closest('input') || e.target.closest('.mat-del')) return;
    wrap.classList.toggle('collapsed');
  });
  head.querySelector('.cat-name').addEventListener('input', e => { cat.name = e.target.value; buildMatNav(); });
  head.querySelector('.mat-del').addEventListener('click', () => {
    if (confirm('Remove this entire category and all its items?')){ wrap.remove(); buildMatNav(); recalc(); }
  });
  wrap.appendChild(head);

  const body = document.createElement('div');
  body.className = 'mat-cat-body';
  (cat.subs || []).forEach(sub => body.appendChild(renderMatSub(sub)));
  const addSub = document.createElement('button');
  addSub.className = 'mat-addbtn noprint';
  addSub.type = 'button';
  addSub.textContent = '+ Add subcategory';
  addSub.addEventListener('click', () => {
    const sub = { name:'', items:[] };
    const el = renderMatSub(sub);
    body.insertBefore(el, addSub);
    el.classList.remove('collapsed');
    const ni = el.querySelector('.sub-name'); if (ni) ni.focus();
    updateMatCounts();
  });
  body.appendChild(addSub);
  wrap.appendChild(body);
  return wrap;
}

function renderMatSub(sub){
  const wrap = document.createElement('div');
  // Subcategories start collapsed by default; only expanded when the saved
  // state explicitly marks them open (sub._collapsed === false).
  const collapsed = (sub._collapsed !== false);
  wrap.className = 'mat-sub' + (collapsed ? ' collapsed' : '');
  const head = document.createElement('div');
  head.className = 'mat-sub-head';
  head.innerHTML =
    `<span class="tw">&#9660;</span>` +
    `<input class="sub-name" value="${matEsc(sub.name)}" placeholder="Subcategory name">` +
    `<span class="sub-count"></span>` +
    `<button class="mat-del noprint" title="Remove subcategory">&times;</button>`;
  head.addEventListener('click', e => {
    if (e.target.closest('input') || e.target.closest('.mat-del')) return;
    wrap.classList.toggle('collapsed');
  });
  head.querySelector('.sub-name').addEventListener('input', e => { sub.name = e.target.value; });
  head.querySelector('.mat-del').addEventListener('click', () => {
    if (confirm('Remove this subcategory and all its items?')){ wrap.remove(); recalc(); }
  });
  wrap.appendChild(head);

  const body = document.createElement('div');
  body.className = 'mat-sub-body';
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>Item</th><th class="num">Unit Cost</th><th class="num">Qty</th><th class="num">Total</th><th></th></tr></thead>`;
  const tb = document.createElement('tbody');
  (sub.items || []).forEach(it => tb.appendChild(matItemRow(it)));

    const tr = matItemRow('');
    tb.appendChild(tr);
    const ni = tr.querySelector('.mi-name'); if (ni) ni.focus();
    updateMatCounts();

  body.appendChild(addItem);
  wrap.appendChild(body);

}

/* One material item row. `it` may be a string (name only) or an object
   {name, cost, qty}. */
function matItemRow(it){
  const o = (typeof it === 'string') ? { name: it } : (it || {});
  const tr = document.createElement('tr');
  tr.className = 'mat-item';
  tr.innerHTML =
    `<td><input class="mi-name" value="${matEsc(o.name)}" placeholder="Item"></td>` +

    `<td class="num"><input class="qty mi-qty" type="number" min="0" step="1" value="${o.qty!=null?o.qty:''}"></td>` +
    `<td class="num rowtot">$0.00</td>` +
    `<td class="num"><button class="mat-del noprint" title="Remove item">&times;</button></td>`;

/* ==================== QUICK ADD (search + add a line) ====================
   Type to search every item in the catalog; pick one to jump to it, set its
   quantity to 1, and expand its section so you can adjust. If nothing
   matches, offer to add the typed text as a new custom line. ============= */
var _qaActive = -1, _qaMatches = [];

/* Build a flat index of every catalog item row currently in the DOM, with
   its category / subcategory names for display and matching. */
function qaBuildIndex(){
  var out = [];
  document.querySelectorAll('#materialCatalog .mat-cat').forEach(function(catEl){
    var catName = (catEl.querySelector('.cat-name') || {}).value || '';
    catEl.querySelectorAll(':scope > .mat-cat-body > .mat-sub').forEach(function(subEl){
      var subName = (subEl.querySelector('.sub-name') || {}).value || '';
      subEl.querySelectorAll('.mat-item').forEach(function(tr){
        var name = (tr.querySelector('.mi-name') || {}).value || '';
        if (!name.trim()) return;
        out.push({ name:name, cat:catName, sub:subName, row:tr,
                   cost:(tr.querySelector('.mi-cost')||{}).value || '',
                   hay:(name + ' ' + catName + ' ' + subName).toLowerCase() });
      });
    });
  });
  return out;
}

function qaSearchInput(){
  var q = ($('qaSearch').value || '').trim();
  $('qaClear').style.display = q ? '' : 'none';
  var box = $('qaResults');
  if (!q){ box.style.display = 'none'; box.innerHTML = ''; _qaMatches = []; _qaActive = -1; return; }

  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  var index = qaBuildIndex();
  // An item matches if every search term appears somewhere in its name/path.
  var matches = index.filter(function(it){ return terms.every(function(t){ return it.hay.indexOf(t) !== -1; }); });
  // Rank: name-starts-with first, then name-contains, then path matches.
  var ql = q.toLowerCase();
  matches.sort(function(a, b){
    var an = a.name.toLowerCase(), bn = b.name.toLowerCase();
    var as = an.indexOf(ql) === 0 ? 0 : an.indexOf(ql) !== -1 ? 1 : 2;
    var bs = bn.indexOf(ql) === 0 ? 0 : bn.indexOf(ql) !== -1 ? 1 : 2;
    return as - bs || an.localeCompare(bn);
  });
  _qaMatches = matches.slice(0, 30);
  _qaActive = _qaMatches.length ? 0 : -1;
  qaRenderResults(q);
}

function qaRenderResults(q){
  var box = $('qaResults');
  box.innerHTML = '';
  _qaMatches.forEach(function(it, i){
    var filled = num(it.row.querySelector('.mi-qty')) > 0;
    var div = document.createElement('div');
    div.className = 'qa-item' + (i === _qaActive ? ' active' : '');
    var path = [it.cat, it.sub].filter(Boolean).join(' \u203a ');
    div.innerHTML =
      '<span class="qa-name">' + qaEsc(it.name) +
        (path ? '<span class="qa-path">' + qaEsc(path) + '</span>' : '') + '</span>' +
      (filled ? '<span class="qa-inq">in quote</span>' :
        (it.cost ? '<span class="qa-price">' + money(parseFloat(it.cost)) + '</span>' : ''));
    div.addEventListener('mousedown', function(e){ e.preventDefault(); qaSelect(i); });
    box.appendChild(div);
  });
  // "Add as new item" fallback.
  var addNew = document.createElement('div');
  addNew.className = 'qa-addnew';
  addNew.innerHTML = '<span>+</span><span>Add \u201C' + qaEsc(q) + '\u201D as a new item</span>';
  addNew.addEventListener('mousedown', function(e){ e.preventDefault(); qaAddNew(q); });
  if (!_qaMatches.length){
    var empty = document.createElement('div');
    empty.className = 'qa-empty';
    empty.innerHTML = 'No catalog match for <b>' + qaEsc(q) + '</b>.';
    box.appendChild(empty);
  }
  box.appendChild(addNew);
  box.style.display = '';
}

function qaEsc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* Activate a matched catalog row: expand its section, bump qty to at least 1,
   scroll to it, focus the qty, and clear the search. */
function qaSelect(i){
  var it = _qaMatches[i];
  if (!it || !it.row) return;
  var tr = it.row;
  // Expand the containing subcategory and category (accordion mode).
  var sub = tr.closest('.mat-sub'); if (sub) sub.classList.remove('collapsed');
  var cat = tr.closest('.mat-cat'); if (cat) cat.classList.remove('collapsed');
  // Two-pane mode: switch the rail to the item's category so it's visible.
  qaActivatePaneFor(tr);
  // Ensure a quantity so it counts toward the quote.
  var qtyEl = tr.querySelector('.mi-qty');
  if (qtyEl && !(num(qtyEl) > 0)) qtyEl.value = '1';
  recalc();
  qaClearSearch();
  // Scroll into view + highlight.
  tr.classList.remove('qa-pulse'); void tr.offsetWidth; tr.classList.add('qa-pulse');
  qaScrollTo(tr);
  // Return to the search bar, ready for the next item.
  var sb = $('qaSearch'); if (sb) sb.focus();
}

/* Switch the two-pane rail to whichever category contains this row. */
function qaActivatePaneFor(tr){
  var cat = tr.closest('.mat-cat'); if (!cat) return;
  var cats = [...$('materialCatalog').querySelectorAll('.mat-cat')];
  var idx = cats.indexOf(cat);
  if (idx >= 0) setActiveCat(idx);
}

/* Scroll a row into view, tolerating environments without scrollIntoView. */
function qaScrollTo(el){
  if (!el || typeof el.scrollIntoView !== 'function') return;
  try { el.scrollIntoView({ behavior:'smooth', block:'center' }); }
  catch(_){ try { el.scrollIntoView(); } catch(__){} }
}

/* Add the typed text as a brand-new line under a "Quick Add" category so it
   flows into the quote just like any other item. */
function qaAddNew(name){
  name = (name || '').trim();
  if (!name) return;
  var host = $('materialCatalog');
  // Find or create a "Quick Add" category.
  var target = null;
  host.querySelectorAll('.mat-cat').forEach(function(catEl){
    if (((catEl.querySelector('.cat-name') || {}).value || '').trim().toLowerCase() === 'quick add') target = catEl;
  });
  if (!target){
    target = renderMatCategory({ name:'Quick Add', subs:[{ name:'', items:[] }] });
    host.appendChild(target);
    buildMatNav();
  }
  target.classList.remove('collapsed');
  var sub = target.querySelector('.mat-sub');
  if (sub) sub.classList.remove('collapsed');
  var tbody = sub ? sub.querySelector('tbody') : null;
  if (!tbody) return;
  var tr = matItemRow({ name:name, qty:'1' });
  tbody.appendChild(tr);
  qaActivatePaneFor(tr);
  recalc();
  qaClearSearch();
  tr.classList.add('qa-pulse');
  qaScrollTo(tr);
  // Return to the search bar, ready for the next item.
  var sb = $('qaSearch'); if (sb) sb.focus();
}

function qaClearSearch(){
  $('qaSearch').value = '';
  $('qaClear').style.display = 'none';
  var box = $('qaResults'); box.style.display = 'none'; box.innerHTML = '';
  _qaMatches = []; _qaActive = -1;
}

/* Keyboard nav: up/down to move, Enter to pick, Esc to close. */
function qaKeydown(e){
  var box = $('qaResults');
  if (box.style.display === 'none') return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); _qaActive = Math.min(_qaActive + 1, _qaMatches.length - 1); qaHighlight(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); _qaActive = Math.max(_qaActive - 1, 0); qaHighlight(); }
  else if (e.key === 'Enter'){
    e.preventDefault();
    if (_qaActive >= 0 && _qaMatches[_qaActive]) qaSelect(_qaActive);
    else qaAddNew($('qaSearch').value);
  }
  else if (e.key === 'Escape'){ qaClearSearch(); }
}
function qaHighlight(){
  var items = $('qaResults').querySelectorAll('.qa-item');
  items.forEach(function(el, i){ el.classList.toggle('active', i === _qaActive); });
  if (items[_qaActive]) items[_qaActive].scrollIntoView({ block:'nearest' });
}
/* Close the results when clicking away. */
document.addEventListener('mousedown', function(e){
  var qa = $('quickAdd');
  if (qa && !qa.contains(e.target)){ var box = $('qaResults'); if (box) box.style.display = 'none'; }
});

/* Lock/unlock editing of category & subcategory structure (names, add,
   delete). Item cost/qty always stay editable. A single button flips it. */
function toggleMatEdit(){
  const host = $('materialCatalog');
  if (!host) return;
  const nowEditing = host.classList.toggle('structure-locked') === false;
  syncMatLock(nowEditing);
}

/* Apply the current lock state to controls that need a real attribute
   (readOnly on the name fields, the show/hide of the top "+ Add category"
   button, and the toggle button's label). CSS handles the rest. */
function syncMatLock(editing){
  const host = $('materialCatalog');
  if (!host) return;
  // If called without an explicit value, derive from the current class.
  if (editing === undefined) editing = !host.classList.contains('structure-locked');
  host.querySelectorAll('input.cat-name, input.sub-name').forEach(inp => { inp.readOnly = !editing; });
  const addCat = $('matAddCatBtn'); if (addCat) addCat.style.display = editing ? '' : 'none';
  const btn = $('matEditToggle');
  if (btn){
    btn.textContent = editing ? 'Done editing' : 'Edit categories';
    btn.classList.toggle('editing', editing);
  }
  const hint = $('matEditHint');
  if (hint) hint.textContent = editing
    ? 'Editing on — rename, add, or remove categories, subcategories, and items.'
    : 'Editing categories is locked. Item costs and quantities are always editable.';
}

/* Sum all catalog item rows into the material cost; also refresh per-row
   totals and the category/subcategory counts. Returns the total cost. */
function sumMaterialCatalog(){
  let total = 0;
  document.querySelectorAll('#materialCatalog .mat-item').forEach(tr => {
    const cost = num(tr.querySelector('.mi-cost'));
    const qty  = num(tr.querySelector('.mi-qty'));
    const line = cost * qty;
    tr.querySelector('.rowtot').textContent = money(line);
    tr.classList.toggle('filled', line > 0);
    total += line;
  });
  updateMatCounts();
  updateMatNavCounts();
  return total;
}

function updateMatCounts(){
  document.querySelectorAll('#materialCatalog .mat-sub').forEach(sub => {
    const rows = sub.querySelectorAll('.mat-item');
    const active = sub.querySelectorAll('.mat-item.filled').length;
    const c = sub.querySelector('.sub-count');
    if (c) c.textContent = active ? `${active} selected · ${rows.length}` : `${rows.length}`;
  });
  document.querySelectorAll('#materialCatalog .mat-cat').forEach(cat => {
    const rows = cat.querySelectorAll('.mat-item');
    const active = cat.querySelectorAll('.mat-item.filled').length;
    const c = cat.querySelector('.cat-count');
    if (c) c.textContent = active ? `${active} selected · ${rows.length} items` : `${rows.length} items`;
  });
}

/* Collect the catalog state (structure + values) for drafts. */
function collectMaterialCatalog(){
  const out = [];
  document.querySelectorAll('#materialCatalog .mat-cat').forEach(catEl => {
    const cat = { name: (catEl.querySelector('.cat-name')||{}).value || '', collapsed: catEl.classList.contains('collapsed'), subs: [] };
    catEl.querySelectorAll(':scope > .mat-cat-body > .mat-sub').forEach(subEl => {
      const sub = { name: (subEl.querySelector('.sub-name')||{}).value || '', collapsed: subEl.classList.contains('collapsed'), items: [] };
      subEl.querySelectorAll('.mat-item').forEach(tr => {
        sub.items.push({
          name: (tr.querySelector('.mi-name')||{}).value || '',
          cost: (tr.querySelector('.mi-cost')||{}).value || '',
          qty:  (tr.querySelector('.mi-qty')||{}).value || ''
        });
      });
      cat.subs.push(sub);
    });
    out.push(cat);
  });
  return out;
}

/* Rebuild the catalog from saved draft state. */
function applyMaterialCatalog(saved){
  if (!Array.isArray(saved) || !saved.length){ buildMaterialCatalog(); return; }
  const data = saved.map(c => ({
    name: c.name, _collapsed: !!c.collapsed,
    subs: (c.subs||[]).map(s => ({
      name: s.name, _collapsed: !!s.collapsed,
      items: (s.items||[]).map(i => ({ name:i.name, cost:i.cost, qty:i.qty }))
    }))
  }));
  buildMaterialCatalog(data);
}

/* Scroll lock: while the pointer is inside a scrolling material window
   (the category rail or the item pane), the mouse wheel scrolls only that
   window. The page behind it does not scroll — not even when the pane has
   reached its top or bottom. */
function setupMatScrollLock(){
  ['matNav', 'materialCatalog'].forEach(function(id){
    var el = document.getElementById(id);
    if (!el || el._scrollLock) return;
    el._scrollLock = true;
    el.addEventListener('wheel', function(e){
      // Only lock when the pane actually has something to scroll.
      if (el.scrollHeight <= el.clientHeight) return;
      var atTop = el.scrollTop <= 0;
      var atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
      var up = e.deltaY < 0;
      var down = e.deltaY > 0;
      // At an edge and pushing further that way: keep the page from scrolling.
      if ((atTop && up) || (atBottom && down)){
        e.preventDefault();
      }
      // Within bounds: let the pane scroll but stop it reaching the page.
      e.stopPropagation();
    }, { passive: false });
  });
}
