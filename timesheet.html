<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekly Employee Time Sheet</title>
<style>
:root{--navy:#142b46;--blue:#1d5f91;--pale:#eef4f8;--line:#d6dee7;--ink:#202b36;--muted:#667586;--gold:#f2b544;--edit:#b4532a;--edit-bg:#fff3ec}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f2f5f8;color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif}
header{background:transparent;padding:0;border:0;line-height:0}
header img.banner{display:block;width:100%;height:auto;max-width:1200px;margin:0 auto}
main{max-width:1200px;margin:22px auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #172b3c0a}
h2{font-size:18px;margin:0 0 6px;color:var(--navy)}
.panel .sub{font-size:13px;color:var(--muted);margin:0 0 15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}
label{display:block;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#526273;margin-bottom:6px}
label .req{color:#b3261e}
input,select,textarea{font:inherit;color:inherit;width:100%;border:1px solid #c8d2dc;border-radius:7px;padding:12px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9fc8e6;border-color:var(--blue)}
input.invalid,select.invalid{border-color:#e0918b;background:#fff6f5}
.req-note{font-size:12px;color:var(--muted);margin:2px 0 0}

/* Banner for mode / status */
.modebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.modebar .who{font-size:13px;opacity:.92}
.modebar .who b{opacity:1}
.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:4px 10px;border-radius:999px;background:#23507e}
.pill.tech{background:#23507e}.pill.manager{background:#7a4a12}.pill.admin{background:#5b2d82}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:4px 10px;border-radius:999px;margin-left:6px}
.badge.draft{background:#eef0f3;color:#55616f}.badge.submitted{background:#fff2d6;color:#7a5600}.badge.reviewed{background:#e3f4e9;color:#1f6b3a}

/* Hours allocation cards */
.rows{display:flex;flex-direction:column;gap:14px}
.rowcard{border:1px solid #e0e7ee;border-radius:10px;padding:14px;background:#fafcfe;position:relative}
/* A letter anywhere in the job number highlights the entire job card. */
.rowcard.job-number-alpha{background:#F7C58D;border-color:#D58229}
.rowcard .rowgrid{display:grid;grid-template-columns:1.1fr 1.3fr 1fr .9fr;gap:12px}
.rowcard .hrsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.rowcard .notesrow{margin-top:12px}
.rowcard .rowfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.rowcard .rowtotal{font-size:15px;font-weight:700;color:var(--navy)}
.rowcard .rowtotal b{font-size:19px}
.ratehint{font-size:12px;font-weight:700;padding:5px 9px;border-radius:7px;background:#eef4f8;color:var(--blue)}
.ratehint.ot{background:#fff8e8;color:#8a6400}
.ratehint.dt{background:#fdeceb;color:#9a3b33}
input.autofield{background:#eef1f4;color:#5a6472;cursor:not-allowed}
.ibx-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ibx-years{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.ibx-year{border:1px solid #d8dee6;background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:#33415a;cursor:pointer}
.ibx-year.active{background:var(--navy,#010039);color:#fff;border-color:var(--navy,#010039)}
.ibx-year .n{display:inline-block;margin-left:6px;background:rgba(0,0,0,.12);border-radius:8px;padding:0 7px;font-size:11px}
.ibx-year.active .n{background:rgba(255,255,255,.25)}
.ibx-group{margin:16px 0 8px;font-size:12px;font-weight:800;letter-spacing:.5px;color:#55617a;text-transform:uppercase}
.ibx-item{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #e2e7ee;border-radius:10px;padding:11px 14px;margin-bottom:8px;background:#fff;cursor:pointer;text-decoration:none;color:inherit}
.ibx-item:hover{border-color:var(--navy,#3281b9);background:#f6f9fc}
.ibx-item .lbl{font-weight:650;font-size:14px}
.ibx-item .meta{font-size:12px;color:#66707f;white-space:nowrap}
.ibx-empty{padding:20px;text-align:center;color:#777;font-size:13px}
.remove{border:1px solid #f0c4c0;background:#fff0ef;color:#a3312a;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer}

.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{border:0;border-radius:7px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:white;font-size:15px}
button.secondary{background:#e8eef3;color:var(--navy)}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.danger{background:#fff0ef;color:#a3312a;border:1px solid #f0c4c0}
button.go{background:#1f7a46}
button:disabled{opacity:.5;cursor:not-allowed}
button:hover{filter:brightness(.97)}
.addrow{width:100%;background:#eef4f8;color:var(--navy);border:1px dashed #9fc0d8}

.summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}
.metric{padding:15px;border-radius:9px;background:#f1f5f8;border:1px solid #e0e7ee}
.metric span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:bold}
.metric strong{font-size:25px;color:var(--navy);display:block;margin-top:4px}
.small{font-size:12px;color:var(--muted)}

.status{padding:12px 14px;border-radius:8px;margin-top:12px;border:1px solid var(--line);background:#f7f9fb;font-size:14px}
.status.ok{background:#edf8f0;border-color:#b9dfc3;color:#205d32}
.status.warn{background:#fff7e7;border-color:#e8cf91;color:#765300}
.status.error{background:#fff0ef;border-color:#e8b4b0;color:#8b2924}
.status.info{background:#eef4fb;border-color:#bcd3ea;color:#234e74}
.hide{display:none!important}

/* Manager review: compact 10pt-equivalent typography and tighter boxes. */
#managerView .panel{padding:12px;margin-bottom:10px;border-radius:7px}
#managerView h2{font-size:14px;margin-bottom:4px}
#managerView .sub,#managerView .small{font-size:10pt;margin-bottom:6px}
#managerView .grid{gap:7px}
#managerView label{font-size:9pt;margin-bottom:2px}
#managerView .grid input{font-size:10pt;padding:6px}
#managerView .btns{margin-top:9px;gap:7px}
#managerView .btns button{font-size:10pt;padding:8px 10px}
#managerView .summary{gap:6px}
#managerView .metric{padding:7px;border-radius:5px}
#managerView .metric span{font-size:9pt}
#managerView .metric strong{font-size:14pt;margin-top:1px}
#managerView .expense-attached{padding:8px;margin:7px 0}
#managerView .expense-scroll{margin:6px 0}
#managerView .expense-table{font-size:10pt}
#managerView .expense-table th,#managerView .expense-table td{padding:4px}
#managerView .expense-totals{padding:7px;gap:7px;margin:6px 0;font-size:10pt}
/* Manager review table */
.table-wrap{overflow-x:auto}
table.review{width:100%;border-collapse:collapse;min-width:720px}
table.review th,table.review td{padding:4px 5px;border-bottom:1px solid #e4e9ef;text-align:left;vertical-align:middle;font-size:10pt}
table.review th{background:#f1f5f8;color:#445568;font-size:9pt;text-transform:uppercase;letter-spacing:.35px;position:sticky;top:0}
table.review td.num,table.review th.num{text-align:right;font-variant-numeric:tabular-nums}
table.review input,table.review select{padding:4px 3px;font-size:10pt;border-radius:4px}
table.review input.num{text-align:right}
/* Keep flagged and standard manager-review rows at identical dimensions. */
table.review tbody tr.job-number-alpha > td{background:#F7C58D;box-shadow:inset 0 1px #D58229,inset 0 -1px #D58229}
table.review tbody tr.job-number-alpha > td:first-child{box-shadow:inset 2px 0 #D58229,inset 0 1px #D58229,inset 0 -1px #D58229}
table.review tbody tr.job-number-alpha > td:last-child{box-shadow:inset -2px 0 #D58229,inset 0 1px #D58229,inset 0 -1px #D58229}
@media print{table.review tbody tr.job-number-alpha > td{background:#F7C58D!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
td.rowtot{font-weight:700;color:var(--navy)}
.edited{background:#fff1f2!important;outline:3px solid #c40018!important;outline-offset:-2px;border-radius:4px}
/* Manager changes: outline the actual editable control, without altering row dimensions. */
#managerView .edited > input,#managerView .edited > select,#managerView .edited > textarea{outline:3px solid #c40018!important;outline-offset:-2px;background:#fff1f2!important;border-color:#c40018!important}
@media print{#managerView .edited{outline:3px solid #c40018!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#managerView .edited > input,#managerView .edited > select,#managerView .edited > textarea{outline:3px solid #c40018!important;outline-offset:-2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.edit-flag{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--edit);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.editlog{margin:10px 0 0;padding:12px 14px;border-left:3px solid var(--edit);background:var(--edit-bg);border-radius:0 8px 8px 0;font-size:13px}
.editlog b{color:var(--edit)}
.editlog ul{margin:6px 0 0;padding-left:18px}
