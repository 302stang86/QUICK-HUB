<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Service Records — Manager Dashboard</title>
<meta name="fdec-page-title" content="Fleet Service Records">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A4A">
<link rel="stylesheet" href="fdec-bg.css">
<style>
  :root{font-family:Segoe UI,Arial,sans-serif;color:#1c2c3f}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;background:transparent;color:#1c2c3f}
  main{max-width:1150px;margin:16px auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  .panel{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 5px 22px rgba(10,18,32,.22)}
  h1{font-size:22px;margin:0;color:#192e50}
  h2{font-size:15px;color:#192e50;margin:0 0 8px}
  button,select,input,textarea{font:inherit}
  button{border-radius:7px;border:1px solid #c7d4e1;background:#fff;padding:9px 13px;cursor:pointer;color:#152947}
  button.primary{background:#1b3158;color:#fff;border-color:#1b3158}
  button.warn{background:#fff;color:#8a5a00;border-color:#b4690e}
  button:disabled{opacity:.5;cursor:wait}
  select,input,textarea{padding:9px;border:1px solid #aebfd0;border-radius:7px;background:#fff;color:#111;width:100%}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toolbar select{max-width:220px}
  .tabs{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .tabs button{font-weight:700}
  .tabs button.active{background:#1b3158;color:#fff;border-color:#1b3158}
  .item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid #e1e7ee;padding:12px 0}
  .item .acts{display:flex;gap:8px;flex-wrap:wrap}
  .muted{color:#607084;font-size:13px}
  .pill{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;background:#fff3df;color:#8a5a00;border:1px solid #e4b55e}
  #detail[hidden],#list[hidden],#archivedPanel[hidden]{display:none!important}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .field{padding:6px 9px;border:1px solid #e2e7ef;border-radius:6px;background:#fafbfc}
  .field span{display:block;color:#627286;font-size:11px;line-height:1.3}
  .field b{font-size:14px;overflow-wrap:anywhere}
  pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #e2e7ef;padding:8px 10px;border-radius:6px;background:#fafbfc;margin:4px 0;font-size:13px}
  .status{font-weight:700;color:#235b43}
  #notice,#archivedNotice{min-height:18px}
  a{color:#234e8a}
  @media print{header,.toolbar,.no-print,.tabs,#list,#archivedPanel,button{display:none!important}main{margin:0;padding:0}.panel{box-shadow:none}#detail{display:block!important}}
</style>
<script src="fdec-identity.js"></script>
<script type="module" src="fdec-auth.js" data-page="fleet"></script>
<script src="fdec-header.js?v=88-industrial" defer></script>
<script src="fleet-vehicles.js"></script>
</head>
<body>
<div class="bg-layer" aria-hidden="true"></div>
<main>
  <section class="panel no-print">
    <div class="toolbar" style="justify-content:space-between">
      <div><h1>Fleet Service Records</h1><div class="muted">Manager and Administrator Dashboard</div></div>
      <a href="index.html">&larr; Back to Hub</a>
    </div>
  </section>

  <div class="tabs no-print" id="tabs">
    <button type="button" class="active" data-tab="list">Active records</button>
    <button type="button" data-tab="archived">Archived records</button>
  </div>

  <section class="panel" id="list">
    <div class="toolbar">
      <select id="filter">
        <option value="all">All statuses</option>
        <option value="new">New</option>
        <option value="in-review">In Review</option>
        <option value="scheduled">Scheduled</option>
        <option value="completed">Completed</option>
      </select>
      <button id="reload">Refresh</button>
      <span id="count" class="muted"></span>
    </div>
    <p id="notice" role="status" class="muted">Loading records&hellip;</p>
    <div id="items"></div>
  </section>

  <section class="panel" id="archivedPanel" hidden>
    <h2>Archived records</h2>
    <div class="muted" style="margin-bottom:8px">Archived records are kept for 30 days, then permanently deleted. Restore one to return it to the active list.</div>
    <p id="archivedNotice" role="status" class="muted"></p>
    <div id="archivedItems"></div>
  </section>

  <section class="panel" id="detail" hidden>
    <div class="toolbar no-print" style="justify-content:space-between">
      <button id="back">&larr; Back</button>
      <div class="acts">
        <button id="archiveBtn" class="warn">Archive record</button>
        <button id="restoreBtn" class="primary" hidden>Restore record</button>
        <button onclick="window.print()">Print / Save PDF</button>
      </div>
    </div>
    <h2>Fleet Service Report <span id="ref" class="muted"></span> <span id="archivedTag" class="pill" hidden>Archived</span></h2>
    <div id="meta" class="fields"></div>
    <h2 style="margin-top:14px">Service information</h2>
    <div id="body"></div>
    <div class="panel no-print" id="managerControls">
      <label><strong>Status</strong>
        <select id="newStatus">
          <option value="new">New</option>
          <option value="in-review">In Review</option>
          <option value="scheduled">Scheduled</option>
          <option value="completed">Completed</option>
        </select>
      </label>
      <label style="display:block;margin-top:12px"><strong>Management notes</strong>
        <textarea rows="4" id="managerNotes" placeholder="Internal notes for managers and administrators"></textarea>
      </label>
      <button class="primary" id="save">Save Update</button>
      <p id="saveNotice" role="status"></p>
    </div>
  </section>
</main>

<script type="module">
import {getApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,getDocs,doc,updateDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const auth=await window.FDECAuth.ready;
const allowed=auth.user&&(auth.isAdmin||(auth.profile?.status==='approved'&&['admin','manager'].includes(auth.profile?.role)));
if(!allowed){$('notice').textContent='Access restricted to approved managers and administrators.'; $('reload').disabled=true; throw new Error('Manager/admin only');}
const db=getFirestore(getApp('fdec'));
const DAY=86400000, KEEP_DAYS=30;
const techOf=r=>window.FDEC_ID?FDEC_ID.nameFor(r.uid,r.technicianName,r.technicianEmail):(r.technicianName||'');
let requests=[], chosen=null;

const field=(name,val)=>'<div class="field"><span>'+esc(name)+'</span><b>'+esc(val||'—')+'</b></div>';
const archSeconds=r=>(r.archivedAt&&(r.archivedAt.seconds||r.archivedAt._seconds))||0;
const daysLeft=r=>{const s=archSeconds(r); if(!s) return KEEP_DAYS; return Math.max(0, KEEP_DAYS-Math.floor((Date.now()-s*1000)/DAY));};

/* Tabs */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(!b) return;
  const t=b.getAttribute('data-tab');
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  $('detail').hidden=true;
  $('list').hidden=(t!=='list'); $('archivedPanel').hidden=(t!=='archived');
});

function itemRow(r,archived){
  const el=document.createElement('div'); el.className='item';
  const left=document.createElement('div');
  left.innerHTML='<strong>'+esc(r.vehicleNumber||r.vehicleName||'Vehicle')+'</strong> <span class="status">'+esc(r.status||'new')+'</span>'+
    (archived?(' <span class="pill">Deletes in '+daysLeft(r)+' day'+(daysLeft(r)===1?'':'s')+'</span>'):'')+
    '<div class="muted">'+esc(techOf(r))+' &middot; '+esc(r.submittedAt?.toDate?.()?.toLocaleString?.()||'Recent')+'</div>';
  const acts=document.createElement('div'); acts.className='acts';
  const review=document.createElement('button'); review.textContent='Review'; review.onclick=()=>openRecord(r); acts.appendChild(review);
  if(archived){ const res=document.createElement('button'); res.className='primary'; res.textContent='Restore'; res.onclick=()=>restoreRecord(r); acts.appendChild(res); }
  el.append(left,acts); return el;
}

function refreshList(){
  const records=requests.filter(r=>!r.archived).filter(r=>$('filter').value==='all'||r.status===$('filter').value);
  $('count').textContent=records.length+' record(s)';
  $('items').innerHTML='';
  records.forEach(r=>$('items').appendChild(itemRow(r,false)));
  if(!records.length) $('items').textContent='No records match this filter.';
}
function refreshArchived(){
  const arch=requests.filter(r=>r.archived).sort((a,b)=>archSeconds(b)-archSeconds(a));
  $('archivedItems').innerHTML='';
  $('archivedNotice').textContent=arch.length?(arch.length+' archived record(s).'):'No archived records.';
  arch.forEach(r=>$('archivedItems').appendChild(itemRow(r,true)));
}

async function purgeExpired(){
  const expired=requests.filter(r=>r.archived && archSeconds(r) && (Date.now()-archSeconds(r)*1000)>KEEP_DAYS*DAY);
  for(const r of expired){
    try{ await deleteDoc(doc(db,'fleetServiceReports',r.id)); r._deleted=true; }catch(e){ /* best-effort; requires delete permission */ }
  }
  if(expired.some(r=>r._deleted)) requests=requests.filter(r=>!r._deleted);
}

async function load(){
  $('notice').textContent='Loading…';
  try{
    const res=await getDocs(collection(db,'fleetServiceReports'));
    await FDEC_ID.ensureRoster(async()=>{ const us=await getDocs(collection(db,'users')); return us.docs.map(d=>({uid:d.id,...d.data()})); });
    requests=res.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0));
    await purgeExpired();
    $('notice').textContent='';
    refreshList(); refreshArchived();
  }catch(e){ $('notice').textContent='Cannot load records: '+e.message; }
}

function openRecord(r){
  chosen=r;
  $('list').hidden=true; $('archivedPanel').hidden=true; $('detail').hidden=false;
  $('ref').textContent='FS-'+r.id.slice(0,8).toUpperCase();
  $('archivedTag').hidden=!r.archived;
  $('archiveBtn').hidden=!!r.archived;
  $('restoreBtn').hidden=!r.archived;
  let d=r.details||{};
  $('meta').innerHTML=field('Submitted by',techOf(r))+field('Assigned to',r.recipientName)+field('Vehicle',r.vehicleName)+field('Vehicle Number',r.vehicleNumber)+field('License Plate',d.plate)+field('Service Date',d.date)+field('Status',r.status);
  const isOther=d.vehicleType==='other';
  const info=(isOther?field('Vehicle Make',d.otherMake)+field('Vehicle Model',d.otherModel)+field('Model Year',d.otherYear):'')+field('Drop-off',d.dropOff)+(d.dropOff==='yes'?field('Drop-off days',d.dropOffDays):'')+field('Spare needed',d.spareVehicle)+field('Transport needed',d.transportNeeded);
  $('body').innerHTML='<div class="fields">'+info+'</div>'+
    '<h2 style="margin-top:14px">Service checklist</h2><p style="margin:4px 0">'+esc((d.checklist||[]).join(', ')||'None selected')+'</p>'+
    '<h2 style="margin-top:14px">Marked areas</h2><div id="areas"></div>'+
    (isOther?('<h2 style="margin-top:14px">Other vehicle issues</h2><pre>'+esc(d.otherIssue||'None')+'</pre>'):'')+
    '<h2 style="margin-top:14px">Inspection notes</h2><pre>'+esc(d.notes||'None')+'</pre>'+
    '<h2 style="margin-top:14px">Management notes</h2><pre>'+esc(r.managementNotes||'None')+'</pre>';
  const areas=$('areas'); const vt=d.vehicleType, img=(window.FLEET_VEHICLE_IMG||{})[vt];
  if(img&&(d.points||[]).length){
    const st=document.createElement('div');
    st.style.cssText='position:relative;display:inline-block;max-width:420px;width:100%;border:1px solid #e2e7ef;border-radius:8px;overflow:hidden;background:#fff;margin-bottom:12px';
    st.innerHTML='<img src="'+img+'" style="display:block;width:100%;height:auto" alt="Vehicle with marked areas">'+(d.points||[]).map(pt=>'<span style="position:absolute;left:'+pt.x+'%;top:'+pt.y+'%;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;border-radius:12px;background:#c8102e;color:#fff;font:700 12px/22px Arial;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.5);border:2px solid #fff;box-sizing:border-box">'+esc(pt.n)+'</span>').join('');
    areas.appendChild(st);
  }
  for(const pt of (d.points||[])){const div=document.createElement('div');div.className='field';div.textContent='Area '+pt.n+' (x '+pt.x+'%, y '+pt.y+'%): '+(pt.note||'No description');areas.appendChild(div);}
  if(!(d.points||[]).length) areas.textContent='No marked areas.';
  $('newStatus').value=r.status||'new'; $('managerNotes').value=r.managementNotes||'';
  window.scrollTo(0,0);
}

async function archiveRecord(){
  if(!chosen) return;
  if(!confirm('Archive this record?\n\nArchived records are automatically and permanently DELETED after 30 days. You can restore it from the Archived records tab before then.')) return;
  const btn=$('archiveBtn'); btn.disabled=true;
  try{
    await updateDoc(doc(db,'fleetServiceReports',chosen.id),{archived:true, archivedAt:serverTimestamp(), archivedBy:auth.user.uid});
    Object.assign(chosen,{archived:true, archivedAt:{seconds:Math.floor(Date.now()/1000)}, archivedBy:auth.user.uid});
    $('detail').hidden=true; $('list').hidden=false; $('archivedPanel').hidden=true;
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.getAttribute('data-tab')==='list'));
    refreshList(); refreshArchived();
  }catch(e){ alert('Could not archive: '+e.message); }
  finally{ btn.disabled=false; }
}
async function restoreRecord(r){
  const rec=r||chosen; if(!rec) return;
  try{
    await updateDoc(doc(db,'fleetServiceReports',rec.id),{archived:false, archivedAt:null});
    Object.assign(rec,{archived:false, archivedAt:null});
    if(chosen===rec){ $('detail').hidden=true; }
    $('archivedPanel').hidden=false; $('list').hidden=true;
    refreshList(); refreshArchived();
  }catch(e){ alert('Could not restore: '+e.message); }
}

$('back').onclick=()=>{ $('detail').hidden=true; const onArch=document.querySelector('#tabs button.active')?.getAttribute('data-tab')==='archived'; $('list').hidden=onArch; $('archivedPanel').hidden=!onArch; };
$('reload').onclick=load;
$('filter').onchange=refreshList;
$('archiveBtn').onclick=archiveRecord;
$('restoreBtn').onclick=()=>restoreRecord();
$('save').onclick=async()=>{
  if(!chosen) return; const btn=$('save'); btn.disabled=true; $('saveNotice').textContent='Saving…';
  try{
    const update={status:$('newStatus').value, managementNotes:$('managerNotes').value.trim().slice(0,5000), updatedAt:serverTimestamp(), updatedBy:auth.user.uid};
    await updateDoc(doc(db,'fleetServiceReports',chosen.id),update);
    Object.assign(chosen,update); $('saveNotice').textContent='Saved successfully.'; openRecord(chosen);
  }catch(e){ $('saveNotice').textContent='Not saved: '+e.message; }
  finally{ btn.disabled=false; }
};
load();
</script>
</body>
</html>
