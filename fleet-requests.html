<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet Service — Manager Dashboard</title><meta name="fdec-page-title" content="Fleet Service Requests"><link rel="icon" href="icon-192.png"><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#1c2c3f}*{box-sizing:border-box}body{margin:0;background:#e8eef3}main{max-width:1150px;margin:20px auto;padding:0 16px}.panel{background:white;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #13243b12}h1{font-size:25px;margin:0;color:#192e50}h2{font-size:18px;color:#192e50;margin:0 0 12px}button,select,input,textarea{font:inherit}button{border-radius:7px;border:1px solid #c7d4e1;background:#fff;padding:9px 13px;cursor:pointer;color:#152947}button.primary{background:#1b3158;color:#fff;border-color:#1b3158}button:disabled{opacity:.5;cursor:wait}select,input,textarea{padding:9px;border:1px solid #aebfd0;border-radius:7px;background:#fff;color:#111;width:100%}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar select{max-width:220px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid #e1e7ee;padding:14px 0}.muted{color:#607084;font-size:13px}#detail[hidden],#list[hidden]{display:none!important}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field{padding:10px;border:1px solid #e2e7ef;border-radius:7px;background:#fafbfc}.field span{display:block;color:#627286;font-size:12px}.field b{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #e2e7ef;padding:12px;border-radius:7px;background:#fafbfc}.status{font-weight:700;color:#235b43}#notice{min-height:18px}a{color:#234e8a}@media print{header,.toolbar,.no-print,#list,button{display:none!important}main{margin:0;padding:0}.panel{box-shadow:none}#detail{display:block!important}}
</style><script type="module" src="fdec-auth.js" data-page="fleet"></script><script src="fdec-header.js" defer></script></head><body><main><section class="panel no-print"><div class="toolbar" style="justify-content:space-between"><div><h1>Fleet Service Requests</h1><div class="muted">Manager and Administrator Dashboard</div></div><a href="index.html">← Back to Hub</a></div></section><section class="panel" id="list"><div class="toolbar"><select id="filter"><option value="all">All statuses</option><option value="new">New</option><option value="in-review">In Review</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select><button id="reload">Refresh requests</button><span id="count" class="muted"></span></div><p id="notice" role="status" class="muted">Loading requests…</p><div id="items"></div></section><section class="panel" id="detail" hidden><div class="toolbar no-print" style="justify-content:space-between"><button id="back">← Back to requests</button><button onclick="window.print()">Print / Save PDF</button></div><h2>Fleet Service Report <span id="ref" class="muted"></span></h2><div id="meta" class="fields"></div><h2 style="margin-top:18px">Service information</h2><div id="body"></div><div class="panel no-print" id="managerControls"><label><strong>Status</strong><select id="newStatus"><option value="new">New</option><option value="in-review">In Review</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select></label><label style="display:block;margin-top:12px"><strong>Management notes</strong><textarea rows="4" id="managerNotes" placeholder="Internal notes for managers and administrators"></textarea></label><button class="primary" id="save">Save Update</button><p id="saveNotice" role="status"></p></div></section></main><script type="module">
import {getApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,getDocs,doc,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const auth=await window.FDECAuth.ready;
const allowed=auth.user&&(auth.isAdmin||(auth.profile?.status==='approved'&&['admin','manager'].includes(auth.profile?.role)));
if(!allowed){$('notice').textContent='Access restricted to approved managers and administrators.'; $('reload').disabled=true;throw new Error('Manager/admin only');}
const db=getFirestore(getApp('fdec'));
let requests=[],chosen=null;
const field=(name,val)=>'<div class="field"><span>'+esc(name)+'</span><b>'+esc(val||'—')+'</b></div>';
function refreshList(){let records=requests.filter(r=>$('filter').value==='all'||r.status===$('filter').value);$('count').textContent=records.length+' request(s)';$('items').innerHTML='';for(const r of records){let el=document.createElement('div');el.className='item';let left=document.createElement('div');left.innerHTML='<strong>'+esc(r.vehicleNumber||r.vehicleName||'Vehicle')+'</strong> <span class="status">'+esc(r.status||'new')+'</span><div class="muted">'+esc(r.technicianName)+' · Assigned: '+esc(r.recipientName)+' · '+esc(r.submittedAt?.toDate?.()?.toLocaleString?.()||'Recent')+'</div>';let btn=document.createElement('button');btn.textContent='Review';btn.onclick=()=>openRecord(r);el.append(left,btn);$('items').appendChild(el);}if(!records.length)$('items').textContent='No requests match this filter.';}
async function load(){ $('notice').textContent='Loading…'; try{const res=await getDocs(collection(db,'fleetServiceReports'));requests=res.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.submittedAt?.seconds||0)-(a.submittedAt?.seconds||0));$('notice').textContent='';refreshList();}catch(e){$('notice').textContent='Cannot load requests: '+e.message;}}
function openRecord(r){chosen=r;$('list').hidden=true;$('detail').hidden=false;$('ref').textContent='FS-'+r.id.slice(0,8).toUpperCase();let d=r.details||{};$('meta').innerHTML=field('Submitted by',r.technicianName)+field('Assigned to',r.recipientName)+field('Vehicle',r.vehicleName)+field('Vehicle Number',r.vehicleNumber)+field('License Plate',d.plate)+field('Service Date',d.date)+field('Status',r.status);$('body').innerHTML='<div class="fields">'+field('Vehicle Make',d.otherMake)+field('Vehicle Model',d.otherModel)+field('Model Year',d.otherYear)+field('Drop-off',d.dropOff)+field('Drop-off days',d.dropOffDays)+field('Spare needed',d.spareVehicle)+field('Transport needed',d.transportNeeded)+'</div><h2 style="margin-top:18px">Service checklist</h2><p>'+esc((d.checklist||[]).join(', ')||'None selected')+'</p><h2>Marked areas</h2><div id="areas"></div><h2>Other vehicle issues</h2><pre>'+esc(d.otherIssue||'None')+'</pre><h2>Inspection notes</h2><pre>'+esc(d.notes||'None')+'</pre><h2>Management notes</h2><pre>'+esc(r.managementNotes||'None')+'</pre>';
const areas=$('areas'); for(const pt of (d.points||[])){const div=document.createElement('div');div.className='field';div.textContent='Area '+pt.n+' (x '+pt.x+'%, y '+pt.y+'%): '+(pt.note||'No description');areas.appendChild(div);}if(!(d.points||[]).length)areas.textContent='No marked areas.';
$('newStatus').value=r.status||'new';$('managerNotes').value=r.managementNotes||'';window.scrollTo(0,0);}
$('back').onclick=()=>{$('detail').hidden=true;$('list').hidden=false;};$('reload').onclick=load;$('filter').onchange=refreshList;
$('save').onclick=async()=>{if(!chosen)return;const btn=$('save');btn.disabled=true;$('saveNotice').textContent='Saving…';try{const update={status:$('newStatus').value,managementNotes:$('managerNotes').value.trim().slice(0,5000),updatedAt:serverTimestamp(),updatedBy:auth.user.uid};await updateDoc(doc(db,'fleetServiceReports',chosen.id),update);Object.assign(chosen,update);$('saveNotice').textContent='Saved successfully.';openRecord(chosen);}catch(e){$('saveNotice').textContent='Not saved: '+e.message;}finally{btn.disabled=false;}};
load();
</script></body></html>
