<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDEC Fire Dispatch Directory</title>
<style>
  :root {
    --navy: #1B2A4A;
    --red: #C1121C;
    --red-hover: #9d0e16;
    --bg: #eef1f4;
    --text: #1b1f24;
    --border: #dfe3e8;
    --tint: #eef1f4;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #141720 url("fdec-collage-bg-vintage.jpg") center/cover no-repeat fixed; color: var(--text); margin: 0; padding: 0; line-height: 1.4;
  }
  .masthead {
    background: var(--navy); border-bottom: 5px solid var(--red);
    color: #fff; padding: 16px 20px;
  }
  .masthead .company { font-size: 1.05rem; font-weight: 700; letter-spacing: .04em; margin: 0; }
  .masthead .doctype { font-size: .85rem; color: #aeb6bf; margin: 3px 0 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 14px 60px; background: rgba(238,241,244,.84); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .toolbar {
    position: sticky; top: 0; z-index: 10; background: rgba(238,241,244,.95); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    padding: 12px 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  #search {
    flex: 1; min-width: 180px; padding: 11px 13px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff; color: #0f172a;
  }
  #search:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(27,42,74,.14); }
  .count { font-size: 11px; color: #64707f; white-space: nowrap; }

  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--navy);
    border-radius: 8px; padding: 10px 12px; box-shadow: 0 1px 4px rgba(27,42,74,.06);
    display: flex; flex-direction: column; gap: 3px;
  }
  .card.edited { border-left-color: var(--red); }
  .card .city { font-weight: 600; color: var(--navy); font-size: 13px; }
  .card .dispatch a { color: var(--red); font-weight: 600; text-decoration: none; font-size: 13px; white-space: nowrap; }
  .card .dispatch a:hover { text-decoration: underline; }
  .card .dispatch .plain { font-size: 13px; color: var(--text); }
  .card .notes { color: #55606e; font-size: 11px; }
  .card .notes:empty { display: none; }
  .card-actions { margin-top: 4px; }
  .edit-btn {
    background: none; border: none; color: #8a94a3; font-size: 11px; cursor: pointer;
    padding: 2px 0; text-decoration: underline;
  }
  .edit-btn:hover { color: var(--navy); }
  .edited-tag { font-size: 10px; color: var(--red); margin-left: 6px; }

  /* edit mode */
  .card.editing { border-left-color: var(--red); background: var(--tint); }
  .edit-row { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .edit-row label { font-size: 10px; color: #64707f; text-transform: uppercase; letter-spacing: .04em; }
  .edit-row input, .edit-row textarea {
    width: 100%; padding: 7px 9px; font-size: 13px; border: 1px solid var(--border);
    border-radius: 6px; color: #0f172a; font-family: inherit;
  }
  .edit-row textarea { min-height: 48px; resize: vertical; }
  .edit-row input:focus, .edit-row textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 2px rgba(27,42,74,.12); }
  .edit-controls { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btn { font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; padding: 7px 12px; border: 1px solid transparent; }
  .btn-save { background: var(--red); color: #fff; }
  .btn-save:hover { background: var(--red-hover); }
  .btn-cancel { background: #fff; color: var(--navy); border-color: var(--navy); }
  .btn-cancel:hover { background: #eef1f4; }
  .btn-reset { background: #fff; color: #8a94a3; border-color: var(--border); margin-left: auto; }
  .btn-reset:hover { color: var(--red); border-color: var(--red); }

  .no-results { text-align: center; color: #8a94a3; padding: 40px 0; font-size: .95rem; display: none; grid-column: 1 / -1; }
  mark { background: #ffe9a8; color: inherit; padding: 0 1px; border-radius: 2px; }
  .foot { text-align: center; color: #8a94a3; font-size: 11px; margin-top: 18px; line-height: 1.5; }

  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
    .wrap { padding: 10px 10px 48px; }
  }
  @media print {
    .toolbar, .edit-btn, .card-actions { display: none; }
    .masthead { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    body { background: #fff; }
  }
</style>
</head>

  var STORE_KEY = "fdec_dispatch_edits_v1";
  var grid = document.getElementById("grid");
  var search = document.getElementById("search");
  var countEl = document.getElementById("count");
  var noResults = document.getElementById("noResults");
  var editingKey = null;

  // key each record by city (unique in source)
  DATA.forEach(function (r, i) { r._k = r.city + "|" + i; });

  function loadEdits() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveEdits(obj) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); return true; }
    catch (e) { return false; }
  }
  var edits = loadEdits();

  function effective(r) {
    var e = edits[r._k] || {};
    return {
      dispatch: e.dispatch != null ? e.dispatch : r.dispatch,
      notes: e.notes != null ? e.notes : r.notes,
      isEdited: e.dispatch != null || e.notes != null
    };
  }
  function telHref(s) {
    var digits = (s.match(/\d/g) || []).join("");
    return digits.length >= 10 ? "tel:" + digits : null;
  }
  function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function highlight(text, q) {
    text = text || "";
    if (!q) return esc(text);
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
  }
  function dispatchHtml(s, q) {
    if (!s) return '<span class="plain">&mdash;</span>';
    var href = telHref(s), inner = highlight(s, q);
    return href ? '<a href="' + href + '">' + inner + "</a>" : '<span class="plain">' + inner + "</span>";
  }

  function cardHtml(r, q) {
    var ef = effective(r);
    if (editingKey === r._k) {
      return '<div class="card editing" data-k="' + esc(r._k) + '">' +
        '<div class="city">' + esc(r.city) + '</div>' +
        '<div class="edit-row"><label>Dispatch Number</label>' +
          '<input type="text" class="ed-dispatch" value="' + esc(ef.dispatch) + '"></div>' +
        '<div class="edit-row"><label>Note</label>' +
          '<textarea class="ed-notes">' + esc(ef.notes) + '</textarea></div>' +
        '<div class="edit-controls">' +
          '<button class="btn btn-save" data-act="save">Save</button>' +
          '<button class="btn btn-cancel" data-act="cancel">Cancel</button>' +
          (ef.isEdited ? '<button class="btn btn-reset" data-act="reset">Reset</button>' : '') +
        '</div></div>';
    }
    return '<div class="card' + (ef.isEdited ? ' edited' : '') + '" data-k="' + esc(r._k) + '">' +
      '<div class="city">' + highlight(r.city, q) + (ef.isEdited ? '<span class="edited-tag">edited</span>' : '') + '</div>' +
      '<div class="dispatch">' + dispatchHtml(ef.dispatch, q) + '</div>' +
      '<div class="notes">' + highlight(ef.notes, q) + '</div>' +
      '<div class="card-actions"><button class="edit-btn" data-act="edit">Edit</button></div>' +
      '</div>';
  }

  function render(q) {
    q = (q || "").trim();
    var ql = q.toLowerCase();
    var rows = DATA.filter(function (r) {
      if (!ql) return true;
      var ef = effective(r);
      return r.city.toLowerCase().indexOf(ql) >= 0 ||
             (ef.dispatch || "").toLowerCase().indexOf(ql) >= 0 ||
             (ef.notes || "").toLowerCase().indexOf(ql) >= 0;
    });
    grid.innerHTML = rows.map(function (r) { return cardHtml(r, q); }).join("") ||
      '<div class="no-results" style="display:block">No matching city or dispatch number.</div>';
    countEl.textContent = rows.length + " of " + DATA.length + " listed";
  }

  grid.addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-act]");
    if (!btn) return;
    var card = ev.target.closest(".card");
    var k = card && card.getAttribute("data-k");
    var act = btn.getAttribute("data-act");
    if (act === "edit") { editingKey = k; render(search.value); }
    else if (act === "cancel") { editingKey = null; render(search.value); }
    else if (act === "save") {
      var disp = card.querySelector(".ed-dispatch").value.trim();
      var note = card.querySelector(".ed-notes").value.trim();
      var orig = DATA.find(function (r) { return r._k === k; });
      var e = {};
      if (disp !== orig.dispatch) e.dispatch = disp;
      if (note !== orig.notes) e.notes = note;
      if (Object.keys(e).length) edits[k] = e; else delete edits[k];
      if (!saveEdits(edits)) alert("Could not save to this browser's storage.");
      editingKey = null; render(search.value);
    }
    else if (act === "reset") {
      delete edits[k]; saveEdits(edits); editingKey = null; render(search.value);
    }
  });

  search.addEventListener("input", function () {
    if (editingKey !== null) editingKey = null;
    render(search.value);
  });
  render("");
})();
