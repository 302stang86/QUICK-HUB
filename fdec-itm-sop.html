<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDEC ITM Field SOP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky navy masthead + search + form tabs over a centered reading column
   of click-to-expand checklist statements. FDEC identity (navy #20262d / red #C8102E)
   in light; same identity re-grounded on a deep slate surface for dark. */
:root{
  /* brand constants (same in both themes) */
  --navy:#20262d; --navy2:#3a424d; --red:#C8102E; --red2:#9E0C24;
  --ok:#1f7a3d;
  /* deficiency class hues */
  --crit:#C8102E; --imp:#b4690e; --noncrit:#20262d; --comment:#5c6470;
  /* themed surface tokens — light */
  --bg:#eef1f4; --card:#ffffff; --ink:#1a1a1a; --muted:#5c6470;
  --line:#dfe3e8; --line2:#e4e7ea; --shade:#f4f6f8; --pink:#f7e9ea;
  --masthead:#20262d; --masthead-ink:#ffffff;
  --sectionbar:#20262d; --sectionbar-ink:#ffffff;
  --numchip:#eef2f8; --numchip-ink:#20262d;
  --stmt-open:#eef4fb; --stmt-hover:#f5f8fd; --body-bg:#fbfcfe;
  --tab-border:#dfe3e8; --reftag-bg:#fdecec; --reftag-ink:#9E0C24;
  --accent-rail:#C8102E; --tag-ink:#ffffff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1824; --card:#17222f; --ink:#e7ecf2; --muted:#9aa7b6;
  --line:#2b3a4c; --line2:#223040; --shade:#1b2735; --pink:#3a2228;
  --masthead:#15191e; --masthead-ink:#f1f4f9;
  --sectionbar:#23282f; --sectionbar-ink:#eaf0f8;
  --numchip:#22344c; --numchip-ink:#aec6e8;
  --stmt-open:#1d2c3e; --stmt-hover:#1b2a3a; --body-bg:#141f2b;
  --tab-border:#2b3a4c; --reftag-bg:#3a2224; --reftag-ink:#f0b3b0;
  --accent-rail:#e04b5f;
  --ok:#4caf6e; --crit:#e06663; --imp:#d6a44a; --noncrit:#7ba4dd; --comment:#9aa7b6;
  --tag-ink:#10151c;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1824; --card:#17222f; --ink:#e7ecf2; --muted:#9aa7b6;
  --line:#2b3a4c; --line2:#223040; --shade:#1b2735; --pink:#3a2228;
  --masthead:#15191e; --masthead-ink:#f1f4f9;
  --sectionbar:#23282f; --sectionbar-ink:#eaf0f8;
  --numchip:#22344c; --numchip-ink:#aec6e8;
  --stmt-open:#1d2c3e; --stmt-hover:#1b2a3a; --body-bg:#141f2b;
  --tab-border:#2b3a4c; --reftag-bg:#3a2224; --reftag-ink:#f0b3b0;
  --accent-rail:#e04b5f;
  --ok:#4caf6e; --crit:#e06663; --imp:#d6a44a; --noncrit:#7ba4dd; --comment:#9aa7b6;
  --tag-ink:#10151c;
}
*{box-sizing:border-box}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
button{font-family:inherit}

/* top bar */
.topbar{background:var(--masthead);color:var(--masthead-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.25);gap:10px}
.topbar .brand{font-weight:800;letter-spacing:.3px;font-size:15px;line-height:1.2;min-width:0}
.topbar .brand small{display:block;font-weight:400;font-size:11px;opacity:.85}
.topbar .ed{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);border-radius:6px;
  padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;flex:none}

/* search */
.searchbar{background:var(--card);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:sticky;top:calc(46px + env(safe-area-inset-top,0px));z-index:45}
.searchbar input{width:100%;max-width:500px;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font-size:16px;
  background:var(--bg);color:var(--ink)}
.searchbar input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(43,74,128,.2)}

/* tabs */
.tabs{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:sticky;top:calc(94px + env(safe-area-inset-top,0px));z-index:40;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;background:var(--card);border:1.5px solid var(--tab-border);border-radius:8px;padding:9px 15px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .12s}
.tabs button:hover{border-color:var(--navy2);color:var(--ink);background:var(--stmt-hover)}
.tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(31,56,100,.35)}
.tabs button:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}

/* content */
.wrap{max-width:900px;margin:0 auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.formhead{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent-rail);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.formhead .code{font-size:11px;font-weight:700;color:var(--crit);letter-spacing:.5px;text-transform:uppercase}
.formhead .ttl{font-size:17px;font-weight:800;color:var(--ink);margin-top:2px;text-wrap:balance}
.formhead .freq{font-size:12.5px;color:var(--muted);margin-top:4px}

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:12px}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .dot{width:12px;height:12px;border-radius:3px;flex:none}

.section-h{font-size:13px;font-weight:700;color:var(--sectionbar-ink);background:var(--sectionbar);padding:7px 13px;border-radius:6px 6px 0 0;margin-top:14px}
.section-body{border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;overflow:hidden;background:var(--card)}
.section-note{font-size:11.5px;color:var(--muted);font-style:italic;padding:7px 13px;background:var(--shade);border-top:1px solid var(--line2)}

/* each clickable statement */
.stmt{border-bottom:1px solid var(--line2)}
.stmt:last-child{border-bottom:none}
.stmt-head{display:grid;grid-template-columns:34px minmax(0,1fr) 24px;align-items:center;cursor:pointer;padding:0;gap:0;transition:background .1s}
.stmt-head:hover{background:var(--stmt-hover)}
.stmt-head:focus-visible{outline:2px solid var(--navy2);outline-offset:-2px}
.stmt-head .num{background:var(--numchip);color:var(--numchip-ink);font-weight:700;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-right:1px solid var(--line2);font-variant-numeric:tabular-nums}
.stmt-head .label{padding:11px 10px;font-size:13px;min-width:0}
.stmt-head .chev{color:var(--muted);font-size:13px;text-align:center;transition:transform .18s}
.stmt.open .stmt-head{background:var(--stmt-open)}
.stmt.open .chev{transform:rotate(90deg);color:var(--navy2)}
.stmt-body{display:none;padding:4px 14px 16px 44px;background:var(--body-bg);border-top:1px solid var(--line2)}
.stmt.open .stmt-body{display:block}
@media (prefers-reduced-motion:no-preference){
  .stmt.open .stmt-body{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
}

.block{margin-top:12px}
.block .bh{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.block .bt{font-size:13px;line-height:1.5}
.block.howto .bh::before{content:"✓";color:var(--ok);font-weight:900}
.block.ref .bh::before{content:"§";color:var(--crit);font-weight:900}
.block.def .bh::before{content:"!";color:var(--tag-ink);font-weight:900;background:var(--imp);width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.ref-tag{display:inline-block;background:var(--reftag-bg);color:var(--reftag-ink);border-radius:5px;padding:2px 8px;font-size:12px;font-weight:700;margin:2px 4px 2px 0;font-family:"Consolas","Courier New",monospace}
.def-tag{display:inline-block;color:var(--tag-ink);border-radius:5px;padding:2px 9px;font-size:11px;font-weight:700;margin-right:6px;vertical-align:middle}
.def-tag.critical{background:var(--crit)}
.def-tag.impairment{background:var(--imp)}
.def-tag.noncritical{background:var(--noncrit)}
.def-tag.comment{background:var(--comment)}
.def-tag.varies{background:#6a3d9a}
.def-line{margin-top:5px}
.def-line:first-child{margin-top:0}

.no-results{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.disclaimer{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.5}
.disclaimer b{color:var(--ink)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}

@media(max-width:640px){
  .wrap{padding-block:12px}
  .stmt-head{grid-template-columns:28px minmax(0,1fr) 22px}
  .stmt-body{padding:4px 12px 14px 12px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">FIRE DEFENSE EQUIPMENT CO., INC.<small>ITM Standard Operating Procedure</small></div>
  <div class="ed">NFPA 25 · 2026 Ed.</div>
</div>

<div class="searchbar">
  <input id="search" type="text" placeholder="Search a task, keyword, or NFPA section (e.g. 'main drain', 'tamper', '13.3')…">
</div>

<div class="tabs" id="tabs"></div>

<div class="wrap" id="host"></div>

<footer id="foot"></footer>

<script>
/* ============================================================================
   FDEC ITM SOP — NFPA 25 (2026 edition) task guidance
   Each checklist statement carries: how-to, NFPA reference(s), deficiency class.

   Deficiency classes per NFPA 25 2026, Chapter 15 (Evaluation / classification):
     Critical    — materially affects system performance / reliability; immediate
                   action & AHJ/owner notification (15.x critical deficiency)
     Impairment  — condition that renders all or part of the system out of service
                   (Chapter 15 impairment; see also Ch. 3 definitions)
     Non-Critical— does not materially affect performance but still must be
                   documented & corrected
     Comment     — informational note / recommendation (not a code deficiency)

   NOTE ON SECTION NUMBERS: Chapter architecture is stable across recent editions
   (Ch.5 pipe/heads, Ch.13 valves/drains/FDC/alarms, Ch.14 impairments,
   Ch.15 evaluation). Sub-section numbers can shift between editions — verify
   against the adopted edition before citing to an AHJ.
============================================================================ */

/* Reusable guidance fragments shared across the frequency forms ------------- */
const G = {
  monitored:{
    how:"Confirm whether a listed central/remote supervising station monitors the system. Check for a dialer/communicator, cellular/IP radio, or panel annunciation. This drives who must be notified before and after testing. FDEC recommends all waterflow and supervisory devices be monitored.",
    ref:["NFPA 25 13.2 (alarm devices)","IBC 901.6 / 903.4"],
    def:[["comment","Not a deficiency if unmonitored — note the condition and FDEC's monitoring recommendation."]]
  },
  panelNormal:{
    how:"Before touching anything, read the fire alarm panel: it must show normal (no trouble/supervisory/alarm). Confirm the suppression system is in service (control valves open, pressures normal). Document any pre-existing trouble/alarm so it isn't attributed to your work.",
    ref:["NFPA 25 4.1 (responsibilities)","NFPA 72 (panel status)"],
    def:[["critical","System or panel NOT in service / in alarm or trouble on arrival that impairs protection — Impairment; tag and notify owner/AHJ before proceeding."],["noncritical","Minor trouble not affecting water-based protection — document and report."]]
  },
  dispatchNotify:{
    how:"Call local dispatch and/or the monitoring company to place the account on TEST before activating any alarm-initiating device. Record who you spoke with and the time. Restore from test at the end.",
    ref:["NFPA 25 4.1 (ITM responsibilities / coordination)","NFPA 72 (test notification)"],
    def:[["comment","Procedural step — not a system deficiency. Failure to notify is a work-practice issue, not an NFPA 25 deficiency."]]
  },
  partiesNotify:{
    how:"Notify the building owner/occupant representative and any affected parties before testing so occupants aren't alarmed and no response is dispatched in error.",
    ref:["NFPA 25 4.1","NFPA 25 Ch.15 (impairment coordination)"],
    def:[["comment","Coordination step — not a system deficiency."]]
  },
  contactField:{
    how:"Record the agency/company name, phone, and the name or badge/ID of the person who confirmed the test account. This is your proof of proper coordination.",
    ref:["NFPA 25 4.1 (records)","NFPA 25 Ch.4 (documentation)"],
    def:[["comment","Recordkeeping field — not a deficiency."]]
  },
  hydraulicPlate:{
    how:"Locate the hydraulic design nameplate at the riser (hydraulically designed systems). Verify it is securely attached and legible — design area, density, flow/pressure. Photograph if faded.",
    ref:["NFPA 25 5.2.6 (hydraulic nameplate inspection)"],
    def:[["noncritical","Missing, illegible, or detached nameplate — Non-Critical deficiency; recommend replacement."]]
  },
  systemsIdentified:{
    how:"Verify each additional system type at the riser is labeled — Dry, Antifreeze, Pre-action, Deluge, etc. Signage must identify what each valve/riser serves so responders and future techs aren't guessing.",
    ref:["NFPA 25 13.3.1 (valve identification signs)","NFPA 13 (sign requirements)"],
    def:[["noncritical","Missing/incorrect system identification signage — Non-Critical; recommend corrective signage."]]
  },
  valvesIdentified:{
    how:"Confirm all control valves, sectional valves, main drains, auxiliary (low-point) drains, ITVs, and drum drips are identified with durable signs and are accessible. Each control valve needs a sign naming what it controls.",
    ref:["NFPA 25 13.3.1 (identification signs)"],
    def:[["noncritical","Missing valve ID signs or blocked access — Non-Critical; if access is fully obstructed so the valve cannot be operated, treat as Critical."],["critical","Control valve inaccessible/unable to be operated — Critical."]]
  },
  fdcIdentified:{
    how:"Locate the FDC; confirm it is visible from the approach, identified (e.g., 'AUTO SPKR'), and the sign/placard matches the system it serves.",
    ref:["NFPA 25 13.7.1 (FDC inspection)","NFPA 25 13.7.1 identification sign"],
    def:[["noncritical","FDC not identified or sign missing — Non-Critical.","critical","FDC obstructed/not visible or inaccessible to responding apparatus — Critical."]]
  },
  faInspected:{
    how:"Confirm the fire alarm system has a current (within 12 months) inspection/test tag. Record date and by whom. Fire alarm ITM is NFPA 72 scope — note if overdue so the owner can schedule.",
    ref:["NFPA 72 Ch.14 (fire alarm ITM)","NFPA 25 13.2 (coordination w/ alarm devices)"],
    def:[["noncritical","Fire alarm inspection overdue — document; NFPA 72 scope. Note for owner."]]
  },
  pumpInspected:{
    how:"Confirm the fire pump has a current annual test tag. Record date/by. Fire pump ITM is NFPA 25 Chapter 8 scope. Mark N/A if no pump.",
    ref:["NFPA 25 Ch.8 (fire pumps)"],
    def:[["noncritical","Fire pump annual testing overdue — document; recommend scheduling."]]
  },
  internalPipe5yr:{
    how:"Record the date of the last 5-year internal pipe/obstruction investigation and by whom. This is an inspection-interval tracking field — if overdue, flag it. See FD-24.",
    ref:["NFPA 25 14.2 (internal inspection of piping, 5-yr)","NFPA 25 14.3 (obstruction investigation)"],
    def:[["noncritical","5-year internal inspection overdue — Non-Critical; schedule investigation."]]
  },
  fdcHydro5yr:{
    how:"Record the date of the last 5-year FDC piping hydrostatic test. 2026 note: short FDC runs are now exempt up to 10 ft (was 4 ft) — visual inspection acceptable for runs ≤10 ft. See FD-25.",
    ref:["NFPA 25 13.7.3 (FDC piping hydrostatic test, 5-yr)","2026: exemption raised 4 ft → 10 ft"],
    def:[["noncritical","5-year FDC hydrostatic test overdue (where required) — Non-Critical; schedule."]]
  },
  standpipeInspected:{
    how:"Confirm standpipe system has a current annual inspection tag. Record date/by. Standpipe ITM is NFPA 25 Chapter 6. Mark N/A if none.",
    ref:["NFPA 25 Ch.6 (standpipe & hose systems)"],
    def:[["noncritical","Standpipe annual ITM overdue — document; recommend scheduling."]]
  },
  backflow3yr:{
    how:"Confirm the backflow preventer (DCVA/DCDA/RPZ/RPDA) has a forward-flow/function test within the required interval (annual forward-flow per NFPA 25; local cross-connection authority often requires annual certification — Michigan typically annual). Record last test date/by.",
    ref:["NFPA 25 13.6 (backflow prevention assemblies)","Local cross-connection rule (often annual)"],
    def:[["noncritical","Backflow test overdue — Non-Critical; schedule forward-flow/certification test."],["critical","Backflow isolating the system or failing to pass forward flow — Critical if water supply is impaired."]]
  },
  exerciseValves:{
    how:"Fully operate (close and reopen) each accessible control and sectional valve through its full travel; lubricate OS&Y stems where needed. Return to normal-open and confirm no binding. Re-verify supervisory signal after exercising.",
    ref:["NFPA 25 13.3.4 (control valve maintenance / annual operation)"],
    def:[["critical","Valve seized, will not fully open, or left partially closed — Critical (impairs water supply)."],["noncritical","Valve stiff/needs lubrication but operable — Non-Critical."]]
  },
  tamperVerify:{
    how:"Operate each supervisory (tamper) switch: the signal must register at the panel within the first two revolutions of the handwheel (or two threads of a stem). Restore and confirm clearing. Where not monitored, confirm the valve is locked or sealed in the open position.",
    ref:["NFPA 25 13.3.3.5 (valve supervisory switch test)","NFPA 72 (supervisory signal)"],
    def:[["critical","Tamper switch fails to signal — Critical (loss of valve supervision)."],["noncritical","Signals late (beyond 2 revolutions) — Non-Critical; adjust.","comment","Locked/sealed in lieu of supervision is acceptable where permitted."]]
  },
  waterflowITV:{
    how:"Open the inspector's test valve (ITV) — the farthest/most-remote test connection sized to the smallest orifice sprinkler — to flow water and actuate the waterflow switch. Confirm alarm. On dry systems the ITV simulates one head opening.",
    ref:["NFPA 25 13.2.3.2 (waterflow alarm test via ITV)"],
    def:[["critical","Waterflow alarm fails to activate on flow — Critical."],["noncritical","Alarm delayed beyond limits/intermittent — Non-Critical; adjust/repair."]]
  },
  fdcAlarmDevices:{
    how:"Verify any local alarm device(s) associated with the FDC/riser (water motor gong, electric bell) operate during the flow test.",
    ref:["NFPA 25 13.2.3 (alarm device test)"],
    def:[["noncritical","Local alarm device inoperative — Non-Critical (if monitored alarm still functions); Critical if it is the only alarm means."]]
  },
  fdcDamage:{
    how:"Inspect the FDC for damage, corrosion, seized swivels, obstructions, and missing/damaged caps or plugs. Confirm the check valve/ball drip is not leaking and couplings are intact.",
    ref:["NFPA 25 13.7.1 (FDC inspection)"],
    def:[["noncritical","Missing caps, minor corrosion, stiff swivels — Non-Critical.","critical","Obstructed/damaged FDC unusable by responders, or leaking check valve — Critical."]]
  },
  fdcLube:{
    how:"Lubricate FDC swivels and caps; remove any debris from the interior and confirm the clapper/check moves freely and the connection is clear of foreign material.",
    ref:["NFPA 25 13.7.2 (FDC maintenance)"],
    def:[["noncritical","Interior obstruction or seized swivel found — Non-Critical; correct and re-inspect.","critical","FDC interior fully obstructed — Critical."]]
  },
  waterflowTime:{
    how:"Time, in seconds, from the start of flow at the ITV until the waterflow alarm signals. Vane-type should respond within ~90 seconds; record per riser. Use the per-riser fields.",
    ref:["NFPA 25 13.2.3.2 (waterflow alarm — ≤90 sec)"],
    def:[["noncritical","Alarm time exceeds 90 seconds — Non-Critical; adjust retard/switch.","critical","No alarm — Critical."]]
  },
  faDevices:{
    how:"Record which building fire alarm notification/annunciation devices activated during the flow test (horn/strobe, horn, bell, other) to confirm the waterflow signal propagates to the building system.",
    ref:["NFPA 72 Ch.14","NFPA 25 13.2.3"],
    def:[["noncritical","Expected building notification did not activate — Non-Critical/coordinate with NFPA 72 scope."]]
  },
  centralVerify:{
    how:"Confirm with the supervising station that the correct signals (waterflow, supervisory, trouble) were received during testing. Record who verified (customer, FDEC, or N/A).",
    ref:["NFPA 25 13.2.3","NFPA 72 (off-premises signal verification)"],
    def:[["critical","Signal not received by monitoring station — Critical (loss of notification)."]]
  },
  waterGauge5yr:{
    how:"Confirm water gauges are within 5 years of manufacture/replacement (or tested/calibrated). Record quantity replaced and dates. Gauges reading inaccurately mask supply problems.",
    ref:["NFPA 25 13.2.7 (gauges — replace/test every 5 yr)"],
    def:[["noncritical","Gauge over 5 years and not tested — Non-Critical; replace or calibrate."]]
  },
  airGauge5yr:{
    how:"Confirm air/nitrogen gauges (dry/preaction) are within 5 years of manufacture/replacement or calibrated. Record quantity/dates.",
    ref:["NFPA 25 13.2.7 (gauges — 5-yr)"],
    def:[["noncritical","Air gauge over 5 years, not tested — Non-Critical; replace/calibrate."]]
  },
  drainage:{
    how:"Before the main drain test, confirm the drain discharges to a point that can handle full flow without property damage or hazard (floor drain, exterior). Never flow where water will cause damage or freeze a walkway.",
    ref:["NFPA 25 13.2.5 (main drain test)"],
    def:[["comment","Site condition — note if drainage is inadequate; not itself a system deficiency."]]
  },
  staticBegin:{
    how:"With the system static (no flow), record the beginning static pressure (psi) at the gauge before opening the main drain.",
    ref:["NFPA 25 13.2.5 (main drain test — record pressures)"],
    def:[["comment","Data field — the reading itself isn't a deficiency; see residual-reduction item."]]
  },
  residual:{
    how:"Fully open the main drain and, once the gauge stabilizes under full flow, record the residual (flowing) pressure (psi).",
    ref:["NFPA 25 13.2.5"],
    def:[["comment","Data field — evaluated under the 10% reduction item."]]
  },
  returnStatic:{
    how:"Close the main drain slowly and record the pressure the system returns to (should return to ~beginning static).",
    ref:["NFPA 25 13.2.5"],
    def:[["noncritical","Fails to return to prior static / slow return — Non-Critical; indicates possible closed/obstructed supply valve — investigate (may be Critical)."]]
  },
  returnTime:{
    how:"Record the time in seconds for the gauge to return to static after closing the drain. A sluggish return can indicate a partially closed supply valve or obstruction.",
    ref:["NFPA 25 13.2.5"],
    def:[["noncritical","Abnormally slow return — Non-Critical; investigate supply valve/obstruction."]]
  },
  lastResidual:{
    how:"Record the last recorded residual pressure from the previous main drain test (from the prior report) so the current reading can be compared for a 10% reduction.",
    ref:["NFPA 25 13.2.5 (comparison to previous results)"],
    def:[["comment","Reference data for the 10% comparison."]]
  },
  residualCalc:{
    how:"Compare current residual to the previous recorded residual. A reduction greater than 10% from the original or previous test requires investigation to find the cause (closed/throttled valve, obstruction, supply change).",
    ref:["NFPA 25 13.2.5 (investigate >10% reduction)"],
    def:[["critical","≥10% reduction with cause being a closed/obstructed supply valve — Critical (supply impaired)."],["noncritical","≥10% reduction, cause under investigation / supply-side change — Non-Critical pending findings."]]
  },
  pipeVisual:{

  checkValveInternal:{

  gaugesReplaced:{

    def:[["noncritical","Gauges not replaced at 5-yr interval — Non-Critical."]]
  },
  valveStatusReadings:{

  valvesNormalPos:{

    def:[["comment","Baseline/condition note."]]
  }

/* ============================================================================
   RENDER
============================================================================ */
const DEFLABEL={critical:"Critical",impairment:"Impairment",noncritical:"Non-Critical",comment:"Comment / Note",varies:"Varies"};
let ACTIVE=FORMS[0].id;
let QUERY="";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function resolve(it){ // returns {how, ref, def}
  if(it.g && typeof it.g==='string'){ const g=G[it.g]; if(g) return g; }
  if(it.g && typeof it.g==='object') return it.g;
  return {how:"", ref:[], def:[]};
}

function buildTabs(){
  const host=document.getElementById('tabs'); host.innerHTML='';
  FORMS.forEach(f=>{
    const b=document.createElement('button');
    b.className=(f.id===ACTIVE?'active':'');
    b.textContent=f.code+' · '+f.freq;
    b.onclick=()=>{ ACTIVE=f.id; QUERY=''; document.getElementById('search').value=''; buildTabs(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
    host.appendChild(b);
  });
}

function legend(){
  const items=[
    ["critical","Critical — immediate action; impairs performance"],
    ["impairment","Impairment — system/part out of service"],
    ["noncritical","Non-Critical — document & correct"],
    ["comment","Comment — informational / recommendation"]
  ];
  return `<div class="legend">${items.map(([c,t])=>`<span class="lg"><span class="dot" style="background:${defColor(c)}"></span>${esc(t)}</span>`).join('')}</div>`;
}
function defColor(c){return {critical:'#C8102E',impairment:'#b4690e',noncritical:'#20262d',comment:'#5c6470',varies:'#6a3d9a'}[c]||'#5c6470';}

function matchesQuery(f, sec, it){
  if(!QUERY) return true;
  const q=QUERY.toLowerCase();
  const r=resolve(it);
  const hay=[it.text, sec.name, f.code, f.title, r.how, (r.ref||[]).join(' '),
    (r.def||[]).map(d=>d.join(' ')).join(' ')].join(' ').toLowerCase();
  return hay.includes(q);
}

function render(){
  const f=FORMS.find(x=>x.id===ACTIVE);
  const host=document.getElementById('host');
  let html=`<div class="formhead">
    <div class="code">${esc(f.code)} — ${esc(f.freq)} Inspection</div>
    <div class="ttl">${esc(f.title)}</div>
    <div class="freq">Tap any statement below for how to complete it per NFPA 25 (2026), the code reference, and the proper deficiency classification.</div>
  </div>`;
  html+=legend();

  let anyShown=false;
  f.sections.forEach(sec=>{
    const visItems=sec.items.filter(it=>matchesQuery(f,sec,it));
    if(!visItems.length) return;
    anyShown=true;
    html+=`<div class="section-h">${esc(sec.name)}</div><div class="section-body">`;
    visItems.forEach(it=>{
      const r=resolve(it);
      html+=`<div class="stmt" data-stmt>
        <div class="stmt-head" data-head>
          <div class="num">${esc(String(it.n))}</div>
          <div class="label">${esc(it.text)}</div>
          <div class="chev">▶</div>
        </div>
        <div class="stmt-body">
          ${r.how?`<div class="block howto"><div class="bh">How to complete</div><div class="bt">${esc(r.how)}</div></div>`:''}
          ${(r.ref&&r.ref.length)?`<div class="block ref"><div class="bh">NFPA reference</div><div class="bt">${r.ref.map(x=>`<span class="ref-tag">${esc(x)}</span>`).join('')}</div></div>`:''}
          ${(r.def&&r.def.length)?`<div class="block def"><div class="bh">Deficiency per NFPA 25</div><div class="bt">${r.def.map(d=>defLine(d)).join('')}</div></div>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  });

  if(!anyShown){
    html+=`<div class="no-results">No statements match "${esc(QUERY)}". Try another keyword or NFPA section number.</div>`;
  }

  html+=`<div class="disclaimer">
    <b>About this SOP.</b> Guidance is written to the <b>NFPA 25, 2026 edition</b> (current published edition) and references NFPA 13 and NFPA 72 where those standards govern. Deficiency classes follow NFPA 25 Chapter 15 evaluation: <b>Critical</b>, <b>Non-Critical</b>, and <b>Impairment</b> (plus informational <b>Comments</b>). Sub-section numbers can shift between editions — always confirm against the edition your AHJ has adopted before citing to an inspector. This tool is a field aid for FDEC technicians and does not replace the standard, manufacturer instructions, or the technician's NICET-level judgment.
  </div>`;

  host.innerHTML=html;

  // wire expand/collapse
  host.querySelectorAll('[data-stmt]').forEach(s=>{
    const head=s.querySelector('[data-head]');
    head.onclick=()=>{ s.classList.toggle('open'); };
  });
  // auto-expand when searching so matches are visible
  if(QUERY){ host.querySelectorAll('[data-stmt]').forEach(s=>s.classList.add('open')); }
}

function defLine(d){
  const cls=d[0], txt=d[1];
  // text may contain multiple class/text pairs flattened; render first tag + text
  return `<div class="def-line"><span class="def-tag ${cls}">${esc(DEFLABEL[cls]||cls)}</span>${esc(txt)}</div>`;
}

document.getElementById('search').addEventListener('input',e=>{ QUERY=e.target.value.trim(); render(); });

document.getElementById('foot').textContent='© 2026 Fire Defense Equipment Company, Inc. · Internal ITM field reference · Built to NFPA 25 (2026 ed.)';

buildTabs();
render();
</script>
